    });
  }
  function asyncTotHTML(res, i, N) {
    const left = N - 1 - i;
    const tail = left > 0 ? `<b>${left}</b> ${left === 1 ? 'question' : 'questions'} to go` : funOn() ? 'just for fun' : 'all done!';
    return `<div class="tot2"><b>${fmtPts(asyncTotal())}</b> ${left > 0 ? 'so far' : 'total'} · ${tail}</div>`;
  }

  // The room's meta: the close (or a close time, or a reopen). A player watching a reveal finishes it first; Next routes.
  function onMeta(m) {
    if (!active || !A) return;
    if (!m) { kicked({ title: 'This game has ended', text: `The host has taken game ${code} down.` }); return; }
    const was = A.meta || {};
    A.meta = m; room.meta = m;
    const flipped = (was.status === 'closed') !== (m.status === 'closed');
    if (flipped) { A.live = null; A.liveMine = null; }
    if (m.status !== 'closed') { A.final = null; A.mine = null; if (!(A.liveMine && openEnded())) A.headTotal = null; }
    else if (!flipped && m.talliedAt !== was.talliedAt && A.final) {   // the board was counted again (a fixed price, a removed player)
      A.final = null;
      if (!funOn() && ['aresults', 'await'].includes(room.state && room.state.phase)) { A.screenN++; asyncRoute(); return; }
    }
    if (flipped && m.status === 'closed') notifyClosed();
    if (funOn()) {   // reopened while this phone shows its just-for-fun score: those guesses count now (see adoptFun)
      if (flipped && m.status !== 'closed' && room.state && room.state.phase === 'udone') { A.fun.on = false; saveProg(); A.screenN++; asyncRoute(); }
      return;
    }
    const ph = room.state && room.state.phase;
    // a close time set or cleared under a player who's finished: the done screen and the standings so far trade places
    if (!flipped && pid && A.prog.done && ((ph === 'adone' && openEnded()) || ((ph === 'aresults' || ph === 'alive') && !isClosed() && !openEnded()))) { A.screenN++; asyncRoute(); return; }
    if (ph === 'reveal' && (flipped || closingNow())) { A.defer = true; markNext(); return; }
    if (flipped || ph === 'item' && closingNow() || ['aintro', 'adone', 'aclosing', 'await'].includes(ph)) {
      if (flipped || ph === 'item' || ph === 'aintro' && closingNow()) asyncRoute();
      else if (cur && cur.update) cur.update(room.players[pid] || {});
    }
  }
  async function loadFinal() {
    const b = abase() + '/async/final';
    try {
      const [info, board, poll, mine, crowd] = await Promise.all([store.get(b + '/info'), store.get(b + '/board'), store.get(b + '/poll'), pid ? store.get(b + '/players/' + pid) : Promise.resolve(null), store.get(b + '/crowd')]);
      if (!info) { setTimeout(() => { if (active && isClosed() && !A.final) loadFinal(); }, 5000); return; }
      A.final = { info, board: ents(board).map(([, e]) => e).filter(e => e && e.name), poll: POLL.options.map((_, k) => (poll && poll[k]) || { n: 0, names: [] }), crowd: crowd || null };
      A.mine = mine && typeof mine.rank === 'number' ? mine : null;
      A.headTotal = A.mine ? A.mine.total : null;
      if (isClosed() && !funOn()) asyncRoute();
    } catch (e) { console.warn('[final]', e); setTimeout(() => { if (active && isClosed() && !A.final) loadFinal(); }, 8000); }
  }
  // No close time: the standings so far, counted on this phone from the whole room (the console's own tally, with the
  // closest-guess bonuses among everyone who's played). Ranked: the people who've finished. This phone's own guesses
  // and finish count even if its writes are still on the way. Counted again on a reload or "Refresh the standings".
  let liveBusy = false;
  async function loadLive(manual) {
    if (liveBusy || !A || !pid) return;
    liveBusy = true;
    try {
      const r = await getWithin(abase(), 20000);
      if (!active || !A) return;
      if (!r || !r.meta) return;   // (the meta poll says the game's gone)
      if (!r.players || !r.players[pid] || !r.players[pid].name) return removedByHost();
      const P = A.prog, gs = {}, pl = Object.assign({}, r.players);
      ents(r.guesses).forEach(([k, byPid]) => { gs[k] = Object.assign({}, byPid); });
      for (let k = 0; k < A.n; k++) if (P.g[k] > 0) { gs[k] = gs[k] || {}; gs[k][pid] = { v: P.g[k], t: (gs[k][pid] && gs[k][pid].t) || 0 }; }
      pl[pid] = Object.assign({}, pl[pid], { done: true, i: A.n });
      if (r.async && r.async.prices) A.prices = r.async.prices;   // (a price the host fixed since this page opened)
      const T = asyncTally(Object.assign({}, r, { guesses: gs, players: pl }));
      const fin = T.list.filter(e => pl[e.pid] && pl[e.pid].done).map(e => Object.assign({}, e));
      let rk = 0, lastV = null; fin.forEach((e, k) => { if (e.total !== lastV) { rk = k + 1; lastV = e.total; } e.rank = rk; });
      const me = fin.find(e => e.pid === pid), mp = T.final.players[pid];
      A.live = { info: { live: true, count: fin.length, items: A.n, bonus: T.final.info.bonus, playing: T.list.length - fin.length, at: clockNow() },
        board: fin.slice(0, 10).map(e => ({ pid: e.pid, name: e.name, total: e.total, rank: e.rank })), poll: T.final.poll, crowd: T.final.crowd };
      A.liveMine = me && mp ? { rank: me.rank, total: me.total, bonus: mp.bonus, closest: mp.closest } : null;
      rebuildResults();
      if (openEnded() && A.prog.done && !funOn()) { A.screenN++; asyncRoute(); }
    } catch (e) {
      console.warn('[standings]', e);
      if (manual) toast("Couldn't refresh the standings. Check your connection and try again.");
      else if (!A.live) setTimeout(() => { if (active && A && openEnded() && !A.live) loadLive(); }, 8000);
    } finally { liveBusy = false; }
  }

  /* ---------- sound: a play-anytime phone has no big screen, so it plays the effects itself (on unless muted) ---------- */
  let sndBtn = null;
  function setupSound() {
    if (sndBtn) return;
    Sfx.useKey('tpib:psound');   // (its own switch, apart from a big screen's in the same browser)
    const wake = () => { if (Sfx.on && !Sfx.ready) Sfx.unlock(); };   // browsers only start sound on a tap or a key
    ['pointerdown', 'touchend', 'keydown'].forEach(t => addEventListener(t, wake, { capture: true, passive: true }));
    sndBtn = document.createElement('button'); sndBtn.type = 'button'; sndBtn.className = 'p-snd';
    sndBtn.addEventListener('click', e => { e.stopPropagation(); Sfx.on = !Sfx.on; if (Sfx.on) setTimeout(() => Sfx.pop(), 60); paintSnd(); });
    document.body.appendChild(sndBtn); document.body.classList.add('has-snd');
    paintSnd();
  }
  function paintSnd() {
    if (!sndBtn) return;
    sndBtn.innerHTML = Sfx.on ? ICON.soundOn : ICON.soundOff;
    sndBtn.classList.toggle('off', !Sfx.on);
    sndBtn.setAttribute('aria-pressed', String(!Sfx.on));
    sndBtn.setAttribute('aria-label', 'Mute sound'); sndBtn.title = Sfx.on ? 'Sound on: tap to mute' : 'Sound off: tap to turn it on';
  }

  function notifyClosed() {
    if (!A.notify || !('Notification' in window) || Notification.permission !== 'granted') return;
    try { new Notification('The Price Is Bright', { body: 'The results are in! Come see where you landed.', tag: 'tpib-' + code }); } catch (e) { /* ignore */ }
  }

  // A safety net for the plain requests: if this page can read the game but its writes are refused (a company proxy, an
  // old browser), switch to the Firebase SDK, the way the live game talks to the database. It holds a connection, so
  // it's only for the pages that need it.
  let sdkTried = false;
  async function sdkInstead() {
    if (sdkTried || !store || store.mode !== 'rest' || !store.stats || Date.now() - store.stats.readAt > 30000) return false;
    try { await store.get(abase() + '/meta'); } catch (e) { return false; }   // reads fail too: just offline, so keep trying as we are
    sdkTried = true;
    const old = store;
    try {
      await initStore();
      if (store.mode !== 'firebase') throw new Error('no SDK');
      console.warn('[database] writes were refused over plain requests: using the Firebase SDK on this page');
      if (unsub) { unsub(); unsub = store.on(abase() + '/meta', onMeta); }   // (realtime from here: no .now)
      return true;
    } catch (e) { console.warn('[database] SDK fallback failed', e); store = old; sdkTried = false; return false; }
  }

  // The host removed this player: stop saving, take back what our own writes brought back since, and say so.
  function removedByHost() {
    if (!A || !pid || pid === 'pfun') return;
    A.pend = {}; clearTimeout(retryT); showSaving(false);
    const up = { ['players/' + pid]: null };
    for (let k = 0; k < A.n; k++) up[`guesses/${k}/${pid}`] = null;
    store.update(abase(), up);
    KV.del(progKey());
    kicked({ title: "You've left the game", text: 'The host removed you from this game. If that was a mistake, you can join again.' });
  }

  // The board so far, for the done screen: one read of the room's players (refreshed now and then while it's open).

      const all = ents(pl).filter(([, p]) => p && p.name);
      if (pid && !all.some(([q]) => q === pid)) return removedByHost();
      const fin = all.filter(([q, p]) => p.done || q === pid).map(([q, p]) => ({ pid: q, name: p.name, total: q === pid ? asyncTotal() : (+p.total || 0) }));
      fin.sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
      let r = 0, lastV = null; fin.forEach((e, k) => { if (e.total !== lastV) { r = k + 1; lastV = e.total; } e.rank = r; });
      A.board = { fin, played: all.filter(([, p]) => p.shownAt || typeof p.i === 'number').length };
      if (cur && cur.board) cur.board();
    } catch (e) { console.warn('[board]', e); }
    if (room && room.state && room.state.phase === 'adone' && boardN < 10) boardT = setTimeout(() => { if (!document.hidden) loadBoard(); }, 60000);

  async function asyncJoin(name, fresh) {

  // You vs. the crowd, on the results page (the item pages leave the crowd out): one column per item, the price as the
  // dashed middle line, your guess (a dot) and the crowd's guess (a diamond: the middle guess of everyone who played it)
  // above the line when too high and below when too low, on a ratio scale that stops at 10× either way. Tap a column
  // for its numbers.
  function crowdCardHTML(crowd, live) {
    if (!crowd || typeof crowd !== 'object') return '';   // (a game closed before this was added)
    const P = prog(), N = A.n, W = 340, H = 196, L = 4, R = 4, T = 8, B = 22, cw = (W - L - R) / N, ph = H - T - B, mid = T + ph / 2;
    let span = Math.log10(2);   // the scale reaches the furthest guess shown (at least 2× off, at most 10×)
    for (let k = 0; k < N; k++) { const p = viewAt(k).price, c = crowd[k] || {}; [P.g[k], c.n > 0 ? +c.m : 0].forEach(v => { if (v > 0 && p > 0) span = Math.max(span, Math.abs(Math.log10(v / p)) * 1.12); }); }
    span = Math.min(1, span);
    const yOf = (v, p) => (T + (1 - (clamp(Math.log10(v / p) / span, -1, 1) + 1) / 2) * ph).toFixed(1);
    const off = (v, p) => Math.abs(Math.log(v / p));
    let beat = 0, comp = 0, art = '', hits = '', stars = '', mvN = 0, mvOk = 0;
    for (let k = 0; k < N; k++) {
      const p = viewAt(k).price, g = P.g[k] > 0 ? P.g[k] : 0, c = crowd[k] || {}, cm = c.n > 0 && c.m > 0 ? +c.m : 0;
      const x0 = L + k * cw, xc = (x0 + cw / 2).toFixed(1);
      if (isMovie(A.items[k])) {   // a movie question has no "too high": a star on the line, filled when you got it (tap for the share who did)
        const pv = pickOf({ v: g }), ok = pv > 0 && pv === rightPick(A.items[k]);
        mvN++; if (ok) mvOk++;
        if (k % 2) art += `<rect x="${x0.toFixed(1)}" y="${T}" width="${cw.toFixed(1)}" height="${ph}" class="cc-st"/>`;
        if (pv) stars += `<path d="${XART.starPath(+xc, mid, Math.min(6.5, cw * .46), Math.min(2.8, cw * .2), 5)}" class="cc-mv${ok ? ' ok' : ''}"/>`;
        art += `<text x="${xc}" y="${H - 7}" class="cc-n${A.items[k].double ? ' dbl' : ''}">${k + 1}</text>`;
        hits += `<rect x="${x0.toFixed(1)}" y="0" width="${cw.toFixed(1)}" height="${H}" class="cc-hit" data-k="${k}"/>`;
        continue;
      }
      let win = false;
      if (cm && c.n - (g ? 1 : 0) >= 1) { comp++; if (g && off(g, p) < off(cm, p) - 1e-9) { beat++; win = true; } }
      if (k % 2) art += `<rect x="${x0.toFixed(1)}" y="${T}" width="${cw.toFixed(1)}" height="${ph}" class="cc-st"/>`;
      if (g && cm) art += `<line x1="${xc}" x2="${xc}" y1="${yOf(g, p)}" y2="${yOf(cm, p)}" class="cc-ln${win ? ' win' : ''}"/>`;
      if (cm) { const y = +yOf(cm, p); art += `<path d="M${xc} ${(y - 5.5).toFixed(1)}L${(+xc + 5.5).toFixed(1)} ${y}L${xc} ${(y + 5.5).toFixed(1)}L${(+xc - 5.5).toFixed(1)} ${y}Z" class="cc-cr"/>`; }
      if (g) art += `<circle cx="${xc}" cy="${yOf(g, p)}" r="4.6" class="cc-me${win ? ' win' : ''}"/>`;
      art += `<text x="${xc}" y="${H - 7}" class="cc-n${A.items[k].double ? ' dbl' : ''}">${k + 1}</text>`;
      hits += `<rect x="${x0.toFixed(1)}" y="0" width="${cw.toFixed(1)}" height="${H}" class="cc-hit" data-k="${k}"/>`;
    }
    const head = comp ? `You beat the crowd on ${beat} of ${comp} ${comp === 1 ? 'price' : 'prices'}` : "You're the whole crowd so far!";
    return `<div class="panel p-card a-crowd"><div class="lab2">You vs. the crowd</div><h3 class="p-h a-h3">${head}</h3>
      ${mvN ? `<p class="p-small cc-mvl">Movie questions: you got <b>${mvOk} of ${mvN}</b></p>` : ''}
      <svg class="cc-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Your guess and the crowd's guess on each price, against the price${mvN ? ', and a star for each movie question you got' : ''}">
        <rect x="${L}" y="${T}" width="${W - L - R}" height="${ph}" rx="6" class="cc-bg"/>${art}
        <line x1="${L}" x2="${W - R}" y1="${mid}" y2="${mid}" class="cc-mid"/>${stars}
        <text x="${L + 6}" y="${T + 13}" class="cc-lab">TOO HIGH</text><text x="${L + 6}" y="${T + ph - 6}" class="cc-lab">TOO LOW</text>
        <rect class="cc-sel" x="0" y="${T}" width="${cw.toFixed(1)}" height="${ph}" rx="3" style="display:none"/>${hits}</svg>
      <div class="cc-key"><span><i class="k-me"></i>You</span><span><i class="k-cr"></i>The crowd</span><span><i class="k-pr"></i>The price</span>${mvN ? '<span><i class="k-mv"></i>A movie you got</span>' : ''}</div>
      <p class="p-small cc-cap" data-cap>The crowd is the middle guess of everyone who's played${live ? ' so far' : ''}. Tap an item for the numbers.</p></div>`;

  function wireCrowd(root, crowd) {
    const svg = $('.cc-svg', root); if (!svg) return;
    svg.addEventListener('click', e => {
      const h = e.target.closest('[data-k]'); if (!h) return;
      const k = +h.dataset.k, p = viewAt(k).price, g = prog().g[k] > 0 ? prog().g[k] : 0, c = crowd[k] || {}, cm = c.n > 0 && c.m > 0 ? +c.m : 0;
      const sel = $('.cc-sel', svg); sel.setAttribute('x', h.getAttribute('x')); sel.style.display = '';

          cn.textContent = full || !den ? '' : `${n} of ${den}`;
          nbar.style.transform = `scaleX(${den ? Math.min(1, n / den) : 0})`;
          count.classList.toggle('full', full);
          cstt.textContent = full ? "Everyone's in!" : den ? 'have answered' : 'Waiting for players';
          el.classList.toggle('loud', settingsOf(room).buzzer);
          tick(store.serverNow(), true);
        } else if (s.phase === 'reveal' && here(s)) {

      function tick(now, force) {

        paintCountdown($('.pdp-low .cdl', el), c, s.secs || clockSecsFor(it, settingsOf(room)));
        if (c.mode !== mode) {

          if (c.mode === 'run') { cic.innerHTML = ICON.clock; stt.textContent = 'left to answer'; }
          if (c.mode === 'up') { cic.innerHTML = ICON.lock; sec.textContent = ''; sec.dataset.s = 0; stt.textContent = "Time's up · answers are locked"; paint(); }
        }

      function startReveal(s) {

        later(P.land - e, () => { stage = Math.max(stage, 2); paint(); el.classList.add('lit'); syncCredit(el, true); Glow.wave(); Sfx.sting(); if (res.mult > 1) Glow.burst({ big: true }); });
        later(P.bars - e, () => { stage = 3; paint(); if (res.ok) Sfx.chime(); });

      function land(res, how) {

        el, update, tick,
        mounted() {

  function podium(cls, list, title, sub, st) {

      ${list.length > 3 ? `<div class="fn-rest panel"><h3>Everyone's lights</h3><div class="cols">${rest.map(e => `<div class="r"><b>${e.rank}</b><span>${esc(e.name)}</span>${strOf(e)}<em>${fmtPts(e.total)}</em></div>`).join('')}</div>${list.length > rest.length + 3 ? `<div class="more">and ${list.length - rest.length - 3} more</div>` : ''}</div>` : ''}`);

      for (let k = 0; k < 3; k++) {

      }

  }

  /* ---------- chrome: sound, full screen, host keys ---------- */
  function setupChrome() {
    const snd = $('#snd'), fsb = $('#fsb'), dctrl = $('#dctrl');

      snd.innerHTML = Sfx.on && Sfx.ready ? ICON.soundOn + '<span>Sound on</span>' : ICON.soundOff + '<span>Sound off</span>';
      if (code) reportSound();
    };
    const wake = () => { if (Sfx.on && !Sfx.ready) { Sfx.unlock(); setTimeout(paint, 150); } };
    snd.addEventListener('click', e => { e.stopPropagation(); snd.blur(); if (Sfx.on && !Sfx.ready) Sfx.unlock(); else Sfx.on = !Sfx.on; setTimeout(paint, 150); });
    // (the webkit names and the promise checks keep older Safari happy)
    const full = () => {
      const d = document, el = d.documentElement, ok = r => { if (r && r.catch) r.catch(() => {}); };
      if (d.fullscreenElement || d.webkitFullscreenElement) { const x = d.exitFullscreen || d.webkitExitFullscreen; if (x) ok(x.call(d)); }
      else { const q = el.requestFullscreen || el.webkitRequestFullscreen; if (q) ok(q.call(el)); }
    };
    fsb.addEventListener('click', e => { e.stopPropagation(); fsb.blur(); full(); });
    addEventListener('pointerdown', wake); addEventListener('keydown', wake);
    addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'm' || e.key === 'M') { Sfx.on = !Sfx.on; setTimeout(paint, 150); }
      if (e.key === 'f' || e.key === 'F') full();
    });
    let idle = 0;
    const poke = () => { dctrl.classList.remove('quiet'); document.body.classList.remove('hide-cursor'); clearTimeout(idle); idle = setTimeout(() => { dctrl.classList.add('quiet'); document.body.classList.add('hide-cursor'); }, 3000); };
    addEventListener('mousemove', poke); poke(); paint();
  }

  function becomeHost() {
    ctl = makeController(code);
    store.on(ROOT + '/overrides', o => ctl.setOverrides(o));
    store.on(ROOT + '/encorePool', p => ctl.setPool(p));
    const help = $('#keyhelp');
    help.innerHTML = '<div><kbd>Space</kbd>Next step (also → or a clicker)</div><div><kbd>E</kbd>End the clock now</div><div><kbd>+</kbd>Add 15 seconds</div><div><kbd>S</kbd>Standings / back</div><div><kbd>M</kbd>Sound on or off</div><div><kbd>F</kbd>Full screen</div><div><kbd>?</kbd>Show or hide these keys</div>';
    let helpT = 0;
    const showHelp = ms => { help.classList.remove('off'); clearTimeout(helpT); if (ms) helpT = setTimeout(() => help.classList.add('off'), ms); };
    if (stateOf(room).phase === 'lobby') showHelp(7000);   // a reload mid-game doesn't flash the shortcuts at the audience (? still shows them)
    let last = 0;
    addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const k = e.key, st = stateOf(room), now = Date.now();
      const go = (kind, arg) => { if (now - last < 700) return; last = now; ctl.act(kind, arg); };
      if (k === ' ' || k === 'Enter' || k === 'ArrowRight' || k === 'PageDown') {
        e.preventDefault();
        const p = ctl.primary();

        if (st.phase === 'reveal' && p.kind !== 'skip' && store.serverNow() < revealLandsAt(st, resultsOf(room, st.encore)[st.index]) + 800) return;
        if (p.kind) go(p.kind, p.arg);
      }
      else if (k === 'e' || k === 'E') { if (clockInfo(st, store.serverNow()).mode === 'run') go('stop'); }
      else if (k === '+' || k === '=') { if (ctl.secondary().some(x => x.kind === 'extend')) go('extend'); }

    });
  }

      $$('.h-fold', app).forEach(d => { d.open = KV.get('tpib:host:fold:' + d.id) === '1'; d.addEventListener('toggle', () => KV.set('tpib:host:fold:' + d.id, d.open ? '1' : '0')); });

    function paintAsync() { paintHead(); paintBoard(); paintClose(); paintASettings(); paintASheet(); }
    function paintHead() {

    /* ---------- the progress board ---------- */
    // No close time: the standings so far, as the players' phones count them (finished players ranked, bonuses in).
    function liveTally() {
      const m = room.meta; if (m.status === 'closed' || m.closeAt) return null;
      const key = JSON.stringify([rowsOf().map(r => [r.pid, r.n, r.done, r.total]), asyncPricesOf(room), asyncSettingsOf(room).bonus]);
      if (A2.liveKey === key) return A2.live;
      const T = asyncTally(room), pl = room.players || {};
      const fin = T.list.filter(e => pl[e.pid] && pl[e.pid].done).map(e => ({ pid: e.pid, name: e.name, total: e.total }));
      let rk = 0, lastV = null; fin.forEach((e, k) => { if (e.total !== lastV) { rk = k + 1; lastV = e.total; } e.rank = rk; });
      const by = {}; fin.forEach(e => { by[e.pid] = e; });
      A2.liveKey = key; A2.live = { fin, by };
      return A2.live;
    }
    function rowsOf() {
      const N = asyncItems(room).length, gs = room.guesses || {};
      return namedPlayers(room).map(([pid, p]) => {
        let n = 0; for (let k = 0; k < N; k++) if (gs[k] && gs[k][pid]) n++;
        const started = typeof p.i === 'number' || !!p.shownAt;
        const at = Math.max(+p.at || 0, +p.joined || 0);
        return { pid, name: p.name, done: !!p.done, started, i: typeof p.i === 'number' ? p.i : -1, n, total: +p.total || 0, at, kind: p.done ? 'done' : started ? 'playing' : 'joined' };
      }).sort((a, b) => (b.done - a.done) || (a.done ? b.total - a.total : (b.i - a.i) || (b.started - a.started)) || a.name.localeCompare(b.name));
    }
    function paintBoard(force) {
      const box = $('#haboard'); if (!box) return;
      const N = asyncItems(room).length, closed = room.meta.status === 'closed', fin = closed ? (room.async && room.async.final) : null;
      const rows = rowsOf(), lt = closed ? null : liveTally(), fp = fin && fin.players ? fin.players : lt ? lt.by : null;
      if (fp) rows.sort((a, b) => ((fp[a.pid] ? fp[a.pid].rank : 1e9) - (fp[b.pid] ? fp[b.pid].rank : 1e9)) || (fp[a.pid] ? 0 : (b.i - a.i) || (b.started - a.started)) || a.name.localeCompare(b.name));
      const nDone = rows.filter(r => r.done).length, nPlay = rows.filter(r => r.kind === 'playing').length;
      const show = rows.filter(r => (A2.filter === 'all' || A2.filter === r.kind || (A2.filter === 'playing' && r.kind === 'joined')) && (!A2.q || r.name.toLowerCase().includes(A2.q)));
      const finalOf = pid => (fin && fin.players && fin.players[pid]) || (lt && lt.by[pid]);
      const row = r => {
        const played = r.done ? N : Math.min(N, Math.max(0, r.i, r.n));   // items finished (the one they're on counts once it's guessed)
        const prog = r.done ? '<span class="ha-done">Done</span>' : r.started ? `<span class="ha-bar" title="${played} of ${N} played"><i style="width:${(played / N * 100).toFixed(1)}%"></i></span><span class="ha-of">${played}/${N}</span>` : '<span class="ha-of ha-new">Just joined</span>';
        const fe = finalOf(r.pid), score = fe ? `<em>${ordinal(fe.rank)}</em>${fmtPts(fe.total)}` : r.started ? fmtPts(r.total) : '';

        return `<div class="ha-r ${r.kind}"><div class="ha-nm"><span class="n3">${esc(r.name)}</span><span class="ha-sub"><small class="ha-pm${r.done ? ' done' : ''}">${pm}</small><small class="ha-t" data-at="${r.at}">${r.at ? esc(agoText(r.at)) : ''}</small></span></div><span class="ha-p">${prog}</span><span class="s3">${score}</span>
          <button class="x${A2.kick === r.pid ? ' arm' : ''}" type="button" data-kick="${r.pid}" title="Remove ${esc(r.name)}" aria-label="Remove ${esc(r.name)}">${A2.kick === r.pid ? 'Remove?' : '×'}</button></div>`;
      };
      const sig = JSON.stringify([rows.map(r => [r.pid, r.name, r.kind, r.i, r.n, r.total, r.at]), A2.filter, A2.q, A2.kick, closed, !!fin, room.meta.talliedAt, lt && lt.fin]);
      if (!force && sig === A2.sig.board) return;

    function paintBoardTimes() { $$('#haboard [data-at]').forEach(n => { const t = +n.dataset.at; const s = t ? agoText(t) : ''; if (n.textContent !== s) n.textContent = s; }); }
    function onBoardClick(e) {

      const up = { ['players/' + pid]: null };
      for (let i = 0; i < asyncItems(room).length; i++) up[`guesses/${i}/${pid}`] = null;

    /* ---------- the close ---------- */
    function arm(what) { A2.armed = what; clearTimeout(A2.armT); A2.armT = setTimeout(() => { A2.armed = ''; A2.sig.close = ''; paintClose(); paintASettings(true); }, 4000); A2.sig.close = ''; paintClose(); paintASettings(true); }
    function paintClose() {
      const box = $('#haclose'); if (!box || !room || !room.meta) return;
      const m = room.meta, closed = m.status === 'closed', rows = rowsOf(), playing = rows.filter(r => r.kind === 'playing').length, left = rows.filter(r => !r.done).length;
      const fin = room.async && room.async.final, closing = !closed && m.closeAt && clockNow() >= m.closeAt;
      const lt = closed ? null : liveTally(), top3 = lt ? lt.fin.filter(e => e.rank <= 3) : [];
      const sig = JSON.stringify([m.status, m.closeAt, m.closedAt, playing, left, A2.armed, !!fin, fin && fin.info && fin.info.count, A2.tallying, closing, fin && fin.board && fin.board.map(e => e.name + e.total), top3.map(e => e.name + e.total + e.rank)]);

      if (!closed) {
        const armedC = A2.armed === 'close';
        box.innerHTML = `<div class="st-top"><div class="st-where"><span class="w">Open</span>${closing ? '<span class="ph hot">Past the close time</span>' : '<span class="ph go">Taking guesses</span>'}</div></div>
          <p class="ha-when">${m.closeAt ? `${closing ? 'Was due to close' : 'Closes'} <b>${esc(fmtWhen(m.closeAt))}</b>${closing ? '. Guessing has stopped on players\' phones: close it to count the board.' : '. It closes itself then if this console is open.'}` : 'No close time: everyone sees the standings so far the moment they finish. Close it whenever you like to lock in the final board, or set a close time under Settings.'}</p>
          ${lt ? `<div class="h-say ha-top3"><div class="lab">Top three so far</div>${top3.map(e => `<div class="co2"><b>${ordinal(e.rank)}</b><span><b>${esc(e.name)}</b> <span class="faint">· ${fmtPts(e.total)} pts</span></span></div>`).join('') || '<p class="faint">Nobody has finished yet.</p>'}</div>` : ''}
          <div class="h-actions"><button class="btn ${armedC ? 'danger' : ''} big block" type="button" data-act="close"${A2.tallying ? ' disabled' : ''}>${A2.tallying ? 'Counting the board…' : armedC ? (playing ? `Click again to close · ${playing} ${playing === 1 ? 'person is' : 'people are'} still playing` : 'Click again to close and reveal the results') : m.closeAt ? 'Close the game and reveal results' : 'Close the game and lock in the results'}</button>
            <div class="sub"><span class="hint">${left ? `${left} of ${rows.length} haven't finished` : rows.length ? 'Everyone who joined has finished' : 'Nobody has joined yet'}</span><button class="btn soft small" type="button" data-act="remind">Copy a reminder</button></div></div>`;
        return;
      }
      const board = (fin && fin.board ? ents(fin.board).map(([, e]) => e) : []), count = fin && fin.info ? fin.info.count : 0;
      box.innerHTML = `<div class="st-top"><div class="st-where"><span class="w">Closed</span><span class="ph">${m.closedAt ? esc(fmtWhen(m.closedAt)) : ''} · ${count} played</span></div></div>
        <div class="h-say ha-top3"><div class="lab">Top three</div>${board.filter(e => e.rank <= 3).map(e => `<div class="co2"><b>${ordinal(e.rank)}</b><span><b>${esc(e.name)}</b> <span class="faint">· ${fmtPts(e.total)} pts</span></span></div>`).join('') || '<p class="faint">Nobody played.</p>'}</div>
        <div class="h-actions"><button class="btn mint big block" type="button" data-act="announce">Copy results announcement</button>
          <div class="sub"><span class="hint">Paste it in the same chat as the invite</span><button class="btn soft small" type="button" data-act="screen">Open the results screen</button>
          <button class="btn ${A2.armed === 'reopen' ? 'danger' : 'soft'} small" type="button" data-act="reopen">${A2.armed === 'reopen' ? 'Click again to reopen' : 'Reopen'}</button></div></div>

    }
    async function onCloseClick(e) {
      const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
      const act = b.dataset.act;
      if (act === 'remind') { const left = rowsOf().filter(r => !r.done).length; toast(await copyText(reminderText(c, room.meta, left)) ? 'Reminder copied. Paste it in the chat.' : reminderText(c, room.meta, left)); return; }
      if (act === 'announce') { const t = announceText(c, ents(room.async && room.async.final && room.async.final.board).map(([, x]) => x)); toast(await copyText(t) ? 'Announcement copied. Paste it in the chat.' : t); return; }
      if (act === 'screen') { const w = window.open(displayUrl(c), 'tpib-display-' + c, 'popup=yes,width=1600,height=900'); if (!w) toast('Pop-up blocked. Allow pop-ups for this page.'); return; }
      if (act === 'close' || act === 'reopen') {
        if (A2.armed !== act) { arm(act); return; }
        A2.armed = ''; clearTimeout(A2.armT);
        if (act === 'close') await closeGame(); else await reopenGame();
      }
    }
    // The tally: every item scored from the raw guesses, everyone ranked, the result written down for the player pages.
    // why = '' (the close itself), or a re-count after it: 'price' (a fixed price), 'removed' (a player taken off), 'bonus'.
    async function closeGame(why) {
      if (A2.tallying) { if (why) A2.again = why; return; }
      A2.tallying = true; A2.sig.close = ''; paintClose();
      try {
        const fresh = await getWithin(roomPath(c));   // the very latest guesses
        const r = fresh && fresh.meta ? fresh : room;
        if (why && r.meta.status !== 'closed') { A2.tallying = false; A2.sig.close = ''; paintClose(); return; }   // (reopened meanwhile)
        const { results, final } = asyncTally(r);
        const was = r.async && r.async.final && r.async.final.info;
        if (why === 'price' || (why && was && was.corrected)) final.info.corrected = true;
        const up = { results, 'async/final': final, 'meta/status': 'closed', 'meta/talliedAt': store.TS };
        if (!why) up['meta/closedAt'] = store.TS;
        const ok = await store.update(roomPath(c), up);
        toast(!ok ? "Couldn't count the board. Check the connection and try again."
          : why === 'price' ? 'Counted the board again with the new price.' : why === 'removed' ? 'Counted the board again without them.'
          : why === 'bonus' ? 'Counted the board again with the new bonus setting.' : 'Closed. Copy the results announcement into the chat.');
      } catch (e) { console.error(e); toast("Couldn't count the board. Check the connection and try again."); }

    }
    async function reopenGame() {

    // A close time, with this console open: it closes itself then.

    }
    async function onASetClick(e) {

        const v = parseGuess(e.target.value);
        if (!(v > 0)) { toast("That price didn't read as a number. Try something like 34.99"); paintASheet(); return; }
        ok = await store.set(path + 'price', v);
      } else if (e.target.matches('[data-reveal]')) ok = await store.set(path + 'reveal', e.target.value.trim() || ITEM_BY_ID[id].reveal);
      else if (e.target.matches('[data-fine]')) ok = await store.set(path + 'fine', e.target.value.trim());
      else return;
      if (!ok) return;
      toast('Saved for this game');
      // Once it's closed, a corrected price means the board is counted again.
      if (room.meta.status === 'closed') setTimeout(() => closeGame('price'), 300);
    }
  }

  function paintAll() { paintNow(); paintPlayers(); paintSettings(); paintSheet(); paintPool(); paintScreen(); }

  // The big screen reports its sound: browsers only let it play after someone clicks that window.
  function paintScreen() {
    const n = $('#hscr'); if (!n || !room) return;
    const sc = room.screen, s = sc && sc.sound;
    const [cls, txt, tip] = !sc ? ['', 'Big screen not open', 'Open the big screen, share it in Teams, then click it once for sound']
      : s === 'on' ? ['green', 'Big screen sound on', '']
      : s === 'muted' ? ['', 'Big screen muted (press M on it)', '']
      : ['hot', 'Click the big screen once for sound', 'Browsers only play sound after a click in that window'];
    n.className = 'chip h-scr' + (cls ? ' ' + cls : ''); n.textContent = txt; n.title = tip;
  }

  /* ---------- the step card ---------- */
  const mmss = t => Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  function paintNow() {
    const box = $('#hnow'); if (!box || !room || !room.meta) return;
    const st = stateOf(room), now = store.serverNow(), c = clockInfo(st, now), p = ctl.primary(), sec = ctl.secondary();
    // enc: the encore's items, guesses and results are in play (the encore champion counts too)
    const enc = st.encore && st.phase !== 'end', items = itemsOf(room, enc), lab = enc ? 'Encore item' : 'Item', N = items.length;
    const pl = namedPlayers(room), g = st.phase === 'item' ? guessesFor(room, st.index, enc) : {};
    const can = enc ? encoreIds(room) : pl.map(([pid]) => pid);   // who can guess
    const nIn = can.filter(pid => g[pid] && g[pid].v > 0).length;
    const res = resultsOf(room, enc)[st.index];
    const landing = st.phase === 'reveal' && res && now < revealLandsAt(st, res);
    const curIt = items[Math.max(0, st.index)];
    // Counts change all the time while people guess, so they update in place: rebuilding the card would
    // swap the buttons out from under a click.
    const cntHTML = st.phase === 'lobby' ? `<b>${pl.length}</b> ${pl.length === 1 ? 'player has' : 'players have'} joined`
      : `<b>${nIn}</b> of ${enc ? can.length : pl.length} ${isMovie(curIt) ? 'answered' : 'guessed'}${st.allIn ? ' · everyone is in' : ''}`;
    const sig = JSON.stringify([st.phase, enc, st.index, c.mode, landing, p.kind, p.arg, p.label, p.hint, sec.map(s => s.label), !!res, res && res.n, JSON.stringify(overrides[curIt && curIt.id] || null)]);
    const clockEl = $('#hclock'), cntEl = $('#hcnt');
    if (clockEl && c.mode === 'run') { clockEl.textContent = mmss(c.sec) + ' left'; clockEl.className = 'h-clock' + (c.sec <= 5 ? ' hot' : ''); }
    if (cntEl && cntEl.innerHTML !== cntHTML) cntEl.innerHTML = cntHTML;
    if (sig === nowSig) return;
    nowSig = sig;
    const inItem = ['item', 'reveal', 'standings'].includes(st.phase);
    const it = inItem ? itemView(st.index, overrides, room, enc) : null;
    // Where we are, in plain words
    let where = '', phase = '', extra = '';
    if (st.phase === 'lobby') { where = 'Lobby'; phase = '<span class="ph">Waiting for players</span>'; }
    else if (st.phase === 'item') {
      where = `${lab} ${st.index + 1} of ${N}`;
      phase = c.mode === 'open' ? '<span class="ph">Guesses open</span>' : c.mode === 'run' ? '<span class="ph go">Guessing</span>' : '<span class="ph hot">Time\'s up</span>';
      if (c.mode === 'run') extra = `<span class="h-clock${c.sec <= 5 ? ' hot' : ''}" id="hclock">${mmss(c.sec)} left</span>`;
    } else if (st.phase === 'reveal') { where = `${lab} ${st.index + 1} of ${N}`; phase = isMovie(curIt) ? (landing ? '<span class="ph go">Revealing the answer…</span>' : '<span class="ph">Answer revealed</span>') : landing ? '<span class="ph go">Revealing the price…</span>' : '<span class="ph">Price revealed</span>'; }
    else if (st.phase === 'standings') { where = `${lab} ${st.index + 1} of ${N}`; phase = '<span class="ph">Leaderboard on screen</span>'; }
    else if (st.phase === 'efinal') { where = 'Encore champion'; }
    else where = st.phase === 'final' ? 'Final results' : st.phase === 'poll' ? 'Poll results' : 'Wrapped';
    const R = resultsOf(room, enc);
    const dots = (enc ? items : ITEMS).map((x, k) => `<i class="${k === st.index && inItem ? 'now' : k < st.index || R[k] || (!enc && ['final', 'poll', 'end'].includes(st.phase)) || (st.phase === 'efinal' && k <= st.index) ? 'done' : ''}${isMovie(x) ? ' mv' : ''}"></i>`).join('');
    const top3 = list => list.slice(0, 3).map(e => `<div class="co2"><b>${ordinal(e.rank)}</b><span><b>${esc(e.name)}</b> <span class="faint">· ${fmtPts(e.total)} pts</span></span></div>`).join('') || '<p class="faint">No players.</p>';
    let body = '', say = '';
    if (st.phase === 'lobby') {
      body = `<div class="h-big" id="hcnt">${cntHTML}</div>`;
      say = `<div class="lab">Before you start</div><p>Share the big-screen window in Teams (not this console, which shows the answers) with computer sound on, and click it once so its sound effects can play. Then paste the join link in the chat, and give people a minute to join and answer the poll.</p>`;
    } else if (inItem) {
      // A movie question: the right answer's letter and text, and what to read aloud (the question, what the clue card
      // shows, and the four answers). After the reveal: the fact line and who got it.
      const mv = isMovie(it);
      body = `<div class="h-item">${mv ? `<div class="art mv-thumb">${MVI.ticket}</div>` : `<div class="art">${artHTML(it)}</div>`}<div><div class="t">${mv ? 'Movie question' : esc(it.name)}${it.double ? ' <span class="flag dbl">Double points</span>' : ''}</div>
        <div class="h-ans${mv ? ' mv' : ''}">Answer <b>${mv ? esc(answerText(it)) : fmtMoney(res ? res.price : it.price)}</b>${it.recheck && !it.edited ? ' <span class="flag">Recheck</span>' : ''}</div>
        ${st.phase === 'item' ? `<div class="cnt" id="hcnt">${cntHTML}</div>` : ''}</div></div>`;
      if (st.phase === 'item') say = mv
        ? `<div class="lab">Read aloud</div><p>${esc(it.question)}</p><div class="lab">The clue on screen</div><p class="faint">${esc(clueAlt(it.clue))}</p>
          <div class="lab">The four answers</div><ul class="mv-ch">${(it.choices || []).map((c, k) => `<li${k === rightPick(it) - 1 ? ' class="ok"' : ''}><b>${LETTERS[k]}</b><span>${esc(c)}</span></li>`).join('')}</ul>`
        : `<div class="lab">Read aloud</div><p>${esc(it.question)}${it.unit ? ` <span class="faint">(${esc(it.unit)})</span>` : ''}</p>`;
      else {
        const r = res || computeResult(st.index, room, overrides, enc), cs = calloutsFor(st.index, r, room, enc);
        say = `<div class="lab">Reveal line</div><p>${esc(r.reveal)}</p>` + (cs.length
          ? `<div class="lab">${mv ? 'Who got it' : 'Callouts'}</div>` + cs.map(x => `<div class="co2"><b>${esc(x.label)}</b><span>${esc(x.names.length ? joinNames(x.names, 6) : 'Nobody')} <span class="faint">· ${esc(x.detail)}</span></span></div>`).join('')
          : `<p class="faint">Nobody ${mv ? 'answered' : 'guessed'} this one.</p>`);
      }
    } else if (st.phase === 'efinal') {
      say = `<div class="lab">Encore top three</div>${top3(standings(room, st.index, true))}`;
    } else {
      say = `<div class="lab">Top three</div>${top3(standings(room, N_ITEMS - 1))}`;
      if ((st.phase === 'poll' || st.phase === 'end') && sec.some(x => x.kind === 'encore')) say += `<div class="lab">If people want more</div><p><b>Play the encore</b> starts ${poolList(pool).length} more items for everyone still here, on a leaderboard of its own. The order is under Items &amp; prices.</p>`;
      if (st.phase === 'end' && lastRevealed(room, true) >= 0) say += `<div class="lab">Encore top three</div>${top3(standings(room, lastRevealed(room, true), true))}`;
    }
    box.innerHTML = `<div class="st-top"><div class="st-where"><span class="w">${where}</span>${phase}${extra}</div><div class="st-dots" aria-hidden="true">${dots}</div></div>
      ${body}
      <div class="h-actions"><button class="btn big block${p.soft ? ' soft' : ''}" type="button" id="hprim" data-kind="${p.kind || ''}" data-arg="${p.arg == null ? '' : p.arg}"${p.disabled ? ' disabled' : ''}>${esc(p.label)}</button>
        ${p.hint || sec.length ? `<div class="sub">${p.hint ? `<span class="hint">${esc(p.hint)}</span>` : '<span></span>'}${sec.map(s => `<button class="btn soft small" type="button" data-sec="${s.kind}" data-arg="${s.arg == null ? '' : s.arg}">${esc(s.label)}</button>`).join('')}</div>` : ''}</div>
      ${say ? `<div class="h-say">${say}</div>` : ''}`;
    wireArt(box);
  }
  function onNowClick(e) {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    // Only act if the button still means the same thing: if the price landed or the clock ran out a moment
    // ago, "Skip to the price" or "End the clock now" must not turn into the next step. Redraw instead.
    const same = (x, kind, arg) => x && x.kind === kind && String(x.arg == null ? '' : x.arg) === arg;
    if (b.id === 'hprim') {
      const p = ctl.primary(), st = stateOf(room);
      // ...and a double-click on "Skip to the price" can't land on "Next question" just after the price lands
      const justLanded = st.phase === 'reveal' && p.kind !== 'skip' && store.serverNow() < revealLandsAt(st, resultsOf(room, st.encore)[st.index]) + 800;
      if (justLanded) return;
      if (p.kind && same(p, b.dataset.kind, b.dataset.arg)) ctl.act(p.kind, p.arg); else { nowSig = ''; paintNow(); }
    } else if (b.dataset.sec) {
      const x = ctl.secondary().find(s2 => same(s2, b.dataset.sec, b.dataset.arg || ''));
      if (x) ctl.act(x.kind, x.arg); else { nowSig = ''; paintNow(); }
    }
  }

  /* ---------- players ---------- */
  let armedKick = '', kickT = 0;
  function paintPlayers() {
    const box = $('#hplayers'); if (!box || !room) return;
    const st = stateOf(room), pres = room.presence || {};
    // During the encore: the encore board first, then anyone who left before it started (marked out).
    const enc = st.encore && st.phase !== 'end', board = enc;
    let list = standings(room, lastRevealed(room));
    if (board) {
      const eb = standings(room, lastRevealed(room, true), true), on = new Set(eb.map(e => e.pid));
      list = eb.concat(list.filter(e => !on.has(e.pid)).map(e => Object.assign({}, e, { out: true })));
    }
    const g = st.phase === 'item' ? guessesFor(room, st.index, enc) : null;
    const nIn = g ? list.filter(e => !e.out && g[e.pid] && g[e.pid].v > 0).length : 0;
    const online = list.filter(e => pres[e.pid]).length;
    const row = e => {
      // middle column: guessed (✓) or not yet (…) during an item
      const mark = g && !e.out ? (g[e.pid] ? '✓' : '…') : '', mc = g && !e.out && g[e.pid] ? ' y' : '';
      return `<div class="pl-r${e.out ? ' out' : ''}"><span class="on${pres[e.pid] ? ' y' : ''}" title="${pres[e.pid] ? 'Online' : 'Not connected right now'}"></span><span class="n3">${esc(e.name)}</span>
        <span class="g3${mc}">${mark}</span><span class="s3">${e.out ? 'out' : fmtPts(e.total)}</span>
        <button class="x${armedKick === e.pid ? ' arm' : ''}" type="button" data-kick="${e.pid}" title="Remove ${esc(e.name)}" aria-label="Remove ${esc(e.name)}">${armedKick === e.pid ? 'Remove?' : '×'}</button></div>`;
    };
    const html = `<div class="h-side-top"><h3>Players <b>${list.length}</b></h3><span class="faint">${list.length ? `${online} online${g ? ` · ${nIn} guessed` : ''}` : ''}</span></div>
      ${list.length ? `<div class="pl-list">${list.map(row).join('')}</div>`
        : '<div class="pl-empty">Nobody yet. Paste the join link in the Teams chat.</div>'}`;
    // Redraw only when something in the list changed (keeps the scroll position and the remove buttons steady).
    if (html === box.dataset.html) return;
    const scroll = $('.pl-list', box) ? $('.pl-list', box).scrollTop : 0;
    box.innerHTML = html; box.dataset.html = html;
    const pl2 = $('.pl-list', box); if (pl2) pl2.scrollTop = scroll;
  }
  function onPlayersClick(e) {
    const b = e.target.closest('[data-kick]'); if (!b) return;
    const pid = b.dataset.kick;
    if (armedKick !== pid) { armedKick = pid; clearTimeout(kickT); kickT = setTimeout(() => { armedKick = ''; paintPlayers(); }, 3000); paintPlayers(); return; }
    armedKick = ''; clearTimeout(kickT);
    const up = { ['players/' + pid]: null, ['presence/' + pid]: null };
    for (let i = 0; i < N_ITEMS; i++) up[`guesses/${i}/${pid}`] = null;
    for (let i = 0; i < ENCORE_ITEMS.length; i++) up[`encore/guesses/${i}/${pid}`] = null;
    store.update(roomPath(code), up);
  }

  /* ---------- settings ---------- */
  let setSig = '', armed = '', armT = 0;
  function paintSettings(force) {
    const box = $('#hset'); if (!box || !room) return;
    const s = settingsOf(room), sig = JSON.stringify([s, armed]);
    if (sig === setSig && !force) return; setSig = sig;
    box.innerHTML = `<div class="set-row"><div class="sl">Price clock<small>Seconds to guess each price</small></div><div class="seg" role="group" aria-label="Price clock length">${GAME.clockChoices.map(v => `<button type="button" data-timer="${v}" class="${v === s.timer ? 'on' : ''}" aria-pressed="${v === s.timer}">${v}s</button>`).join('')}</div></div>
      <div class="set-row"><div class="sl">Movie clock<small>Seconds to answer each movie question</small></div><div class="seg" role="group" aria-label="Movie clock length">${GAME.movieClockChoices.map(v => `<button type="button" data-mtimer="${v}" class="${v === s.movieTimer ? 'on' : ''}" aria-pressed="${v === s.movieTimer}">${v}s</button>`).join('')}</div></div>
      <div class="set-row"><div class="sl">Start the clock automatically<small>As soon as each item appears</small></div><label class="sw"><input type="checkbox" data-set="autoStart"${s.autoStart ? ' checked' : ''} aria-label="Start the clock automatically"><span></span></label></div>
      <div class="set-row"><div class="sl">End early when everyone's in<small>Stops the clock 2 seconds after the last connected player locks in</small></div><label class="sw"><input type="checkbox" data-set="autoEnd"${s.autoEnd ? ' checked' : ''} aria-label="End the clock early when everyone has guessed"><span></span></label></div>
      <div class="set-row"><div class="sl">Big TIME'S UP moment<small>Off: the big screen quietly notes time is up and waits for you. On: ticking for the last 10 seconds, a buzzer and a stamp.</small></div><label class="sw"><input type="checkbox" data-set="buzzer"${s.buzzer ? ' checked' : ''} aria-label="Big time's up moment with ticking, a buzzer and a stamp"><span></span></label></div>
      <div class="set-row"><div class="sl">Santa's mitten on the reveal<small>A mitten taps each digit of the price as it locks</small></div><label class="sw"><input type="checkbox" data-set="hand"${s.hand ? ' checked' : ''} aria-label="Show Santa's mitten during the reveal"><span></span></label></div>
      <div class="set-row"><div class="sl">Light show<small>The garland's wave of lights and a warm glow at the big moments: the final item, the champion and the end card. On the big screen and the phones.</small></div><label class="sw"><input type="checkbox" data-set="lights"${s.lights ? ' checked' : ''} aria-label="The light show at the big moments"><span></span></label></div>
      <div class="danger-row"><span class="faint">Start over</span><button class="btn ${armed === 'restart' ? 'danger' : 'soft'} small" type="button" data-arm="restart">${armed === 'restart' ? 'Click again to restart' : 'Restart the game (keeps players)'}</button>
        <button class="btn ${armed === 'new' ? 'danger' : 'soft'} small" type="button" data-arm="new">${armed === 'new' ? 'Click again for a new room' : 'Start a new room'}</button></div>`;
  }
  function onSetClick(e) {
    const t = e.target.closest('[data-timer]');
    if (t) { store.set(roomPath(code) + '/settings/timer', +t.dataset.timer); return; }
    const mt = e.target.closest('[data-mtimer]');
    if (mt) { store.set(roomPath(code) + '/settings/movieTimer', +mt.dataset.mtimer); return; }
    const a = e.target.closest('[data-arm]'); if (!a) return;
    const what = a.dataset.arm;
    if (armed !== what) { armed = what; clearTimeout(armT); armT = setTimeout(() => { armed = ''; paintSettings(); }, 3000); paintSettings(); return; }
    armed = ''; clearTimeout(armT); paintSettings();
    if (what === 'restart') ctl.act('restart');
    else { try { history.replaceState(null, '', pageUrl() + '?role=host'); } catch (err) { /* ignore */ } location.reload(); }
  }
  function onSetChange(e) {
    const c = e.target.closest('[data-set]'); if (!c) return;
    store.set(roomPath(code) + '/settings/' + c.dataset.set, !!c.checked);
  }

  /* ---------- run sheet (prices, reveal lines, jump to an item) ---------- */
  // One row's pieces in Items & prices, for either kind of question. A movie question lists its answer and what its
  // clue card shows. Its reveal line and fine print can be edited like an item's; its answer can't (it's the question).
  function rsAnswer(it, label) {
    return isMovie(it) ? `<div class="rs-ans" title="The right answer is part of the question, so it can't be edited here">Answer <b>${esc(answerText(it))}</b></div>`
      : `<label class="pin"><span>$</span><input type="text" inputmode="decimal" data-price aria-label="${esc(label)}"></label>`;
  }
  function rsNotes(it, linkWord) { return isMovie(it)
    ? `<div class="faint">Question: ${esc(it.question)}</div><div class="faint">Clue card (${esc(it.clue.card)}): ${esc(clueAlt(it.clue))}</div><div class="faint">Answers: ${(it.choices || []).map((c, k) => `${LETTERS[k]} ${esc(c)}`).join(' · ')}</div>
        ${it.clue.card === 'postcard' ? `<div class="note" data-noph hidden>No photo yet for this postcard (${esc(it.clue.photo || '')}): players see a drawn stand-in. Save the photo into img/ and run tools/embed-photos.js.</div>` : ''}`
    : `${it.recheck ? `<div class="note">${esc(it.recheck)}${it.link ? ` <a href="${esc(it.link)}" target="_blank" rel="noopener">Open the ${linkWord} ↗</a>` : ''}</div>` : ''}
        ${(it.facts || []).map((f, k) => `<div class="faint">Fun fact ${k + 1} (${esc(f.q)}): ${esc(f.a)}</div>`).join('')}`; }
  function rsEdits(it) { return `<label>Reveal line (shown on the big screen and the phones after the ${isMovie(it) ? 'answer' : 'price'})<textarea rows="2" data-reveal></textarea></label>
        <label>Fine print under the ${isMovie(it) ? 'reveal line' : 'price'}<input type="text" data-fine></label>
        <div class="acts"><button class="btn soft small" type="button" data-reset>Restore the original ${isMovie(it) ? 'text' : 'price and text'}</button>${isMovie(it) ? '' : `<span class="p-small">Original answer: ${fmtMoney(it.price)}</span>`}</div>`; }
  // (a postcard question whose photo isn't in yet says so in its details)
  function paintNoPhoto(row, it) { const np = $('[data-noph]', row); if (np) np.hidden = PHOTO_OK[it.id] !== null; }
  function buildSheet() {
    const box = $('#hsheet'); if (!box) return;
    box.innerHTML = ITEMS.map((it, i) => `<div class="rs-row" data-i="${i}">
      <div class="rs-main"><div class="rs-n">${i + 1}</div>
        <div class="rs-name"><span class="t2">${esc(itemTitle(it))}</span><span class="m2"><span>${esc(typeLabel(it))}</span>${it.double ? '<span class="flag dbl">2× points</span>' : ''}${it.recheck ? '<span class="flag" data-rf>Recheck</span>' : ''}<span class="flag edited" data-ed hidden>Edited</span><button class="rs-toggle" type="button" data-more>Details</button></span></div>
        ${rsAnswer(it, 'Answer for item ' + (i + 1))}
        <div class="rs-st" data-st></div></div>
      <div class="rs-more" hidden>
        ${rsNotes(it, 'listing')}
        ${rsEdits(it)}
      </div></div>`).join('');
    box.addEventListener('change', onSheetChange);
    box.addEventListener('click', onSheetClick);
    box.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-price], [data-fine]')) e.target.blur(); });
    paintSheet();
  }
  function paintSheet() {
    const box = $('#hsheet'); if (!box) return;
    const st = room ? stateOf(room) : null;
    $$('.rs-row', box).forEach(row => {
      const i = +row.dataset.i, v = itemView(i, overrides);
      const pi = $('[data-price]', row), rv = $('[data-reveal]', row), fi = $('[data-fine]', row);
      paintNoPhoto(row, v);
      if (pi && document.activeElement !== pi) pi.value = Number(v.price).toLocaleString('en-US', { maximumFractionDigits: 2 });
      if (document.activeElement !== rv) rv.value = v.reveal;
      if (document.activeElement !== fi) fi.value = v.fine;
      $('[data-ed]', row).hidden = !v.edited;
      const rf = $('[data-rf]', row); if (rf) rf.hidden = v.edited;
      const cell = $('[data-st]', row);
      if (sheetMode !== 'room' || !st) { cell.innerHTML = ''; return; }
      const done = !!(room.results && room.results[i]);
      const isNow = !st.encore && ['item', 'reveal', 'standings'].includes(st.phase) && st.index === i;
      row.classList.toggle('now', isNow); row.classList.toggle('done', done && !isNow);
      const sig = isNow ? 'now' : 'open';
      if (cell.dataset.sig === sig + done) return;
      cell.dataset.sig = sig + done;
      cell.innerHTML = isNow ? '<span class="chip gold">Now</span>' : `<button class="btn soft small" type="button" data-jump title="Jump to this item">${done ? '✓ Redo' : 'Open'}</button>`;
    });
  }
  function onSheetChange(e) {
    const row = e.target.closest('.rs-row'); if (!row) return;
    const i = +row.dataset.i, it = ITEMS[i];
    if (e.target.matches('[data-price]')) {
      const v = parseGuess(e.target.value);
      if (!(v > 0)) { toast("That price didn't read as a number. Try something like 34.99"); paintSheet(); return; }
      saveOverride(i, 'price', Math.abs(v - it.price) < 0.005 ? null : v);
    } else if (e.target.matches('[data-reveal]')) {
      const t = e.target.value.trim(); saveOverride(i, 'reveal', !t || t === it.reveal ? null : t);
    } else if (e.target.matches('[data-fine]')) {
      const t = e.target.value.trim(); saveOverride(i, 'fine', t === (it.fine || '') ? null : t);
    }
  }
  function saveOverride(i, field, val) { saveOverrideFor(ITEMS[i].id, field, val, `item ${i + 1}`, () => ctl.rescore(i)); }
  // Price edits are saved per item id under overrides, for every game (live items and encore items alike).
  function saveOverrideFor(id, field, val, label, rescore) {
    const o = Object.assign({}, overrides[id] || {});
    if (val == null) delete o[field]; else o[field] = val;
    if (Array.isArray(overrides)) overrides = Object.assign({}, overrides);
    overrides[id] = o;
    if (ctl) { ctl.setOverrides(overrides); rescore(); }
    store.set(`${ROOT}/overrides/${id}/${field}`, val).then(ok => { if (ok) toast(`Saved ${label}`); });
    paintSheet(); paintPool(); nowSig = ''; if (room) paintNow();
  }
  function onSheetClick(e) {
    const row = e.target.closest('.rs-row'); if (!row) return;
    const i = +row.dataset.i;
    const more = e.target.closest('[data-more]');
    if (more) { const m = $('.rs-more', row); m.hidden = !m.hidden; more.textContent = m.hidden ? 'Details' : 'Hide details'; return; }
    if (e.target.closest('[data-reset]')) {
      const id = ITEMS[i].id;
      if (Array.isArray(overrides)) overrides = Object.assign({}, overrides);
      delete overrides[id];
      if (ctl) { ctl.setOverrides(overrides); ctl.rescore(i); }
      store.remove(`${ROOT}/overrides/${id}`).then(ok => { if (ok) toast(`Item ${i + 1} is back to the original`); });
      paintSheet(); return;
    }
    const j = e.target.closest('[data-jump]');
    if (j && ctl) {
      if (!j.classList.contains('arm')) {
        j.classList.add('arm', 'danger'); j.classList.remove('soft'); j.textContent = 'Sure?';
        setTimeout(() => { if (j.isConnected && j.classList.contains('arm')) { j.parentElement.dataset.sig = ''; paintSheet(); } }, 3000);
        return;
      }
      ctl.act('jump', i);
    }
  }

  /* ---------- the encore pool (under Items & prices): which encore items play, in what order ----------
     Saved for every game under encorePool: { order: [ids], off: { id: true } }. A room's encore takes a
     snapshot of it when the encore starts, so the order is locked while one is running. */
  function poolBlock() {
    return `<div class="ep-head"><h4>Encore pool</h4><span class="faint">Played top to bottom if you start the encore after the poll results. Untick an item to skip it; the last ticked item is the finale${GAME.encoreFinaleDoubles ? ' and doubles' : ''}. Saved for every game.</span></div>
      <div class="rs" id="hpool"></div><p class="h-tip" id="hpooltip" hidden>The encore is running, so its order is locked until it ends. Prices and reveal lines can still be fixed.</p>`;
  }
  function buildPool() {
    const box = $('#hpool'); if (!box) return;
    box.addEventListener('change', onPoolChange);
    box.addEventListener('click', onPoolClick);
    box.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-price], [data-fine]')) e.target.blur(); });
    paintPool();
  }
  function poolRow(it) {
    return `<div class="rs-row ep" data-id="${it.id}">
      <div class="rs-main ep-main"><label class="ep-on" title="Play this one in the encore"><input type="checkbox" data-on aria-label="Play ${esc(itemTitle(it))} in the encore"></label>
        <div class="rs-n" data-n></div>
        <div class="rs-name"><span class="t2">${esc(itemTitle(it))}</span><span class="m2"><span>${esc(typeLabel(it))}</span><span class="flag dbl" data-fin hidden>Finale · 2× points</span>${it.recheck ? '<span class="flag" data-rf>Recheck</span>' : ''}<span class="flag edited" data-ed hidden>Edited</span><button class="rs-toggle" type="button" data-more>Details</button></span></div>
        ${rsAnswer(it, 'Answer for ' + itemTitle(it))}
        <div class="ep-mv"><button type="button" data-up aria-label="Move ${esc(itemTitle(it))} up" title="Move up">▲</button><button type="button" data-down aria-label="Move ${esc(itemTitle(it))} down" title="Move down">▼</button></div>
        <div class="rs-st" data-st></div></div>
      <div class="rs-more" hidden>
        ${rsNotes(it, 'source')}
        ${rsEdits(it)}
      </div></div>`;
  }
  function paintPool() {
    const box = $('#hpool'); if (!box) return;
    const order = poolOrder(pool), off = (pool && pool.off) || {}, on = order.filter(id => !off[id]);
    const st = room && room.meta ? stateOf(room) : null;
    const running = !!(st && st.encore && ['item', 'reveal', 'standings', 'efinal'].includes(st.phase));
    const playing = running ? itemsOf(room, true).map(it => it.id) : [];
    // Rows follow the pool's order; moving one re-sorts the existing rows (open details stay open).
    if (box.dataset.order !== order.join()) {
      const rows = {}; $$('.ep', box).forEach(r => { rows[r.dataset.id] = r; });
      order.forEach(id => { let r = rows[id]; if (!r) { const w = document.createElement('div'); w.innerHTML = poolRow(ENCORE_BY_ID[id]); r = w.firstElementChild; } box.appendChild(r); });
      box.dataset.order = order.join();
    }
    const tip = $('#hpooltip'); if (tip) tip.hidden = !running;
    $$('.ep', box).forEach(row => {
      const id = +row.dataset.id, v = viewOf(ENCORE_BY_ID[id], overrides);
      const pi = $('[data-price]', row), rv = $('[data-reveal]', row), fi = $('[data-fine]', row);
      paintNoPhoto(row, v);
      if (pi && document.activeElement !== pi) pi.value = Number(v.price).toLocaleString('en-US', { maximumFractionDigits: 2 });
      if (document.activeElement !== rv) rv.value = v.reveal;
      if (document.activeElement !== fi) fi.value = v.fine;
      $('[data-ed]', row).hidden = !v.edited;
      const rf = $('[data-rf]', row); if (rf) rf.hidden = v.edited;
      const k = on.indexOf(id), pos = order.indexOf(id), box2 = $('[data-on]', row);
      box2.checked = k >= 0; box2.disabled = running;
      $('[data-n]', row).textContent = k >= 0 ? k + 1 : '–';
      $('[data-fin]', row).hidden = !(GAME.encoreFinaleDoubles && k >= 0 && k === on.length - 1);
      row.classList.toggle('off', k < 0);
      $('[data-up]', row).disabled = running || pos === 0;
      $('[data-down]', row).disabled = running || pos === order.length - 1;
      // While the encore runs: Now, or Open / Redo for the items it's playing (like the live list)
      const cell = $('[data-st]', row), ek = playing.indexOf(id);
      const isNow = ek >= 0 && ['item', 'reveal', 'standings'].includes(st.phase) && st.index === ek;
      const done = ek >= 0 && !!resultsOf(room, true)[ek];
      const sig = !running || ek < 0 ? 'none' : isNow ? 'now' : 'open' + done;
      row.classList.toggle('now', isNow); row.classList.toggle('done', done && !isNow);
      if (cell.dataset.sig === sig) return;
      cell.dataset.sig = sig;
      cell.innerHTML = sig === 'none' ? '' : isNow ? '<span class="chip gold">Now</span>' : `<button class="btn soft small" type="button" data-ejump title="Jump to this encore item">${done ? '✓ Redo' : 'Open'}</button>`;
    });
  }
  function savePool(path, val) {
    pool = JSON.parse(JSON.stringify(pool || {}));
    const [k, id] = path.split('/');
    if (k === 'order') pool.order = val; else { pool.off = Object.assign({}, pool.off || {}); if (val == null) delete pool.off[id]; else pool.off[id] = val; }
    if (ctl) ctl.setPool(pool);
    store.set(`${ROOT}/encorePool/${path}`, val);
    paintPool(); nowSig = ''; if (room && room.meta) paintNow();
  }
  function onPoolChange(e) {
    const row = e.target.closest('.ep'); if (!row) return;
    const id = +row.dataset.id, it = ENCORE_BY_ID[id], label = itemTitle(it);
    if (e.target.matches('[data-on]')) savePool('off/' + id, e.target.checked ? null : true);
    else if (e.target.matches('[data-price]')) {
      const v = parseGuess(e.target.value);
      if (!(v > 0)) { toast("That price didn't read as a number. Try something like 34.99"); paintPool(); return; }
      saveOverrideFor(id, 'price', Math.abs(v - it.price) < 0.005 ? null : v, label, () => ctl.rescoreEncore(id));
    } else if (e.target.matches('[data-reveal]')) {
      const t = e.target.value.trim(); saveOverrideFor(id, 'reveal', !t || t === it.reveal ? null : t, label, () => ctl.rescoreEncore(id));
    } else if (e.target.matches('[data-fine]')) {
      const t = e.target.value.trim(); saveOverrideFor(id, 'fine', t === (it.fine || '') ? null : t, label, () => ctl.rescoreEncore(id));
    }
  }
  function onPoolClick(e) {
    const row = e.target.closest('.ep'); if (!row) return;
    const id = +row.dataset.id;
    const more = e.target.closest('[data-more]');
    if (more) { const m = $('.rs-more', row); m.hidden = !m.hidden; more.textContent = m.hidden ? 'Details' : 'Hide details'; return; }
    const mv = e.target.closest('[data-up], [data-down]');
    if (mv) {
      const order = poolOrder(pool), k = order.indexOf(id), to = k + (mv.matches('[data-up]') ? -1 : 1);
      if (k < 0 || to < 0 || to >= order.length) return;
      order.splice(k, 1); order.splice(to, 0, id);
      savePool('order', order);
      const again = $(`.ep[data-id="${id}"] ${mv.matches('[data-up]') ? '[data-up]' : '[data-down]'}`, $('#hpool'));
      if (again && !again.disabled) again.focus();
      return;
    }
    if (e.target.closest('[data-reset]')) {
      if (Array.isArray(overrides)) overrides = Object.assign({}, overrides);
      delete overrides[id];
      if (ctl) { ctl.setOverrides(overrides); ctl.rescoreEncore(id); }
      store.remove(`${ROOT}/overrides/${id}`).then(ok => { if (ok) toast('Back to the original price and text'); });
      paintPool(); return;
    }
    const j = e.target.closest('[data-ejump]');
    if (j && ctl) {
      if (!j.classList.contains('arm')) {
        j.classList.add('arm', 'danger'); j.classList.remove('soft'); j.textContent = 'Sure?';
        setTimeout(() => { if (j.isConnected && j.classList.contains('arm')) { j.parentElement.dataset.sig = ''; paintPool(); } }, 3000);
        return;
      }
      const k = itemsOf(room, true).findIndex(it => it.id === id);
      if (k >= 0) ctl.act('ejump', k);
    }
  }
}
/* ============================== START UP ============================== */
(async function boot() {
  const role = (URLP.get('role') || '').toLowerCase();
  const code = (URLP.get('room') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  Effects.init(role);
  if (!role && !code) { LandingApp(); return; }   // the bare link: Join game / Host game (?role=join is the join page)
  const player = !['host', 'display', 'screen'].includes(role);
  // A play-anytime game's player page never loads the Firebase SDK: it reads the room's meta over a plain request
  // first, and an async room is played over plain requests from then on (no connection held; see createRestStore).
  // restSaid: that request's answer in time ({ v: the room's meta, null for no such room }), or undefined when it was
  // refused or took too long (a slow phone gets six seconds: past that, the SDK asks again below and holds a connection).
  let restSaid;
  if (player && code && firebaseConfigured()) {
    $('#app').innerHTML = `<div class="p-wrap"><div class="panel p-card p-center" style="margin-top:14vh"><div class="p-spin">${ICON.snowflake}</div><p class="p-p">Opening the game…</p></div></div>`;
    const rest = createRestStore();
    restSaid = await Promise.race([rest.get(roomPath(code) + '/meta').then(v => ({ v }), e => { console.warn(e); return undefined; }), new Promise(ok => setTimeout(ok, 6000))]);
    const meta = restSaid && restSaid.v;
    if (meta && meta.mode === 'async') { store = rest; watchConnection(); PlayerApp(code, meta); return; }
  }
  try { await initStore(); }
  catch (e) {
    $('#app').innerHTML = `<div class="p-wrap"><div class="panel p-card p-center" style="margin-top:14vh"><h2 class="p-h">Can't connect</h2><p class="p-p">${esc(e.message || e)}</p><button class="btn block" style="margin-top:16px" onclick="location.reload()">Try again</button></div></div>`;
    return;
  }
  if (store.mode === 'demo') {
    const r = document.createElement('div'); r.className = 'demo-ribbon';
    r.textContent = 'Demo mode: works between tabs of this browser only. Add your Firebase config to play for real.';
    document.body.appendChild(r);
  }
  watchConnection();
  if (role === 'host') HostApp(code);
  else if (role === 'display' || role === 'screen') DisplayApp(code, URLP.get('key') || '');
  else {
    let meta = null;
    if (code && (store.mode === 'demo' || !restSaid)) { try { meta = await getWithin(roomPath(code) + '/meta', 5000); } catch (e) { /* the player page says what's wrong */ } }
    PlayerApp(code, meta && meta.mode === 'async' ? meta : null);
  }
})();
</script>

   Each is a JPEG data URL; an item without one here falls back to its img/ file.
   They sit in their own script at the very end, so the game starts while they're still downloading. */
var ITEM_PHOTOS = {
};
if (typeof photosArrived === "function") photosArrived();
