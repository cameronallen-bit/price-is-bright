<!--
  THE PRICE IS BRIGHT  ·  Marketing Connections, holiday 2026  (built from The Price Is Fright, October 2026)

  One file, three screens, picked by the URL:
    (no params)                  the landing page: Join game / Host game
    ?role=host                   host console: creates the room and runs the show
    ?room=ABCD&role=display      the big screen you share in Teams
    ?room=ABCD                   what players open (?role=join = the join page, with a room code box)

  Setup
    1. Paste your Firebase config into FIREBASE_CONFIG just below (same idea as Choc Trivia).
       Until you do, the game runs in DEMO MODE: it works end to end, but only between
       tabs of one browser. Handy for rehearsing, useless for the real meeting.
    2. Open the rules: Firebase console → Realtime Database → Rules. Add the priceIsBright
       block inside "rules" and keep any blocks already there (Choc Trivia's, for example).
       Next to October's game, the whole thing looks like this:

         {
           "rules": {
             "priceIsFright": { ".read": true, ".write": true },
             "priceIsBright": { ".read": true, ".write": true }
           }
         }

       The key must match GAME.dbRoot below. It holds room codes, first names, guesses and
       your price edits. Anyone with the database URL could read or change it, so keep
       nothing sensitive there.
    3. Photos: save each listing photo into the img/ folder next to this file, named as in ITEMS
       (img/01-royal-dansk.jpg, and img/106-katzs-deli.jpg for the postcard), then run
       tools/embed-photos.js to build them into this file. Any item without a photo shows its
       built-in illustration.
    4. Push to GitHub Pages. Open the link and tap Host game (or go to ?role=host), click New Live Game, open the display, and paste
       the join link into the Teams chat.

  Prices, reveal lines and fine print can also be edited live in the host console. Edits
  are saved to the database and apply to every game, so the "recheck the week of" numbers
  can be fixed without redeploying.
-->

  debugClockOffset: 0           // testing only: ms added to every clock on this page (to test a close time without waiting)
};

/* The round 2 palette (design spec, section 4): deep evergreen ground, Santa red trim, snow white and cream paper,
   gold for anything lit. Three working rules: red is trim and never a verdict; light is the signal (the right answer
   is the lit one); bulb colors are decoration. */
:root {
  --bg: #0a2a20;              /* page background: deep evergreen */
  --bg-2: #0e3528;            /* raised background, unlit fills */
  --bg-3: #134434;            /* panels, idle answer tiles */
  --bg-4: #184f3d;            /* controls, chips */
  --line: #1f5f48;            /* quiet rules */
  --line-2: #2f7d60;          /* panel borders, stronger rules (decorative only) */
  --edge: #7fc4a4;            /* outline of anything you can tap */
  --ink: #fffaf0;             /* main text: warm cream */
  --ink-2: #e2eee4;
  --muted: #a9d0bc;
  --faint: #93c0aa;           /* fine print, on solid fills only */
  --accent: #ffc93c;          /* gold: buttons, "now", the crowd marker */
  --accent-hi: #ffdd7a;
  --accent-deep: #b9820d;
  --lit: #ffe08a;             /* anything switched on: the price, the code, focus rings */
  --encore: #8ff0c0;          /* mint: the encore, closest guess, locked in, points won */
  --encore-deep: #1f8a5a;
  --alert: #ffa095;           /* last seconds, errors: always with an icon or words */
  --you: #ffffff;             /* snow white: your guess, your pick */
  --you-soft: #f2faf5;
  --paper: #fff6e3;           /* fact box, cards, tags */
  --paper-ink: #0f3327;       /* ink on paper, and dark text on any gold fill */
  --trim: #c8202c;            /* Santa red: signs, the awning, ribbons. Always edged in cream */
  --trim-hi: #e5383b;
  --trim-deep: #7d0f18;
  --snow: #ffffff;
  --bulb-1: #ff4438; --bulb-2: #ffc93c; --bulb-3: #2fd67b; --bulb-4: #ff8a2a; --bulb-5: #fff3d6;   /* decoration only */
  --ui: "Rubik", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --show: "Spicy Rice", "Rubik", "Arial Black", system-ui, sans-serif;          /* digits, labels, codes */
  --festive: "Mountains of Christmas", "Spicy Rice", Georgia, serif;             /* headlines */
  --show-ease: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button, input, select, textarea { font-family: inherit; }
[hidden] { display: none !important; }
a { color: var(--lit); }
::selection { background: var(--accent); color: var(--paper-ink); }

/* ---------- the night sky behind everything ---------- */
.sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background:
    radial-gradient(1100px 680px at 82% -12%, rgba(255,255,255,.24), transparent 62%),
    radial-gradient(900px 620px at 6% 112%, rgba(255,201,60,.16), transparent 62%),
    linear-gradient(180deg, #0f3d2e 0%, #0a2a20 58%, #06201a 100%); }
.stars { position: absolute; inset: -20px; opacity: .55;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><g fill='white'><circle cx='14' cy='22' r='1.2'/><circle cx='64' cy='80' r='.8'/><circle cx='122' cy='18' r='1'/><circle cx='190' cy='64' r='1.4'/><circle cx='250' cy='26' r='.8'/><circle cx='300' cy='96' r='1.1'/><circle cx='38' cy='150' r='.9'/><circle cx='98' cy='198' r='1.3'/><circle cx='162' cy='140' r='.7'/><circle cx='222' cy='186' r='1'/><circle cx='284' cy='230' r='.8'/><circle cx='20' cy='262' r='1.1'/><circle cx='76' cy='300' r='.7'/><circle cx='140' cy='262' r='1'/><circle cx='206' cy='300' r='1.2'/><circle cx='262' cy='150' r='.7'/></g></svg>");
  animation: twinkle 7s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .22; } to { opacity: .6; } }

.app { position: relative; z-index: 1; min-height: 100vh; }

/* ---------- logo ---------- */
.logo { display: inline-flex; flex-direction: column; align-items: center; line-height: .86; text-align: center; user-select: none; }
.logo .l-top { font-family: var(--show); color: var(--lit); letter-spacing: .02em;
  text-shadow: 0 3px 0 #8a5606, 0 6px 0 #5c3806, 0 10px 22px rgba(0,0,0,.55); }
/* "Avoya Marketing" under the logo */
.l-avoya { display: block; font-family: var(--festive); font-weight: 400; line-height: 1; color: var(--accent); letter-spacing: .16em; text-transform: uppercase; white-space: nowrap;
  text-shadow: 0 2px 0 #5c3806, 0 0 16px rgba(255,190,70,.35); }
.logo .l-avoya { display: flex; align-items: center; justify-content: center; gap: .6em; margin-top: .4em; font-size: 26px; padding-left: .16em; }
.logo .l-avoya::before, .logo .l-avoya::after { content: ""; flex: none; width: 2.2em; height: .12em; border-radius: 1px; background: linear-gradient(90deg, rgba(255,201,60,0), currentColor); }
.logo .l-avoya::after { background: linear-gradient(270deg, rgba(255,201,60,0), currentColor); margin-left: -.2em; }

/* ---------- buttons ---------- */
.btn { appearance: none; border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font: 700 17px/1.1 var(--ui); color: var(--paper-ink); text-decoration: none;
  background: linear-gradient(180deg, var(--accent-hi), var(--accent));
  padding: 15px 22px; border-radius: 14px;
  box-shadow: 0 4px 0 var(--accent-deep), 0 10px 24px rgba(255,190,70,.22);
  transition: transform .08s ease, box-shadow .08s ease, filter .2s ease; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep), 0 4px 12px rgba(255,190,70,.2); }
.btn:disabled { cursor: not-allowed; filter: saturate(.25) brightness(.62); transform: none; }
.btn.mint { color: #0a3524; background: linear-gradient(180deg, #c9fbe0, var(--encore)); box-shadow: 0 4px 0 var(--encore-deep), 0 10px 24px rgba(143,240,192,.18); }
.btn.mint:active { box-shadow: 0 1px 0 var(--encore-deep); }
.btn.soft { color: var(--ink); background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 2px var(--line-2); }
.btn.soft:active { box-shadow: inset 0 0 0 2px var(--you); }
.btn.danger { color: #fff; background: linear-gradient(180deg, #ffb3a9, var(--alert)); box-shadow: 0 4px 0 #7d0f18; }
.btn.small { font-size: 14px; padding: 9px 13px; border-radius: 10px; box-shadow: 0 3px 0 var(--accent-deep); }
.btn.soft.small { box-shadow: inset 0 0 0 2px var(--line-2); }
.btn.big { font-size: 21px; padding: 19px 26px; border-radius: 16px; }
.btn.block { display: flex; width: 100%; }
.btn:focus-visible, .opt:focus-visible, .linkbtn:focus-visible { outline: 3px solid var(--lit); outline-offset: 3px; }
.linkbtn { appearance: none; background: none; border: 0; padding: 0; color: var(--lit); font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- inputs ---------- */
.field { display: grid; gap: 8px; text-align: left; }
.field > label { font-weight: 600; color: var(--ink-2); font-size: 15px; }
.input { width: 100%; font: 600 20px/1.2 var(--ui); color: var(--ink); background: rgba(6,32,26,.55);
  border: 2px solid var(--line-2); border-radius: 14px; padding: 14px 16px; outline: none; transition: border-color .15s, box-shadow .15s; }
.input::placeholder { color: var(--faint); font-weight: 500; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,190,70,.18); }
.input.code { text-transform: uppercase; letter-spacing: .3em; text-align: center; font-family: var(--show); font-size: 30px; padding: 12px; }

/* ---------- chips, cards ---------- */
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 14px;
  background: rgba(255,255,255,.05); border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; }
.chip.hot { background: rgba(255,201,60,.14); border-color: rgba(255,201,60,.55); color: var(--lit); }
.chip.green { background: rgba(143,240,192,.12); border-color: rgba(143,240,192,.5); color: #e6fff2; }
.chip.gold { background: rgba(255,224,138,.13); border-color: rgba(255,224,138,.55); color: var(--lit); }
.panel { background: linear-gradient(180deg, rgba(46,28,82,.78), rgba(29,17,51,.82)); border: 1px solid var(--line); border-radius: 20px;
  box-shadow: 0 18px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.num { font-variant-numeric: tabular-nums; }
.icon { width: 1.1em; height: 1.1em; flex: none; }

/* ---------- system ribbons, banners, toasts ---------- */
.demo-ribbon { position: fixed; z-index: 50; bottom: 0; left: 50%; transform: translateX(-50%); max-width: calc(100% - 24px); pointer-events: none;
  background: var(--lit); color: var(--paper-ink); font: 700 11px/1.25 var(--ui); padding: 5px 12px 6px; border-radius: 10px 10px 0 0; text-align: center;
  box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.sys-banner { position: fixed; z-index: 60; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(640px, calc(100% - 24px));
  background: #3a0b16; border: 1px solid var(--alert); color: #ffd3cf; border-radius: 14px; padding: 12px 16px; font-size: 14px; box-shadow: 0 12px 30px rgba(0,0,0,.5); }
.sys-banner b { color: #fff; }
.toast { position: fixed; z-index: 70; left: 50%; top: 22px; transform: translate(-50%, -12px); opacity: 0; pointer-events: none;
  background: var(--bg-4); border: 1px solid var(--line-2); color: var(--ink); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 15px;
  box-shadow: 0 10px 26px rgba(0,0,0,.45); transition: opacity .2s, transform .2s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.offline-pill { position: fixed; z-index: 55; top: 10px; right: 10px; background: #3a0b16; border: 1px solid var(--alert); color: #ffd3cf; font: 600 12px var(--ui); padding: 5px 10px; border-radius: 999px; }

/* ---------- art frames (photo or illustration) ---------- */
.art { position: relative; background: var(--paper); border-radius: 26px; overflow: hidden;
  box-shadow: 0 0 0 8px var(--accent), 0 0 0 11px #7d0f18, 0 0 60px 6px rgba(255,190,70,.35), 0 24px 50px rgba(0,0,0,.5); }
.art > img, .art > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.art > img { object-fit: contain; padding: 6%; }
/* scene photos fill the frame; product shots sit whole on the frame's paper color (white backdrops blend in);
   posters sit whole on a blurred copy of themselves */
.art > img.ph-cover, .pdp-img .art > img.ph-cover { object-fit: cover; padding: 0; }
.art > img.ph-contain { mix-blend-mode: multiply; }
.art > img.ph-bd, .pdp-img .art > img.ph-bd, .pi-photo .art > img.ph-bd { display: none; object-fit: cover; padding: 0; filter: blur(14px) brightness(.42) saturate(1.25); transform: scale(1.25); }
.art.fit > img.ph-bd, .art > img.ph-bd.keep { display: block; }
.art.fit > img.ph-cover, .pdp-img .art.fit > img.ph-cover { object-fit: contain; filter: drop-shadow(0 8px 20px rgba(0,0,0,.6)); }
.art > img.ph-poster { object-fit: contain; padding: 4%; filter: drop-shadow(0 10px 22px rgba(0,0,0,.65)); }
.pdp-img .art > img.ph-poster { padding: 5% 0; }
.pi-photo .art > img.ph-poster { padding: 3% 0; }
.art.sm { border-radius: 16px; box-shadow: 0 0 0 4px var(--accent), 0 0 0 6px #7d0f18, 0 10px 24px rgba(0,0,0,.45); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
/* ============================== DISPLAY (the shared screen) ============================== */
body.role-display { overflow: hidden; cursor: default; }
body.role-display.hide-cursor { cursor: none; }
/* The stage fills the window at any size: everything is drawn at 1600 × 900 and scaled as big as fits, and the room
   left over goes to the margins (--px, --py, set by fit() in DisplayApp). Each screen is centered in the window; the
   store page and the standings sit at the top instead, so the store's header bar is always the window's top bar, edge to edge. */
.stage { position: fixed; left: 0; top: 0; z-index: 2; width: var(--sw, 1600px); height: var(--sh, 900px);
  transform: scale(var(--s, 1)); transform-origin: 0 0; }
.screen { position: absolute; left: var(--px, 0px); top: var(--py, 0px); width: 1600px; height: 900px; }
.screen.s-scene, .screen.s-standings { top: 0; }   /* screens with a top bar keep it at the top of the window */
.screen.enter { animation: screenIn .55s cubic-bezier(.2,.8,.2,1) both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }

/* (October's moon and the things that flew past are gone: the snow and the garlands are the atmosphere now) */

/* ---------- top bar ---------- */
.d-top { position: absolute; left: 56px; right: 56px; top: 30px; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
/* the small logo: "The Price Is Bright" on one line, both words on a shared center line, and
   "Avoya Marketing" centred under the whole of it between two thin rules */
.d-mini { display: inline-grid; grid-template-columns: auto auto; align-items: center; column-gap: 10px; row-gap: 5px; white-space: nowrap; line-height: 1; }
.d-mini .l-top { font-family: var(--show); font-size: 27px; padding-top: 4px; color: var(--lit); text-shadow: 0 2px 0 #8a5606, 0 6px 14px rgba(0,0,0,.5); }
.d-mini .l-avoya, .p-mini .l-avoya, .h-brand .l-avoya { display: flex; align-items: center; gap: .7em; padding-left: .3em; text-shadow: 0 1px 0 #5c3806; }
.d-mini .l-avoya { grid-column: 1 / -1; font-size: 13px; letter-spacing: .3em; }
.d-mini .l-avoya::before, .d-mini .l-avoya::after, .p-mini .l-avoya::before, .p-mini .l-avoya::after, .h-brand .l-avoya::before, .h-brand .l-avoya::after {
  content: ""; flex: 1 1 0; min-width: 8px; height: 2px; border-radius: 1px; background: linear-gradient(90deg, rgba(255,201,60,0), currentColor); }
.d-mini .l-avoya::after, .p-mini .l-avoya::after, .h-brand .l-avoya::after { margin-left: -.3em; background: linear-gradient(270deg, rgba(255,201,60,0), currentColor); }
.d-steps { display: flex; align-items: center; gap: 11px; }
.d-steps i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-2); display: block; transition: all .3s; }
.d-steps i.done { background: var(--accent); border-color: var(--accent); }
.d-steps i.now { background: var(--lit); border-color: var(--lit); transform: scale(1.45); box-shadow: 0 0 0 5px rgba(255,190,70,.18), 0 0 18px rgba(255,190,70,.6); }
.d-steps i.dbl { width: 20px; height: 20px; border-color: var(--lit); }
.d-join { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
.d-join .code { font-family: var(--show); font-size: 32px; letter-spacing: .1em; color: var(--lit); line-height: 1; padding-top: 4px; text-transform: none; }

/* ---------- lobby ---------- */
.s-lobby .lob-left { position: absolute; left: 56px; top: 104px; width: 930px; display: flex; flex-direction: column; align-items: center; }
.marquee { position: relative; padding: 30px 64px 32px; border-radius: 34px; background: rgba(6,32,26,.72);
  box-shadow: inset 0 0 0 3px #6b2a08, inset 0 0 0 9px rgba(255,190,70,.12), 0 0 70px rgba(255,190,70,.18); }
.marquee .bulb { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #fffbe0, #ffe08a 45%, #e08a00 100%); box-shadow: 0 0 10px 2px rgba(255,190,70,.75); }
.marquee .bulb.b { animation: bulb 1.1s steps(1) infinite; }
.marquee .bulb.a { animation: bulb 1.1s steps(1) infinite; animation-delay: -.55s; }
@keyframes bulb { 0% { opacity: 1; } 50% { opacity: .28; box-shadow: none; } }
.s-lobby .logo .l-top { font-size: 92px; }
.s-lobby .logo .l-avoya { font-size: 40px; margin-top: .3em; }
.tagline { font-family: var(--show); font-size: 40px; color: var(--accent-hi); margin-top: 22px; letter-spacing: .02em; text-shadow: 0 3px 0 #5c3806; }
.joincard { position: absolute; right: 56px; top: 56px; width: 500px; padding: 28px 30px 26px; text-align: center; }
.qrbox { width: 300px; height: 300px; margin: 0 auto; background: #fff; border-radius: 22px; padding: 14px; box-shadow: 0 0 0 6px var(--accent), 0 14px 30px rgba(0,0,0,.45); }
.qrbox svg { width: 100%; height: 100%; display: block; }
.joincard .scan { margin-top: 26px; font-size: 19px; color: var(--muted); }
.joincard .scan.then { margin-top: 4px; }
.joincard .scan.then b { color: var(--accent-hi); font-weight: 700; }
.joincard.live .qrbox { width: 280px; height: 280px; }   /* (room for the "and tap Join game" line) */
.joincard.live .scan { margin-top: 20px; }
.joincard.live .scan.then { margin-top: 4px; }
.joincard.live .codelab { margin-top: 14px; }
.joincard .url { font-size: 24px; font-weight: 700; color: var(--ink); margin-top: 4px; overflow-wrap: anywhere; line-height: 1.25; }
.joincard .url.long { font-size: 20px; }
.joincard .codelab { margin-top: 18px; font-size: 18px; color: var(--muted); text-transform: uppercase; letter-spacing: .16em; font-weight: 600; }
.joincard .bigcode { font-family: var(--show); font-size: 104px; line-height: .95; color: var(--lit); letter-spacing: .1em; padding-left: .1em;
  text-shadow: 0 4px 0 #8a5606, 0 0 30px rgba(255,190,70,.35); }
.lob-players { position: absolute; left: 56px; right: 56px; bottom: 40px; height: 196px; padding: 18px 26px; display: flex; flex-direction: column; gap: 14px; }
.lob-players h3 { margin: 0; font-family: var(--show); font-weight: 400; font-size: 30px; color: var(--ink); letter-spacing: .02em; }
.lob-players h3 span { color: var(--lit); }
.lob-players .wait { color: var(--muted); font-size: 22px; }
.pbubbles { display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; overflow: hidden; flex: 1; min-height: 0; }
.pb { display: inline-flex; align-items: center; gap: 8px; padding: 7px 15px 7px 10px; border-radius: 999px; font-size: 20px; font-weight: 600;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.22); color: var(--ink); animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
.pb svg { width: 22px; height: 22px; }
.pbubbles.many .pb { font-size: 16px; padding: 5px 12px 5px 8px; }
.pbubbles.many .pb svg { width: 17px; height: 17px; }
.pbubbles.lots { gap: 7px; }
.pbubbles.lots .pb { font-size: 14px; padding: 4px 10px 4px 7px; gap: 6px; }
.pbubbles.lots .pb svg { width: 15px; height: 15px; }
.pb.pb-more { color: var(--lit); font-weight: 700; }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }

/* ---------- shared bits of the item scene (the rest lives in the product page styles) ---------- */
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.12); } }
.stamp { position: absolute; z-index: 20; left: 50%; top: 50%; pointer-events: none; font-family: var(--show); font-size: 168px; line-height: 1; white-space: nowrap;
  color: #fff; padding: 26px 50px 10px; border: 12px solid #fff; border-radius: 30px; background: rgba(200,32,44,.92);
  box-shadow: 0 0 0 10px rgba(200,32,44,.5), 0 30px 80px rgba(0,0,0,.6); transform: translate(-50%, -50%) rotate(-8deg); animation: stamp 1.9s cubic-bezier(.2,1.4,.3,1) both; }
@keyframes stamp { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-8deg) scale(2.4); } 14% { opacity: 1; transform: translate(-50%, -50%) rotate(-8deg) scale(1); }
  80% { opacity: 1; transform: translate(-50%, -50%) rotate(-8deg) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(-8deg) scale(.92); } }

/* ---------- standings ---------- */
.st-title { position: absolute; left: 92px; top: 124px; display: flex; align-items: baseline; gap: 22px; }
.st-title h2 { margin: 0; font-family: var(--show); font-weight: 400; font-size: 76px; color: var(--ink); line-height: 1; text-shadow: 0 4px 0 rgba(0,0,0,.35); }
.st-title span { font-size: 26px; color: var(--muted); font-weight: 500; }
.st-list { position: absolute; left: 92px; right: 92px; top: 236px; display: flex; flex-direction: column; gap: 10px; }
.st-row { display: grid; grid-template-columns: 64px minmax(0, 360px) minmax(0, 1fr) 180px 86px 230px; align-items: center; gap: 22px; height: 66px; padding: 0 22px;
  border-radius: 16px; background: rgba(14,53,40,.7); border: 1px solid var(--line); animation: rowIn .5s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes rowIn { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
.st-row .rk { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font-family: var(--show); font-size: 28px; padding-top: 3px; color: var(--ink); background: var(--bg-4); }
.st-row.r1 .rk { background: var(--lit); color: var(--paper-ink); box-shadow: 0 0 18px rgba(255,190,70,.5); }
.st-row.r2 .rk { background: #e2eee4; color: #0f3327; }
.st-row.r3 .rk { background: #e3b07a; color: var(--paper-ink); }
.st-row .nm { font-size: 30px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-row .trk { height: 12px; border-radius: 6px; background: rgba(255,255,255,.06); position: relative; overflow: hidden; }
.st-row .trk i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 6px 6px 0; background: var(--accent); transform-origin: 0 50%; animation: grow 1s .25s cubic-bezier(.2,.9,.3,1) both; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.st-row .tot { font-family: var(--show); font-size: 36px; text-align: right; color: var(--lit); padding-top: 4px; }
.st-row .mv { font-size: 20px; font-weight: 700; text-align: center; color: var(--faint); }
.st-row .mv.up { color: var(--encore); }
.st-row .mv.down { color: #ffd3cf; }
.st-row .rd { font-size: 20px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- final ---------- */
.fn-title { position: absolute; left: 0; right: 0; top: 110px; text-align: center; }
.fn-title h2 { margin: 0; font-family: var(--show); font-weight: 400; font-size: 84px; line-height: 1; color: var(--lit); text-shadow: 0 5px 0 #8a5606, 0 0 40px rgba(255,190,70,.3); }
.fn-title p { margin: 8px 0 0; font-size: 24px; color: var(--muted); }
.podium { position: absolute; left: 70px; top: 300px; width: 1010px; height: 560px; }
.podium .ground { position: absolute; left: -40px; right: -40px; bottom: 0; height: 60px; border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  background: linear-gradient(180deg, #e3efe9, #c9ddd3); box-shadow: 0 -2px 0 #ffffff; }
.pd { position: absolute; bottom: 30px; display: flex; flex-direction: column; align-items: center; opacity: 0; transform: translateY(80px); transition: opacity .6s, transform .9s cubic-bezier(.2,1.3,.4,1); }
.pd.on { opacity: 1; transform: none; }
.pd .who3 { font-family: var(--show); font-size: 40px; color: var(--ink); text-align: center; line-height: 1.05; max-width: 330px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 14px; text-shadow: 0 3px 0 rgba(0,0,0,.4); }
.pd.p1 .who3 { font-size: 50px; color: var(--lit); }
.pd.p2 { left: 0; }     .pd.p2 .stone { width: 290px; height: 292px; }
.fn-rest { position: absolute; right: 70px; top: 300px; width: 420px; display: flex; flex-direction: column; gap: 9px; }
.fn-rest h3 { margin: 0 0 6px; font-size: 20px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.fn-rest .r { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 14px; height: 52px; padding: 0 16px; border-radius: 13px;
  background: rgba(14,53,40,.72); border: 1px solid var(--line); opacity: 0; transform: translateX(24px); transition: opacity .4s, transform .5s; }
.fn-rest .r.on { opacity: 1; transform: none; }
.fn-rest .r b { font-family: var(--show); font-weight: 400; font-size: 24px; color: var(--muted); padding-top: 3px; }
.fn-rest .r span { font-size: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fn-rest .r em { font-style: normal; font-family: var(--show); font-size: 24px; color: var(--lit); padding-top: 3px; }
canvas.confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

/* ---------- poll ---------- */
.pl-title { position: absolute; left: 92px; right: 92px; top: 124px; }
.pl-title h2 { margin: 0; font-family: var(--show); font-weight: 400; font-size: 70px; line-height: 1.02; color: var(--ink); text-shadow: 0 4px 0 rgba(0,0,0,.35); }
.pl-title p { margin: 10px 0 0; font-size: 24px; color: var(--muted); }
.pl-rows { position: absolute; left: 92px; right: 92px; top: 290px; display: flex; flex-direction: column; gap: 26px; }
.pl-row { display: grid; grid-template-columns: minmax(0, 1fr) 170px; column-gap: 26px; row-gap: 10px; align-items: center; opacity: 0; transform: translateY(14px); transition: opacity .5s, transform .5s; }
.pl-row.on { opacity: 1; transform: none; }
.pl-row .lb { font-size: 32px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 14px; }
.pl-row .lb .tp { font-family: var(--show); font-weight: 400; font-size: 20px; color: var(--paper-ink); background: var(--lit); padding: 6px 12px 2px; border-radius: 9px; }
.pl-row .ct { grid-row: span 2; text-align: right; font-family: var(--show); font-size: 46px; color: var(--ink); line-height: 1; padding-top: 4px; }
.pl-row .ct small { display: block; font-family: var(--ui); font-size: 20px; color: var(--muted); font-weight: 600; margin-top: 4px; }
.pl-row .trk { height: 22px; border-radius: 0 6px 6px 0; background: rgba(255,255,255,.06); position: relative; }
.pl-row .trk i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 6px 6px 0; background: #4fae84; transform-origin: 0 50%; transform: scaleX(0); transition: transform 1.1s cubic-bezier(.2,.9,.3,1); }
.pl-row.on .trk i { transform: scaleX(1); }
.pl-row.top .trk i { background: var(--accent); }
.pl-row .names { grid-column: 1 / -1; font-size: 18px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -2px; }

/* ---------- end ---------- */
.s-end .end-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; padding-bottom: 20px; }
.s-end .logo .l-top { font-size: 64px; }
.s-end .logo .l-avoya { font-size: 34px; }
.s-end h2 { margin: 26px 0 0; font-family: var(--show); font-weight: 400; font-size: 64px; color: var(--ink); line-height: 1.05; }
.s-end .champ { font-size: 30px; color: var(--ink-2); }
.s-end .champ b { color: var(--lit); }
.s-end .hh { font-family: var(--festive); font-size: 74px; color: var(--accent-hi); text-shadow: 0 0 24px rgba(255,190,70,.45); margin-top: 8px; }

/* ---------- waiting / notices on the stage ---------- */
.d-wait { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; }
.d-wait h2 { margin: 0; font-family: var(--show); font-weight: 400; font-size: 54px; color: var(--ink); }
.d-wait p { margin: 0; font-size: 26px; color: var(--muted); max-width: 900px; }

/* ---------- display chrome that sits outside the stage ---------- */
.d-ctrl { position: fixed; z-index: 30; left: 14px; bottom: 14px; display: flex; gap: 8px; align-items: center; transition: opacity .4s; }
.d-ctrl button { appearance: none; border: 1px solid var(--line-2); background: rgba(14,53,40,.8); color: var(--ink-2); border-radius: 999px; height: 38px; padding: 0 14px;
  display: inline-flex; align-items: center; gap: 8px; font: 600 13px var(--ui); cursor: pointer; }
.d-ctrl button svg { width: 18px; height: 18px; }
.d-ctrl.quiet { opacity: 0; }
.keyhelp { position: fixed; z-index: 31; right: 14px; bottom: 14px; background: rgba(14,53,40,.92); border: 1px solid var(--line-2); border-radius: 14px; padding: 12px 16px;
  font-size: 13px; color: var(--ink-2); line-height: 1.7; transition: opacity .4s; }
.keyhelp kbd { display: inline-block; min-width: 22px; text-align: center; font: 700 12px var(--ui); color: var(--ink); background: var(--bg-4); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; margin-right: 6px; }
.keyhelp.off { opacity: 0; pointer-events: none; }

/* ---------- the encore: its own board, and both champions at the end ---------- */
.s-standings.enc .st-title h2 { color: var(--encore); text-shadow: 0 4px 0 var(--encore-deep), 0 0 26px rgba(143,240,192,.3); }
.s-end .end-wrap.both { gap: 12px; }
.s-end .end-wrap.both h2 { margin-top: 16px; }
.champs2 { display: flex; gap: 22px; margin-top: 4px; }
.champs2 .c2 { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 340px; padding: 16px 30px 14px; border-radius: 18px; background: rgba(14,53,40,.72); border: 1px solid var(--line); }
.champs2 span { font-size: 16px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.champs2 b { font-family: var(--show); font-weight: 400; font-size: 40px; line-height: 1.05; padding-top: 6px; color: var(--lit); max-width: 560px; }
.champs2 .enc b { color: var(--encore); text-shadow: 0 0 16px rgba(143,240,192,.35); }
.champs2 em { font-style: normal; font-size: 18px; font-weight: 600; color: var(--ink-2); }
/* ============================== PLAYER (phones and laptops) ==============================
   Most people watch the game here, so the phone mirrors the big screen: the same store listing for each item, the same
   fact pop-up, the same drum reveal of the price, the same leaderboard, podium and poll, all timed off the host's clock
   so every phone plays them together. Laptops get the big screen's two-column store page. */
.p-wrap { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; gap: 14px; overflow-x: hidden; overflow-x: clip;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.p-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding-top: 4px; }
.p-mini { display: inline-grid; grid-template-columns: auto auto; justify-content: start; align-items: center; column-gap: 6px; row-gap: 3px; white-space: nowrap; line-height: 1; flex: none; }
.p-mini .l-avoya { grid-column: 1 / -1; font-size: 10px; letter-spacing: .26em; }
.p-mini .l-top { font-family: var(--show); font-size: 17px; padding-top: 3px; color: var(--lit); text-shadow: 0 2px 0 #8a5606; }
.p-me { display: flex; align-items: center; gap: 8px; min-width: 0; }
.p-me .nm { font-weight: 700; font-size: 15px; max-width: 130px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-me .sc { font-family: var(--show); font-size: 17px; color: var(--paper-ink); background: var(--lit); border-radius: 9px; padding: 5px 9px 2px; white-space: nowrap; }
.p-me .sc.bump { animation: scBump .75s cubic-bezier(.2,1.6,.4,1); }
@keyframes scBump { 0% { transform: scale(1); } 30% { transform: scale(1.3); box-shadow: 0 0 0 4px rgba(255,190,70,.28), 0 0 24px rgba(255,190,70,.75); } 100% { transform: scale(1); } }
.p-card { padding: 22px 20px; }
.p-card > :first-child { margin-top: 0; }
.p-h { font-family: var(--show); font-weight: 400; font-size: 32px; line-height: 1.05; margin: 0 0 8px; color: var(--ink); letter-spacing: .01em; overflow-wrap: break-word; }
.p-p { margin: 0; color: var(--ink-2); font-size: 17px; }
.p-small { font-size: 14px; color: var(--muted); }
.p-center { text-align: center; }
.p-stack { display: flex; flex-direction: column; gap: 14px; }
.lab2 { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.p-eyes { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-weight: 600; font-size: 15px; margin-top: 4px; }
.p-eyes svg { width: 22px; height: 22px; color: var(--lit); }
.p-spin { width: 46px; height: 46px; margin: 4px auto 12px; color: var(--lit); animation: bob 1.6s ease-in-out infinite alternate; }
.p-spin svg { width: 100%; height: 100%; display: block; }
@keyframes bob { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-8px) rotate(6deg); } }
.p-rank { font-family: var(--show); font-size: 84px; line-height: 1; color: var(--lit); text-shadow: 0 5px 0 #8a5606; margin: 6px 0 4px; }
.p-rank small { font-size: 34px; }

/* join */
.p-join { text-align: center; padding-top: 4vh; }
.p-join .logo .l-top { font-size: 38px; }
.p-join .logo .l-avoya { font-size: 21px; }
.p-join .lede { margin: 14px 0 22px; color: var(--ink-2); font-size: 17px; }
.p-join form { display: flex; flex-direction: column; gap: 16px; }
/* the landing page (the bare link): Join game / Host game */
.p-land { padding-top: 8vh; }
.land-doors { display: flex; flex-direction: column; gap: 14px; padding: 20px; }
.land-doors .btn.big { font-size: 22px; padding: 20px 26px; }
.land-warn { text-align: center; margin-top: 24px; }
.land-warn .p-p b { color: var(--ink); }
.land-warn .btn.big { margin-top: 6px; }
.p-err { color: #ffd3cf; font-weight: 600; font-size: 15px; min-height: 1.2em; margin: 0; }

/* poll options */
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.opt { appearance: none; text-align: left; width: 100%; display: flex; align-items: center; gap: 12px; cursor: pointer;
  font: 600 17px/1.25 var(--ui); color: var(--ink); background: rgba(6,32,26,.45); border: 2px solid var(--line-2); border-radius: 14px; padding: 14px 16px; transition: border-color .15s, background .15s; }
.opt .tick { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; }
.opt .tick svg { width: 14px; height: 14px; opacity: 0; }
.opt.on { border-color: var(--accent); background: rgba(255,201,60,.13); }
.opt.on .tick { border-color: var(--accent); background: var(--accent); color: var(--paper-ink); }
.opt.on .tick svg { opacity: 1; }
.opt:disabled { cursor: default; }

/* ---------- the lobby: you're in, how it works, who else is here ---------- */
.p-hello { position: relative; text-align: center; }
.p-hello::before { content: ""; position: absolute; inset: 6px; border-radius: 15px; pointer-events: none; border: 4px dotted rgba(255,224,138,.9);
  filter: drop-shadow(0 0 4px rgba(255,190,70,.75)); animation: marq 1.1s steps(1) infinite; }
@keyframes marq { 50% { border-color: rgba(255,224,138,.32); } }
.p-how { display: grid; gap: 10px; margin: 16px 0 0; padding: 14px 0 0; list-style: none; text-align: left; border-top: 1px solid var(--line); }
.p-how li { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: center; font-size: 15px; line-height: 1.35; color: var(--ink-2); }
.p-how li b { color: var(--ink); }
.p-how .ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,201,60,.14); color: var(--accent-hi); }
.p-how .ic svg { width: 18px; height: 18px; }
.p-who { padding: 16px 16px 14px; }
.p-who h3 { margin: 0 0 10px; font-family: var(--show); font-weight: 400; font-size: 21px; color: var(--ink); letter-spacing: .01em; }
.p-who h3 span { color: var(--lit); }
.p-who .pbubbles { gap: 7px; overflow: visible; }
.p-who .pb { font-size: 14px; padding: 4px 11px 4px 7px; gap: 6px; }
.p-who .pb svg { width: 15px; height: 15px; }
.p-who .pb.me { border-color: rgba(255,201,60,.7); background: rgba(255,201,60,.14); color: #fff1c4; }

/* ---------- the item: a store listing on top, then the reveal, on one page ---------- */
.p-scene { display: flex; flex-direction: column; gap: 12px; }
.pi-left, .pi-right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pi-top { display: flex; align-items: center; gap: 10px; min-height: 20px; }
.pi-top .kick { font: 800 12px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--accent-hi); white-space: nowrap; }
.p-scene.enc .pi-top .kick { color: var(--encore); }
.pi-top .enc-tag { font-size: 10px; padding: 4px 8px 3px; }
.pi-dots { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.pi-dots i { width: 9px; height: 9px; border-radius: 5px; border: 2px solid var(--line-2); transition: all .3s; }
.pi-dots i.done { background: var(--line-2); }
.pi-dots i.dbl { border-color: var(--lit); }
.pi-dots i.now { width: 22px; background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px rgba(255,190,70,.55); }
.pi-photo { position: relative; height: clamp(180px, 31vh, 300px); border-radius: 20px; overflow: hidden; flex: none;
  background: radial-gradient(circle at 50% 42%, #fffaf1, #f1e4cc 80%); box-shadow: 0 16px 36px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.5);
  animation: imgIn .6s cubic-bezier(.2,1,.3,1) both; }
.pi-photo.tall { height: clamp(210px, 38vh, 340px); }   /* a movie poster: a taller frame so it reads */
.pi-photo .art { position: absolute; inset: 0; border-radius: 0; background: transparent; box-shadow: none; }
.pi-photo .art > img { padding: 5%; }
.pi-photo .art > img.ph-cover { padding: 0; }
.pi-photo .sticker { position: absolute; left: 12px; top: 13px; z-index: 2; font-family: var(--show); font-size: 17px; letter-spacing: .04em; color: #0a3524;
  padding: 8px 12px 4px; border-radius: 10px; background: linear-gradient(180deg, #c9fbe0, var(--encore)); box-shadow: 0 3px 0 var(--encore-deep), 0 0 20px rgba(143,240,192,.5);
  transform: rotate(-6deg); animation: stickerPulse 1.2s ease-in-out infinite alternate; }
/* the question: the one thing to answer, so it gets its own lit box */
.pi-q { display: flex; align-items: flex-start; gap: 11px; margin: 2px 0 0; padding: 12px 14px 13px 11px; border-radius: 16px;
  background: linear-gradient(180deg, rgba(255,224,138,.14), rgba(255,224,138,.05)); border: 2px solid rgba(255,224,138,.55); box-shadow: 0 0 24px rgba(255,190,70,.08);
  font-size: 18px; line-height: 1.36; font-weight: 600; color: #fff; text-wrap: pretty; }
.qb { flex: none; display: grid; place-items: center; width: 30px; height: 30px; margin-top: -1px; border-radius: 50%; background: var(--lit); color: var(--paper-ink);
  font: 400 21px/1 var(--show); padding-top: 4px; box-shadow: 0 2px 0 #8a5606; }

/* the buy box: price, the shoppers-and-clock line, then your guess */
.pi-buy { border-top: 1px solid var(--line); padding-top: 12px; }
.pi-pl { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.pi-pl em { font-style: normal; font-size: 11px; letter-spacing: .12em; color: #eadfc4; background: linear-gradient(180deg, #5a4c3e, #3a3027); border-radius: 6px; padding: 4px 9px 3px; box-shadow: 0 0 0 1.5px #140c12; }
.pi-price { position: relative; height: 54px; margin-top: 4px; transition: height .55s cubic-bezier(.2,.9,.3,1); }
.pi-myst { position: absolute; left: 0; top: 0; display: flex; align-items: flex-start; font-family: var(--show); color: var(--lit); line-height: 1;
  text-shadow: 0 0 18px rgba(255,190,70,.35); transform-origin: 0 50%; transition: opacity .3s, transform .45s, filter .45s; }
.pi-myst .cur { font-size: 26px; padding: 4px 3px 0 0; }
.pi-myst .q { font-size: 48px; padding-top: 4px; letter-spacing: .06em; animation: qflicker 5s infinite; }
.p-scene.revealing .pi-myst { opacity: 0; transform: scale(1.06); filter: blur(8px); pointer-events: none; }
.pi-rowfit { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: transform .55s cubic-bezier(.2,.9,.3,1); }
.pi-rowfit .prow { position: relative; }
.p-scene.revealing .prow { opacity: 1; }
.pi-deal { display: flex; align-items: center; gap: 10px; margin-top: 8px; min-height: 22px; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.pi-deal > div { display: flex; align-items: center; gap: 7px; min-width: 0; }
.pi-deal > div:first-child { overflow: hidden; }
.pi-deal > div + div { flex: none; padding-left: 10px; border-left: 1px solid var(--line-2); }
.pi-deal .ic { flex: none; width: 17px; height: 17px; color: var(--faint); }
.pi-deal .ic svg { width: 100%; height: 100%; display: block; }
.pi-deal b { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.pi-deal b:empty { display: none; }
.pi-deal .st { overflow: hidden; text-overflow: ellipsis; }
.pi-deal .bar { flex: none; width: 40px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
.pi-deal .bar i { display: block; height: 100%; border-radius: 3px; background: var(--you); transform-origin: 0 50%; transform: scaleX(0); transition: transform .4s cubic-bezier(.2,.9,.3,1); }
.pi-deal .full .bar i { background: var(--encore); }
.pi-deal .full .st { color: var(--encore); font-weight: 600; }
.pi-deal .clk.warn b, .pi-deal .clk.hot b { color: var(--lit); }
.pi-deal .clk.up { color: var(--muted); }
.p-scene.revealing .pi-deal { display: none; }
.pi-act { margin-top: 12px; }
.pi-act:empty { display: none; }
.pi-act.bye { overflow: hidden; transition: height .45s cubic-bezier(.4,0,.2,1), opacity .3s, margin-top .45s; height: 0 !important; opacity: 0; margin-top: 0; }
/* each phone screen eases in */
.p-in { animation: pIn .42s cubic-bezier(.2,.9,.3,1) both; }
@keyframes pIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.p-guess { position: relative; overflow: hidden; padding: 16px 14px 14px; transition: box-shadow .3s; }
/* the countdown, as a bar across the top of the guess card */
.gtime { position: absolute; left: 0; right: 0; top: 0; height: 5px; background: rgba(255,255,255,.07); }
.gtime i { display: block; height: 100%; background: linear-gradient(90deg, var(--you), var(--muted)); transform-origin: 0 50%; transform: scaleX(1); transition: transform .25s linear, background .3s; }
.gtime.idle i { background: rgba(255,255,255,.35); }
.gtime.warn i { background: var(--lit); }
.gtime.hot i { background: var(--alert); }
.grow { display: flex; gap: 8px; align-items: stretch; }
.grow .money { flex: 1; min-width: 0; }
.grow .btn { flex: none; padding: 0 16px; border-radius: 14px; font-size: 17px; }
@media (max-width: 350px) { .grow { flex-wrap: wrap; } .grow .btn { flex: 1 1 100%; padding: 14px; } }
.p-scene.hurry .p-guess { animation: hurry .9s ease-in-out infinite alternate; }
@keyframes hurry { from { box-shadow: 0 0 0 2px rgba(255,190,70,.35), 0 18px 40px rgba(0,0,0,.35); } to { box-shadow: 0 0 0 3px rgba(255,190,70,.95), 0 0 30px rgba(255,190,70,.45); } }
#gf { margin: 0; }
.money { display: flex; align-items: center; gap: 4px; background: rgba(6,32,26,.6); border: 2px solid var(--line-2); border-radius: 16px; padding: 4px 14px 4px 16px; transition: border-color .15s, box-shadow .15s; }
.money:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,190,70,.18); }
.money .cur { font-family: var(--show); font-size: 30px; color: var(--lit); padding-top: 4px; }
.money input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--ink); font: 700 27px/1.2 var(--ui); padding: 10px 0; font-variant-numeric: tabular-nums; }
.money input::placeholder { color: var(--faint); font-weight: 600; }
.p-preview { margin: 8px 4px 0; font-size: 14px; line-height: 1.35; color: var(--muted); font-weight: 500; }
.p-preview:empty { display: none; }
.p-preview b { color: var(--ink); }
.p-preview.bad { color: #ffd3cf; }
.p-keep { margin: 8px 0 0; text-align: center; font-size: 14px; color: var(--muted); }
.p-keep b { color: var(--ink); }
/* one-line cards that take the guess box's place: locked in, time's up, and your guess during the reveal */
.p-locked, .p-upbox, .p-mine { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; animation: pop .45s cubic-bezier(.2,1.5,.4,1) both; }
.p-locked { background: rgba(143,240,192,.08); border: 1px solid rgba(143,240,192,.4); }
.p-upbox { background: rgba(6,32,26,.5); border: 1px solid var(--line-2); grid-template-columns: auto minmax(0, 1fr); }
.p-mine { background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.5); grid-template-columns: auto minmax(0, 1fr); }
.p-locked .lk, .p-upbox .lk, .p-mine .lk { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.p-locked .lk { background: var(--encore); color: #0a3524; }
.p-upbox .lk { background: var(--bg-4); color: var(--lit); }
.p-mine .lk { background: rgba(255,255,255,.22); color: var(--you-soft); }
.p-locked .lk svg, .p-upbox .lk svg, .p-mine .lk svg { width: 19px; height: 19px; }
.p-locked .lab, .p-upbox .lab, .p-mine .lab { font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
.p-locked .lab { color: #c6f5dc; }
.p-upbox .lab { color: var(--muted); }
.p-mine .lab { color: var(--ink-2); }
.p-locked .v, .p-upbox .v, .p-mine .v { font-family: var(--show); font-size: 28px; line-height: 1.05; padding-top: 4px; overflow-wrap: anywhere; }
.p-locked .v { color: #eefff6; }
.p-upbox .v { color: var(--ink); font-size: 20px; }
.p-upbox .v.none { font-family: var(--ui); font-weight: 600; font-size: 16px; color: var(--ink-2); padding-top: 3px; }
.p-mine .v { color: #f0e9ff; }
.p-locked .btn { padding: 9px 12px; font-size: 13px; }
.p-upnote { margin: 8px 2px 0; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.p-upnote svg { width: 16px; height: 16px; color: var(--lit); }

/* the fact pop-up, phone-sized (same box and timing as the big screen) */
.p-scene .wdg { margin-top: 0; border-radius: 16px; transform: translateY(18px); z-index: 2; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
.p-scene .wdg.on { transform: none; }
.p-scene.revealing .wdg { opacity: 0; transform: translateY(14px); transition: opacity .3s, transform .3s; }
.p-scene .wdg.gone { display: none; }
.p-scene .chatw .hd { padding: 7px 12px; font-size: 14px; gap: 8px; }
.p-scene .chatw .av { width: 24px; height: 24px; }
.p-scene .chatw .av svg { width: 15px; height: 15px; }
.p-scene .chatw small { font-size: 12px; }
.p-scene .chatw .bd { padding: 9px 11px 11px; gap: 6px; }
.p-scene .chatw .msg { font-size: 15px; line-height: 1.38; padding: 7px 12px 8px; }
.p-scene .chatw .typing { padding: 10px 13px; }
.p-scene .chatw .typing i { width: 7px; height: 7px; }
.p-scene .qaw { padding: 11px 14px 12px; }
.p-scene .qaw .hd { font-size: 12px; }
.p-scene .qaw .hd svg { width: 16px; height: 16px; }
.p-scene .qaw .q, .p-scene .qaw p { font-size: 15px; line-height: 1.38; }

/* after the price lands: your guess against the price, the points, the seller's note, the top guesses */
.pi-after { display: flex; flex-direction: column; gap: 12px; }
.pi-after:empty { display: none; }
@keyframes resIn { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }
.pi-res { padding: 14px 14px 16px; text-align: center; animation: resIn .6s cubic-bezier(.2,1,.3,1) both; }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: 8px; }
.vs .t { min-width: 0; border-radius: 14px; padding: 10px 8px 9px; background: rgba(6,32,26,.45); border: 2px solid var(--line-2); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.vs .t .k { font: 700 11px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.vs .t .v { font-family: var(--show); font-size: 25px; line-height: 1.05; padding-top: 7px; white-space: nowrap; }
.vs .t .v.long { font-size: 17px; padding-top: 9px; white-space: normal; overflow-wrap: anywhere; }
.vs .t.me { border-color: rgba(255,255,255,.6); background: rgba(255,255,255,.08); }
.vs .t.me .k { color: var(--ink-2); }
.vs .t.me .v { color: var(--you-soft); }
.vs .t.me .v.none { font-family: var(--ui); font-weight: 600; font-size: 15px; color: var(--muted); padding-top: 8px; }
.vs .t.act { border-color: rgba(255,224,138,.75); background: rgba(255,224,138,.09); box-shadow: 0 0 22px rgba(255,190,70,.14); }
.vs .t.act .k { color: var(--lit); }
.vs .t.act .v { color: var(--lit); text-shadow: 0 0 14px rgba(255,190,70,.35); }
.vs .x { align-self: center; font-family: var(--festive); font-size: 22px; color: var(--accent-hi); text-shadow: 0 0 10px rgba(255,190,70,.5); }
.meter { position: relative; height: 84px; margin: 12px 6px 0; }
.meter .trk { position: absolute; left: 0; right: 0; top: 28px; height: 10px; border-radius: 5px;
  background: linear-gradient(90deg, #0e3528 0%, #1f5f48 22%, #b9820d 40%, #8ff0c0 50%, #b9820d 60%, #1f5f48 78%, #0e3528 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.meter .mid { position: absolute; left: 50%; top: 20px; width: 4px; height: 26px; margin-left: -2px; border-radius: 2px; background: var(--lit); box-shadow: 0 0 10px rgba(255,190,70,.9); }
/* the room's average guess: an orange marker under the track */
.meter .mavg { position: absolute; top: 40px; left: 50%; display: flex; flex-direction: column; align-items: center; transform: translateX(-50%); transition: left 1.2s cubic-bezier(.2,.9,.3,1) .5s; z-index: 1; }
.meter .mavg i { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 9px solid var(--accent-hi); filter: drop-shadow(0 0 5px rgba(255,190,70,.8)); }
.meter .mavg b { margin-top: 2px; font: 800 10px/1 var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--paper-ink); background: var(--accent-hi); padding: 3px 6px 2px; border-radius: 5px; white-space: nowrap; }
.meter .mpin { position: absolute; top: 0; left: 50%; display: flex; flex-direction: column; align-items: center; transform: translateX(-50%); transition: left 1.2s cubic-bezier(.2,.9,.3,1) .25s; z-index: 2; }
.meter .mpin b { font: 800 11px/1 var(--ui); color: #0e3528; background: var(--you-soft); padding: 4px 7px 3px; border-radius: 6px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
.meter .mpin i { width: 2px; height: 12px; background: var(--you-soft); }
.meter .mpin u { width: 12px; height: 12px; border-radius: 50%; margin-top: -1px; background: var(--you-soft); box-shadow: 0 0 0 2px #0e3528, 0 0 10px rgba(255,255,255,.8); text-decoration: none; }
.meter .at-l b { transform: translateX(calc(50% - 9px)); }
.meter .at-r b { transform: translateX(calc(-50% + 9px)); }
.meter .ends { position: absolute; left: 0; right: 0; top: 70px; display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--faint); }
.meter .ends span:nth-child(2) { color: var(--lit); }
.pi-verdict { margin-top: 10px; font-size: 15px; line-height: 1.35; color: var(--ink-2); font-weight: 500; }
.pi-verdict b { color: var(--ink); }
.pi-verdict .hot { color: var(--encore); font-weight: 700; }
.pi-crowd { margin-top: 4px; font-size: 13px; line-height: 1.35; color: var(--muted); }
.pi-crowd b { color: var(--accent-hi); font-weight: 700; }
.pi-gain { font-family: var(--show); font-size: 60px; line-height: 1; margin-top: 12px; color: var(--encore); text-shadow: 0 0 24px rgba(143,240,192,.35); font-variant-numeric: tabular-nums; animation: pop .6s .1s cubic-bezier(.2,1.6,.4,1) both; }
.pi-gain.zero { color: var(--muted); text-shadow: none; }
.pi-gain small { font-size: 22px; }
.pi-res .chips2 { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 12px; }
.pi-res .bonus { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 15px;
  background: rgba(143,240,192,.14); border: 1px solid rgba(143,240,192,.5); color: #e6fff2; animation: pop .6s .35s cubic-bezier(.2,1.6,.4,1) both; }
.pi-res .bonus.gold { background: rgba(255,224,138,.14); border-color: rgba(255,224,138,.5); color: var(--lit); }
.pi-res .bonus svg { width: 18px; height: 18px; }
.pi-res .dbl2 { margin-top: 10px; font-size: 13px; color: var(--muted); }
.pi-res .tot2 { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 15px; color: var(--muted); }
.pi-res .tot2 b { color: var(--ink); font-weight: 700; }
.pi-note { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; border: 2px solid rgba(143,240,192,.5); background: rgba(143,240,192,.07); animation: resIn .6s .12s cubic-bezier(.2,1,.3,1) both; }
.pi-note .ic { flex: none; width: 30px; height: 30px; margin-top: 1px; }
.pi-note .ic svg { width: 100%; height: 100%; display: block; }
.pi-note p { margin: 0; font-size: 15px; line-height: 1.42; font-weight: 600; color: var(--ink); }
.pi-note .src { margin-top: 5px; font-size: 12px; color: var(--faint); }
/* who was closest, one line under your points (the big screen keeps the full Top guesses) */
.pi-res .pi-closest { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 12px; font-size: 14px; line-height: 1.35; color: var(--ink-2); text-wrap: balance; }
.pi-res .pi-closest svg { flex: none; width: 16px; height: 16px; color: var(--encore); }
.pi-res .pi-closest i { display: contents; }
.pi-res .pi-closest .gold svg { color: var(--lit); }
.pi-res .pi-closest b { color: var(--ink); font-weight: 700; }

/* laptops: the big screen's two-column store page */
@media (min-width: 760px) {
  .p-wrap.wide { max-width: 1120px; padding-left: 32px; padding-right: 32px; }
  .p-wrap.wide .p-scene { display: grid; grid-template-columns: minmax(0, .84fr) minmax(0, 1fr); column-gap: clamp(28px, 3.5vw, 48px); align-items: start; }
  .p-wrap.wide .pi-left { position: sticky; top: 16px; }
  .p-wrap.wide .pi-top { order: 2; justify-content: center; }
  .p-wrap.wide .pi-dots { margin-left: 0; }
  .p-wrap.wide .pi-photo { height: auto; aspect-ratio: 1 / 1; max-height: 70vh; border-radius: 24px; }
  .p-wrap.wide .pi-photo .sticker { font-size: 22px; left: 16px; top: 18px; }
  .p-wrap.wide .pi-q { font-size: 22px; gap: 14px; padding: 15px 18px 16px 14px; }
  .p-wrap.wide .pi-q .qb { width: 36px; height: 36px; font-size: 25px; }
  .p-wrap.wide .pi-pl { font-size: 13px; }
  .p-wrap.wide .pi-price { height: 84px; }
  .p-wrap.wide .pi-myst .cur { font-size: 40px; }
  .p-wrap.wide .pi-myst .q { font-size: 76px; }
  .p-wrap.wide .pi-deal { font-size: 16px; }
  .p-wrap.wide .p-scene .chatw .msg, .p-wrap.wide .p-scene .qaw .q, .p-wrap.wide .p-scene .qaw p { font-size: 17px; }
  .p-wrap.wide .vs .t .v { font-size: 30px; }
}

/* ---------- standings: your place, then the board ---------- */
.p-mine-rank { text-align: center; }
.p-mine-rank .mv2 { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 14px; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--muted); }
.p-mine-rank .mv2.up { background: rgba(143,240,192,.14); color: #e6fff2; }
.p-mine-rank .mv2.down { background: rgba(255,160,149,.14); color: #ffd3cf; }
.p-board { padding: 16px 12px 10px; }
.p-board .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 4px 8px; }
.p-board h2 { margin: 0; font-family: var(--show); font-weight: 400; font-size: 26px; line-height: 1; color: var(--ink); }
.p-board.enc h2 { color: var(--encore); text-shadow: 0 0 16px rgba(143,240,192,.3); }
.p-board .hd span { font-size: 13px; color: var(--muted); white-space: nowrap; }
.br { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; padding: 7px 8px; border-radius: 12px; animation: rowIn .5s cubic-bezier(.2,1.2,.4,1) both; }
.br .rk { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-family: var(--show); font-size: 17px; padding-top: 3px; color: var(--ink); background: var(--bg-4); }
.br.r1 .rk { background: var(--lit); color: var(--paper-ink); box-shadow: 0 0 12px rgba(255,190,70,.5); }
.br.r2 .rk { background: #e2eee4; color: #0f3327; }
.br.r3 .rk { background: #e3b07a; color: var(--paper-ink); }
.br .nm { min-width: 0; }
.br .nm b { display: block; font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.br .nm small { display: flex; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 1px; }
.br .nm small .up { color: var(--encore); font-weight: 700; }
.br .nm small .down { color: #ffd3cf; font-weight: 700; }
.br .tot { font-family: var(--show); font-size: 21px; color: var(--lit); padding-top: 3px; text-align: right; }
.br.me { background: rgba(255,201,60,.13); box-shadow: inset 0 0 0 2px rgba(255,190,70,.6); }
.br-gap { text-align: center; color: var(--faint); letter-spacing: .4em; font-size: 13px; line-height: 1; padding: 2px 0 4px; }

/* ---------- final results: the podium, in step with the big screen ---------- */
.p-fin { display: flex; flex-direction: column; gap: 14px; }
.pf-title { text-align: center; padding-top: 2px; }
.pf-title h2 { margin: 6px 0 0; font-family: var(--show); font-weight: 400; font-size: 38px; line-height: 1; color: var(--lit); text-shadow: 0 4px 0 #8a5606, 0 0 26px rgba(255,190,70,.3); animation: titleDrop .8s cubic-bezier(.2,1.4,.4,1) both; }
.p-fin.enc .pf-title h2 { color: var(--encore); text-shadow: 0 4px 0 var(--encore-deep), 0 0 26px rgba(143,240,192,.35); }
.pf-stage { position: relative; padding: 18px 8px 0; border-radius: 22px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.16), transparent 60%), linear-gradient(180deg, rgba(14,53,40,.2), rgba(14,53,40,.65)); border: 1px solid var(--line); }
.pf-q { position: absolute; left: 0; right: 0; top: 14px; z-index: 3; text-align: center; font-family: var(--festive); font-size: 30px; line-height: 1.05; color: var(--accent-hi); text-shadow: 0 0 18px rgba(255,190,70,.65); opacity: 0; transform: scale(.9); transition: opacity .5s, transform 1.2s; pointer-events: none; }
.p-fin.hush .pf-q { opacity: 1; transform: none; }
.p-fin.crowned .pf-q { opacity: 0; transition: opacity .2s; }
.pf-dim { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .8s; background: radial-gradient(60% 75% at 50% 78%, rgba(6,32,26,0), rgba(6,32,26,.88)); }
.p-fin.hush .pf-dim { opacity: 1; }
.p-fin.crowned .pf-dim { opacity: .45; }
.pf-pod { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1.18fr 1fr; align-items: end; gap: 8px; height: 238px; }
.pf-pod::after { content: ""; position: absolute; left: -30px; right: -30px; bottom: -14px; height: 38px; border-radius: 50% 50% 0 0 / 100% 100% 0 0; background: linear-gradient(180deg, #e3efe9, #c9ddd3); box-shadow: 0 -2px 0 #ffffff; z-index: -1; }
.pfs { display: flex; flex-direction: column; align-items: center; min-width: 0; opacity: 0; transform: translateY(80px); transition: opacity .5s, transform .85s cubic-bezier(.2,1.35,.4,1); }
.pfs.on { opacity: 1; transform: none; }
.pfs.empty { visibility: hidden; }
.pfs .who { max-width: 100%; margin-bottom: 6px; font-family: var(--show); font-size: 15px; line-height: 1.05; text-align: center; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
.pfs.p1 .who { font-size: 19px; color: var(--lit); }
.p-fin.crowned .pfs.p1 { animation: champBounce .9s cubic-bezier(.2,1.5,.4,1); }
@keyframes champBounce { 0% { transform: translateY(120px); } 55% { transform: translateY(-18px); } 78% { transform: translateY(5px); } 100% { transform: none; } }
.p-fin.hush .pfs.p1:not(.on) { opacity: .0; }
.pf-you { text-align: center; opacity: 0; transform: translateY(16px); transition: opacity .55s, transform .65s cubic-bezier(.2,1.2,.4,1); }
.pf-you.on { opacity: 1; transform: none; }
.pf-you.champ { border-color: rgba(255,224,138,.8); box-shadow: 0 0 0 2px rgba(255,190,70,.6), 0 0 44px rgba(255,190,70,.3), 0 18px 40px rgba(0,0,0,.35); }
.pf-you .big { font-family: var(--festive); font-size: 46px; line-height: 1; color: var(--lit); text-shadow: 0 0 24px rgba(255,190,70,.55); margin: 4px 0 6px; }
.pf-you.champ .big { animation: champGlow 1.4s ease-in-out infinite alternate; }
@keyframes champGlow { from { text-shadow: 0 0 16px rgba(255,190,70,.45); } to { text-shadow: 0 0 34px rgba(255,190,70,.95), 0 0 60px rgba(255,190,70,.5); } }
.pf-rest { padding: 14px 12px 10px; }
.pf-rest h3 { margin: 0 4px 6px; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.pf-rest .br { opacity: 0; animation: none; transform: translateX(20px); transition: opacity .35s, transform .45s; }
.pf-rest .br.on { opacity: 1; transform: none; }

/* ---------- poll results ---------- */
.p-poll .prw { margin-top: 14px; opacity: 0; transform: translateY(10px); transition: opacity .45s, transform .45s; }
.p-poll .prw.on { opacity: 1; transform: none; }
.p-poll .lb { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 15px; color: var(--ink); }
.p-poll .lb span:first-child { min-width: 0; }
.p-poll .lb .tp { display: inline-block; margin-left: 6px; font-family: var(--show); font-weight: 400; font-size: 12px; color: var(--paper-ink); background: var(--lit); padding: 3px 7px 1px; border-radius: 6px; vertical-align: 2px; }
.p-poll .lb .yp { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #fff1c4; border: 1px solid rgba(255,201,60,.7); padding: 2px 6px; border-radius: 6px; vertical-align: 2px; }
.p-poll .lb .n { flex: none; font-family: var(--show); font-weight: 400; font-size: 20px; }
.p-poll .lb .n small { font-family: var(--ui); font-size: 13px; color: var(--muted); font-weight: 600; margin-left: 4px; }
.p-poll .trk { margin-top: 6px; height: 12px; border-radius: 6px; background: rgba(255,255,255,.06); overflow: hidden; }
.p-poll .trk i { display: block; height: 100%; border-radius: 6px; background: #4fae84; transform-origin: 0 50%; transform: scaleX(0); transition: transform 1.1s cubic-bezier(.2,.9,.3,1); }
.p-poll .prw.on .trk i { transform: scaleX(1); }
.p-poll .prw.top .trk i { background: var(--accent); }
.p-poll .nms { margin-top: 4px; font-size: 12px; color: var(--muted); }

/* ---------- the end ---------- */
.p-end { position: relative; overflow: hidden; text-align: center; padding: 26px 18px 24px; }
.p-end .logo .l-top { font-size: 30px; }
.p-end .logo .l-avoya { font-size: 16px; }
.p-end h2 { margin: 18px 0 6px; font-family: var(--show); font-weight: 400; font-size: 30px; line-height: 1.05; color: var(--ink); }
.p-end .champ { font-size: 16px; color: var(--ink-2); margin-top: 4px; }
.p-end .champ b { color: var(--lit); }
.p-end .champ.enc b { color: var(--encore); }
.p-end .mine2 { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }

/* the encore */

.p-card.sm { padding: 16px 18px; }
.p-card.sm .p-rank { font-size: 54px; margin: 4px 0 2px; }
.p-card.sm .p-rank small { font-size: 24px; }
.p-card.sm h2.p-h { font-size: 20px !important; margin-top: 10px !important; }

/* a floating "Make your guess" pill on phones, while the guess box is scrolled out of view */
.p-gopill { position: fixed; z-index: 56; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px 12px 16px;
  border: 0; border-radius: 999px; cursor: pointer; font: 800 15px/1 var(--ui); white-space: nowrap; color: var(--paper-ink); background: linear-gradient(180deg, var(--accent-hi), var(--accent));
  box-shadow: 0 4px 0 var(--accent-deep), 0 12px 30px rgba(0,0,0,.5), 0 0 26px rgba(255,190,70,.35); transform: translate(-50%, 140%); opacity: 0; pointer-events: none;
  transition: transform .35s cubic-bezier(.2,1.2,.4,1), opacity .25s; }
.p-gopill.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.p-gopill svg { width: 17px; height: 17px; }
/* ============================== HOST CONSOLE ============================== */
.h-wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 18px 22px 60px; }
.h-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 4px 0 18px; }
.h-brand { display: grid; grid-template-columns: auto auto auto; justify-content: start; align-items: center; column-gap: 8px; row-gap: 4px; margin-right: auto; white-space: nowrap; line-height: 1; }
.h-brand .l-avoya { grid-column: 1 / 3; grid-row: 2; font-size: 11px; letter-spacing: .28em; }
.h-brand .l-top { font-family: var(--show); font-size: 22px; padding-top: 3px; color: var(--lit); text-shadow: 0 2px 0 #8a5606; }
.h-brand .role { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-left: 6px; }
.h-room { display: flex; align-items: center; gap: 10px; }
.h-room .code { font-family: var(--show); font-size: 30px; color: var(--lit); letter-spacing: .1em; padding-top: 4px; line-height: 1; }
.h-room .lab { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.h-links { display: flex; gap: 8px; flex-wrap: wrap; }
.h-panel { padding: 20px 22px; }
.h-panel h3 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }

/* ---------- main area: the step card + players ---------- */
.h-main { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .h-main { grid-template-columns: minmax(0, 1fr); } }
.h-step { padding: 22px 26px 24px; }
.st-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.st-where { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.st-where .w { font-family: var(--show); font-size: 26px; line-height: 1; padding-top: 3px; color: var(--ink); }
.ph { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--line-2); color: var(--ink-2); }
.ph.go { background: rgba(143,240,192,.12); border-color: rgba(143,240,192,.45); color: #e6fff2; }
.ph.hot { background: rgba(255,160,149,.12); border-color: rgba(255,160,149,.5); color: #ffd3cf; }
.h-clock { font-family: var(--show); font-size: 22px; padding-top: 3px; color: var(--ink); }
.h-clock.hot { color: #ffd3cf; }
.st-dots { display: flex; gap: 6px; }
.st-dots i { width: 10px; height: 10px; border-radius: 5px; border: 2px solid var(--line-2); }
.st-dots i.done { background: var(--line-2); }
.st-dots i.now { width: 24px; background: var(--accent); border-color: var(--accent); }
.h-item { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 16px; align-items: center; }
.h-item .art { width: 84px; height: 84px; border-radius: 14px; box-shadow: 0 0 0 3px var(--accent), 0 8px 18px rgba(0,0,0,.4); }

.h-item .cnt { margin-top: 4px; font-size: 15px; color: var(--ink-2); }

.h-big { font-size: 18px; color: var(--ink-2); }
.h-big b { font-family: var(--show); font-weight: 400; font-size: 40px; color: var(--lit); margin-right: 4px; }
.h-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.h-actions .btn.big { font-size: 22px; padding: 20px 26px; }
.h-actions .sub { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.h-actions .sub .hint { margin-right: auto; font-size: 14px; color: var(--muted); }
.h-say { margin-top: 20px; padding: 16px 18px; border-radius: 14px; background: rgba(6,32,26,.35); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; font-size: 16px; color: var(--ink-2); }

.h-say .co2 { display: flex; gap: 10px; align-items: baseline; }
.h-say .co2 b { flex: none; min-width: 120px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.h-say .co2 span b { color: var(--ink); font-size: 15px; text-transform: none; letter-spacing: 0; min-width: 0; }
.h-lobbyline { font-size: 17px; color: var(--ink-2); }
.h-lobbyline b { color: var(--lit); }

/* players */
.h-side { padding: 18px 18px 14px; }
.h-side-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.h-side-top h3 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.h-side-top h3 b { color: var(--ink); margin-left: 4px; }
.h-side-top .faint { font-size: 13px; }
.pl-list { display: flex; flex-direction: column; gap: 2px; max-height: 470px; overflow: auto; }
.pl-r { display: grid; grid-template-columns: 10px minmax(0, 1fr) 22px 64px 30px; gap: 10px; align-items: center; padding: 7px 6px 7px 8px; border-radius: 10px; }
.pl-r:hover { background: rgba(255,255,255,.04); }
.pl-r .on { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.pl-r .on.y { background: var(--encore); box-shadow: 0 0 8px rgba(143,240,192,.6); }
.pl-r .n3 { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pl-r .g3.y { color: var(--encore); font-weight: 700; }

.pl-r .x { appearance: none; border: 0; background: none; color: var(--faint); cursor: pointer; font-size: 18px; line-height: 1; border-radius: 6px; padding: 4px; opacity: .25; transition: opacity .15s; }

.pl-r .x:hover { color: var(--alert); background: rgba(255,160,149,.1); }
.pl-r .x.arm { opacity: 1; color: #fff; background: var(--alert); font-size: 11px; font-weight: 700; white-space: nowrap; }
.pl-r:has(.x.arm) { grid-template-columns: 10px minmax(0, 1fr) 22px 64px 64px; }
.pl-empty { color: var(--muted); font-size: 15px; padding: 6px 2px; }

/* ---------- folded sections ---------- */
.h-folds { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
.h-fold { padding: 0; }
.h-fold > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 14px; padding: 16px 22px; border-radius: 20px; }
.h-fold > summary::-webkit-details-marker { display: none; }
.h-fold > summary::before { content: "▸"; color: var(--muted); font-size: 14px; transition: transform .2s; }
.h-fold[open] > summary::before { transform: rotate(90deg); }
.h-fold > summary .t { font-weight: 700; font-size: 16px; color: var(--ink); }
.h-fold > summary .d { font-size: 14px; color: var(--faint); }
.h-fold > summary:hover .t { color: var(--lit); }
.h-fold > summary:focus-visible { outline: 3px solid var(--lit); outline-offset: -3px; }
.h-fold > :not(summary) { margin: 0 22px 20px; }
.h-how { display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: var(--ink-2); }
.h-how p { margin: 0; }
.h-how kbd, .h-tip kbd { font: 700 11px var(--ui); color: var(--ink-2); background: var(--bg-4); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; }
.h-tip { font-size: 13px; color: var(--faint); }

/* run sheet */
.rs { display: flex; flex-direction: column; gap: 6px; }
.rs-row { border-radius: 12px; background: rgba(6,32,26,.35); border: 1px solid var(--line); }
.rs-row.now { border-color: var(--lit); box-shadow: 0 0 0 1px var(--lit) inset; }
.rs-row.done { opacity: .78; }
.rs-main { display: grid; grid-template-columns: 30px minmax(0, 1fr) 150px 82px; gap: 10px; align-items: center; padding: 8px 10px 8px 12px; }
.rs-n { font-family: var(--show); font-size: 18px; color: var(--muted); padding-top: 2px; }
.rs-name { min-width: 0; }
.rs-name .t2 { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.rs-name .m2 { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.flag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: 6px; background: rgba(255,224,138,.16); color: var(--lit); border: 1px solid rgba(255,224,138,.4); }
.flag.edited { background: rgba(255,255,255,.16); color: var(--ink-2); border-color: rgba(255,255,255,.45); }
.flag.dbl { background: rgba(143,240,192,.14); color: #e6fff2; border-color: rgba(143,240,192,.45); }
.pin { display: flex; align-items: center; background: rgba(6,32,26,.6); border: 1px solid var(--line-2); border-radius: 10px; padding: 0 8px; }
.pin:focus-within { border-color: var(--accent); }
.pin span { color: var(--lit); font-weight: 700; }
.pin input { width: 100%; min-width: 0; border: 0; outline: none; background: transparent; color: var(--ink); font: 700 15px var(--ui); padding: 8px 4px; font-variant-numeric: tabular-nums; }
.rs-st { display: flex; justify-content: flex-end; gap: 6px; }
.rs-st .btn { padding: 7px 10px; font-size: 13px; }
.rs-more { padding: 4px 12px 12px 52px; display: grid; gap: 10px; font-size: 13px; }
.rs-more label { display: grid; gap: 4px; color: var(--muted); font-weight: 600; }
.rs-more textarea, .rs-more input { width: 100%; font: 500 14px/1.35 var(--ui); color: var(--ink); background: rgba(6,32,26,.6); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; outline: none; resize: vertical; }
.rs-more textarea:focus, .rs-more input:focus { border-color: var(--accent); }
.rs-more .note { color: var(--lit); }
.rs-more .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rs-toggle { appearance: none; background: none; border: 0; color: var(--muted); cursor: pointer; font: 600 12px var(--ui); padding: 2px 0; text-decoration: underline; text-underline-offset: 2px; }

/* settings */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.set-row .sl { color: var(--ink-2); }
.set-row .sl small { display: block; color: var(--faint); font-size: 12px; margin-top: 2px; }
.seg { display: inline-flex; background: rgba(6,32,26,.6); border: 1px solid var(--line-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { appearance: none; border: 0; background: none; color: var(--ink-2); font: 700 13px var(--ui); padding: 6px 10px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--paper-ink); }
.sw { position: relative; flex: none; width: 46px; height: 26px; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw span { position: absolute; inset: 0; border-radius: 999px; background: var(--bg-4); border: 1px solid var(--line-2); transition: background .2s; }
.sw span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink-2); transition: transform .2s; }
.sw input:checked + span { background: var(--accent); border-color: var(--accent); }
.sw input:checked + span::after { transform: translateX(20px); background: #fff; }
.sw input:focus-visible + span { outline: 3px solid var(--lit); outline-offset: 2px; }
.danger-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 14px; }
.danger-row .faint { font-size: 13px; margin-right: 4px; }

/* start screen */
.h-start { max-width: 760px; margin: 4vh auto 0; display: flex; flex-direction: column; gap: 18px; }
.h-hero { text-align: center; padding: 34px 26px 30px; }
.h-hero .logo .l-top { font-size: 44px; }
.h-hero .logo .l-avoya { font-size: 23px; }
.h-hero p { color: var(--ink-2); font-size: 16px; margin: 14px auto 22px; max-width: 520px; }
.h-hero .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.h-mode { margin-top: 16px; font-size: 13px; color: var(--muted); }
.h-mode b { color: var(--lit); }

/* the encore */
.h-sub2 { margin-top: 4px; font-size: 15px; color: var(--muted); }
.pl-r.out { opacity: .55; }
.pl-r.out .s3 { font-family: var(--ui); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.ep-head { display: flex; flex-direction: column; gap: 4px; margin: 22px 0 10px; }
.ep-head h4 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ep-head .faint { font-size: 13px; }
.rs-main.ep-main { grid-template-columns: 20px 24px minmax(0, 1fr) 140px 58px 82px; }
/* host console on a phone: the name gets the room, the price box narrows, and the row's extras drop below */
@media (max-width: 560px) {
  .rs-main { grid-template-columns: 24px minmax(0, 1fr) 122px; }
  .rs-main .pin input { font-size: 14px; }
  .rs-main > .rs-st { grid-column: 2 / -1; justify-self: start; }
  .rs-main > .rs-st:empty { display: none; }
  .rs-main.ep-main { grid-template-columns: 20px 22px minmax(0, 1fr) 122px; }
  .rs-main.ep-main > .ep-mv { grid-column: 3; justify-self: start; }
