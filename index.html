}
.ep-on { display: grid; place-items: center; cursor: pointer; }
.ep-on input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.ep-on input:disabled { cursor: default; }
.ep-mv { display: flex; gap: 4px; }
.ep-mv button { appearance: none; display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border-radius: 7px; border: 1px solid var(--line-2); background: rgba(6,32,26,.5); color: var(--ink-2); font-size: 10px; cursor: pointer; }
.ep-mv button:hover:not(:disabled) { border-color: var(--accent); color: var(--lit); }
.ep-mv button:focus-visible { outline: 2px solid var(--lit); outline-offset: 1px; }
.ep-mv button:disabled { opacity: .28; cursor: default; }
.rs-row.ep.off .rs-name, .rs-row.ep.off .pin, .rs-row.ep.off .rs-n { opacity: .45; }
.rs-row.ep .rs-more { padding-left: 78px; }
#hpooltip { margin: 8px 0 0; }
.h-scr { font-size: 13px; padding: 5px 11px; }
/* ============================== ITEM SCENE: a Christmas shop stall ==============================
   Each item is a store listing. While people guess, the price reads "$???" and a deal box counts down;
   on the reveal the price line itself animates. One focus per moment: chrome stays quiet. */

/* ---------- store chrome: just the logo and the join code ---------- */
.shop-head { position: absolute; left: calc(0px - var(--px, 0px)); right: calc(0px - var(--px, 0px)); top: 0; height: 76px; padding: 0 calc(60px + var(--px, 0px)); display: flex; align-items: center; justify-content: space-between;
  background: rgba(6,32,26,.9); border-bottom: 1px solid var(--line); box-shadow: 0 10px 26px rgba(0,0,0,.22); }
.shop-join { display: flex; align-items: center; gap: 10px; padding: 7px 16px 7px 12px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line-2);
  font: 700 15px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.shop-join svg { width: 20px; height: 20px; color: var(--lit); }
.shop-join b { font-family: var(--show); font-weight: 400; font-size: 26px; letter-spacing: .12em; color: var(--lit); padding-top: 3px; text-transform: none; }

/* ---------- product photo + gallery dots (the dots double as game progress) ---------- */
.pdp-img { position: absolute; z-index: 0; left: 60px; top: 120px; width: 540px; height: 540px; border-radius: 26px; overflow: hidden;
  background: radial-gradient(circle at 50% 42%, #fffaf1, #f1e4cc 80%); box-shadow: 0 26px 60px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.5);
  animation: imgIn .7s cubic-bezier(.2,1,.3,1) both; }
@keyframes imgIn { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: none; } }
.pdp-img .art { position: absolute; inset: 0; border-radius: 0; background: transparent; box-shadow: none; }
.pdp-img .art > img { padding: 8%; }
.pdp-img .sticker { position: absolute; left: 18px; top: 22px; z-index: 2; font-family: var(--show); font-size: 24px; letter-spacing: .04em; color: #0a3524;
  padding: 10px 16px 6px; border-radius: 12px; background: linear-gradient(180deg, #c9fbe0, var(--encore)); box-shadow: 0 4px 0 var(--encore-deep), 0 0 26px rgba(143,240,192,.5);
  transform: rotate(-6deg); animation: stickerPulse 1.2s ease-in-out infinite alternate; }
@keyframes stickerPulse { from { transform: rotate(-6deg) scale(1); } to { transform: rotate(-6deg) scale(1.06); } }
.s-scene .pdp-dots { position: absolute; left: 60px; top: 680px; width: 540px; display: flex; justify-content: center; align-items: center; gap: 16px; }
.s-scene .pdp-dots .d-steps { gap: 10px; }
.enc-tag { font: 800 13px/1 var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--encore); padding: 6px 11px 5px; border-radius: 999px; border: 1px solid rgba(143,240,192,.45); background: rgba(143,240,192,.08); }
.s-scene .pdp-dots i { width: 12px; height: 12px; border-radius: 6px; border: 2px solid var(--line-2); transform: none; box-shadow: none; transition: all .3s; }
.s-scene .pdp-dots i.done { background: var(--line-2); }
.s-scene .pdp-dots i.dbl { border-color: var(--lit); }
.s-scene .pdp-dots i.now { width: 36px; background: var(--accent); border-color: var(--accent); box-shadow: 0 0 14px rgba(255,190,70,.55); }

/* ---------- title, byline, description ---------- */
.pdp-info { position: absolute; left: 660px; right: 60px; top: 106px; }
.sc-name { margin: 0; font-family: var(--show); font-weight: 400; font-size: 58px; line-height: 1.06; color: var(--ink); letter-spacing: .01em; text-shadow: 0 4px 0 rgba(0,0,0,.35); text-wrap: balance; }
.pdp-by { margin-top: 8px; font-size: 20px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* the question: big, bright and boxed, so the room reads it first */
.pdp-q { display: flex; align-items: flex-start; gap: 16px; margin: 14px 0 0; padding: 12px 22px 14px 14px; border-radius: 20px;
  background: linear-gradient(180deg, rgba(255,224,138,.14), rgba(255,224,138,.05)); border: 2px solid rgba(255,224,138,.55); box-shadow: 0 0 34px rgba(255,190,70,.1);
  font-size: 27px; line-height: 1.3; font-weight: 600; color: #fff; text-wrap: balance; }
.pdp-q .qb { width: 42px; height: 42px; font-size: 30px; padding-top: 6px; margin-top: -2px; box-shadow: 0 3px 0 #8a5606; }
/* a step or two tighter when the column would run long (see fitCol) */
.s-scene.snug .pdp-by { margin-top: 4px; }
.s-scene.snug .pdp-q { margin-top: 10px; padding: 9px 18px 11px 12px; font-size: 24px; }
.s-scene.snug .pdp-q .qb { width: 38px; height: 38px; font-size: 27px; padding-top: 5px; }
.s-scene.snug .pdp-buy { margin-top: 10px; }
.s-scene.snug .wdg { margin-top: 8px; }
.s-scene.snug2 .chatw .msg, .s-scene.snug2 .qaw .q, .s-scene.snug2 .qaw p { font-size: 16px; }

/* ---------- the buy box: price, deal timer, button (follows the description, like a store page) ---------- */
.pdp-buy { margin-top: 14px; }
.pdp-pl { display: flex; align-items: center; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 15px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.pdp-pl em { font-style: normal; color: #eadfc4; background: linear-gradient(180deg, #5a4c3e, #3a3027); border-radius: 6px; padding: 5px 12px 4px; box-shadow: 0 0 0 1.5px #140c12; }
.pdp-price { position: relative; height: 128px; margin-top: 6px; }
.pmyst { position: absolute; left: 0; top: 0; height: 128px; display: flex; align-items: flex-start; font-family: var(--show); color: var(--lit); line-height: 1;
  text-shadow: 0 0 24px rgba(255,190,70,.35); transform-origin: 0 50%; transition: opacity .3s, transform .45s, filter .45s; }
.pmyst .cur { font-size: 66px; padding: 10px 6px 0 0; }
.pmyst .q { font-size: 116px; padding-top: 8px; letter-spacing: .06em; animation: qflicker 5s infinite; }
@keyframes qflicker { 0%, 88%, 100% { opacity: 1; } 90% { opacity: .5; } 92% { opacity: 1; } 94% { opacity: .7; } }
.s-scene.revealing .pmyst { opacity: 0; transform: scale(1.06); filter: blur(10px); pointer-events: none; }

.pdp-low { position: relative; margin-top: 8px; height: 96px; }
/* quiet store-style status lines (think "In stock" and "Order within 2 hrs"): who has guessed, and the clock */
.deal { display: flex; align-items: center; height: 38px; font-size: 21px; color: var(--ink-2); white-space: nowrap; transition: opacity .35s, transform .35s; }
.deal > div { display: flex; align-items: center; gap: 10px; min-width: 0; }
.deal > div + div { margin-left: 24px; padding-left: 24px; border-left: 1px solid var(--line-2); }
.deal .ic { flex: none; width: 24px; height: 24px; color: var(--faint); }
.deal .ic svg { width: 100%; height: 100%; display: block; }
.deal .n, .deal .sec { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.deal .n:empty, .deal .sec:empty { display: none; }
.deal .bar { flex: none; width: 110px; height: 8px; margin-left: 4px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
.deal .bar i { display: block; height: 100%; border-radius: 4px; background: var(--you); transform-origin: 0 50%; transform: scaleX(0); transition: transform .4s cubic-bezier(.2,.9,.3,1); }
.sc-count.full .bar i { background: var(--encore); }
.sc-count.full .state { color: var(--encore); font-weight: 600; }
.sc-clock { color: var(--muted); }
.sc-clock.warn .sec, .sc-clock.hot .sec { color: var(--lit); }
/* the host's "big TIME'S UP moment" setting brings back the urgent look */
.s-scene.loud .sc-clock.hot .sec { display: inline-block; color: #ffd3cf; animation: beat 1s ease-in-out infinite; }
.s-scene.loud.ready .sc-clock { color: #ffd3cf; }
.cta { margin-top: 10px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font: 700 20px/1 var(--ui); color: var(--paper-ink);
  background: linear-gradient(180deg, var(--accent-hi), var(--accent)); box-shadow: 0 4px 0 var(--accent-deep), 0 12px 28px rgba(255,190,70,.25); transition: opacity .35s, transform .35s, background .3s, color .3s, box-shadow .3s; }
.cta span { display: inline-flex; align-items: center; gap: 12px; }
.cta svg { width: 24px; height: 24px; }
.cta .no { display: none; }
.s-scene.ready .cta { background: var(--bg-4); color: var(--muted); box-shadow: 0 4px 0 #06201a; }
.s-scene.ready .cta .go { display: none; }
.s-scene.ready .cta .no { display: inline-flex; }
.s-scene.revealing .deal, .s-scene.revealing .cta { opacity: 0; transform: translateY(10px); }

/* the seller's note that appears once the price lands */
.pnote { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 18px; align-items: flex-start; padding: 18px 24px 18px 20px; border-radius: 16px;
  border: 2px solid rgba(143,240,192,.5); background: rgba(143,240,192,.07); opacity: 0; transform: translateY(12px); transition: opacity .55s, transform .55s; pointer-events: none; }
.pnote .ic { flex: none; width: 42px; height: 42px; margin-top: 2px; }
.pnote .ic svg { width: 100%; height: 100%; display: block; }
.pnote .tx { min-width: 0; }
.pnote p { margin: 0; font-size: 24px; line-height: 1.32; color: var(--ink); font-weight: 600; text-wrap: balance; }
.pnote .src { margin-top: 8px; font-size: 15px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-scene.lined .pnote { opacity: 1; transform: none; }

/* ---------- the band under the fold: the top guesses, once the price lands ---------- */
.pdp-band { position: absolute; left: 60px; right: 60px; top: 722px; height: 150px; }
.pdp-band h4 { margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.sc-callbox { position: absolute; inset: 0; padding-top: 16px; border-top: 1px solid var(--line); opacity: 0; transition: opacity .5s; }
.s-scene.calls .sc-callbox { opacity: 1; }
.sc-calls { display: flex; gap: 18px; align-items: stretch; }
.rc { flex: 0 0 calc((100% - 36px) / 3); min-width: 0; display: flex; align-items: center; gap: 16px; padding: 14px 22px 14px 16px; border-radius: 18px; background: rgba(14,53,40,.86); border: 1px solid var(--line-2);
  opacity: 0; transform: translateY(40px); transition: opacity .8s ease, transform .9s cubic-bezier(.2,.9,.3,1); }
.rc.hero { border-color: rgba(143,240,192,.55); box-shadow: 0 0 34px rgba(143,240,192,.12); }
.rc.up { opacity: 1; transform: none; }
.rc .ic { flex: none; width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; }
.rc .ic svg { width: 28px; height: 28px; }
.rc.c-close .ic { background: rgba(143,240,192,.16); color: var(--encore); }
.rc.c-high .ic { background: rgba(255,224,138,.15); color: var(--lit); }
.rc.c-bull .ic { background: rgba(255,201,60,.18); color: var(--accent-hi); }
.rc.c-bull.hero { border-color: rgba(255,190,70,.6); }
.rc.c-beyond .ic { background: rgba(255,255,255,.18); color: var(--you); }
.rc .tx { min-width: 0; }
.rc .k { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc .who2 { font-family: var(--show); font-size: 26px; color: var(--ink); line-height: 1.05; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc .d { font-size: 16px; color: var(--ink-2); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-scene.snap, .s-scene.snap * { transition: none !important; }

/* ---------- the fact pop-up (while people guess, and until the reveal starts) ----------
   One box per item, under the button: a support chat on odd items, customer Q&A on even ones. */
.wdg { position: relative; z-index: 25; margin-top: 12px; opacity: 0; transform: translateY(26px); pointer-events: none; color: #0f3327; background: #fff6e3;
  border-radius: 18px; overflow: hidden; box-shadow: 0 18px 44px rgba(0,0,0,.5); transition: opacity .45s ease, transform .55s cubic-bezier(.2,.9,.3,1.15); }
.wdg.on { opacity: 1; transform: none; }
.s-scene.revealing .wdg { opacity: 0; transform: translateY(24px); transition: opacity .3s, transform .3s; }
.chatw .hd { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: #0f3327; color: #fffaf0; font: 700 16px/1 var(--ui); }
.chatw .av { width: 28px; height: 28px; border-radius: 50%; background: #fffaf0; color: #0f3327; display: grid; place-items: center; }
.chatw .av svg { width: 18px; height: 18px; }
.chatw .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--encore); margin-left: 4px; box-shadow: 0 0 6px rgba(143,240,192,.8); }
.chatw small { font-size: 13px; font-weight: 600; color: #ffe1dd; }
.chatw .bd { display: flex; flex-direction: column; align-items: flex-start; gap: 7px; padding: 10px 14px 12px; }
.chatw .typing { display: none; gap: 6px; padding: 12px 16px; border-radius: 4px 16px 16px 16px; background: #eaf2e4; }
.chatw .typing i { width: 8px; height: 8px; border-radius: 50%; background: #6f9a86; animation: typing 1s infinite; }
.chatw .typing i:nth-child(2) { animation-delay: .15s; } .chatw .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes typing { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
.chatw.on .t1, .chatw.w2 .t2 { display: inline-flex; }
.chatw.s1 .t1, .chatw.s2 .t2 { display: none; }
.chatw .msg { display: none; margin: 0; padding: 7px 14px 8px; border-radius: 4px 16px 16px 16px; background: #eaf2e4; font-size: 18px; line-height: 1.28; }
.chatw .msg b { color: #9c1420; }
.chatw.s1 .m1, .chatw.s2 .m2 { display: block; animation: pop .35s cubic-bezier(.2,1.5,.4,1) both; }
.qaw { padding: 11px 20px 12px; }
.qaw .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font: 800 13px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: #17683f; }
.qaw .hd svg { width: 18px; height: 18px; }
.qaw .qa { display: none; }
.qaw .qa + .qa { margin-top: 9px; padding-top: 9px; border-top: 1px solid #e6dcc6; }
.qaw.s1 .m1, .qaw.s2 .m2 { display: block; animation: pop .35s cubic-bezier(.2,1.5,.4,1) both; }
.qaw .q { font-weight: 700; font-size: 18px; line-height: 1.3; margin-bottom: 2px; }
.qaw p { margin: 0; font-size: 18px; line-height: 1.3; }

/* ============================== THE PRICE LINE ============================== */
.prow { position: absolute; left: 0; top: 0; height: 128px; display: flex; align-items: flex-start; gap: 4px; opacity: 0; pointer-events: none; transition: opacity .3s .05s; }
.s-scene.revealing .prow { opacity: 1; }
.prow.quake { animation: quake .42s ease-out; }
@keyframes quake { 0%, 100% { transform: none; } 20% { transform: translate(-3px, 4px); } 45% { transform: translate(3px, -2px); } 70% { transform: translate(-1px, 1px); } }
.psign { position: relative; z-index: 4; width: 46px; flex: none; text-align: center; font: 66px/1 var(--show); color: var(--lit); opacity: .28; padding-top: 10px; transition: opacity .4s, text-shadow .4s; }
.psign.lit { opacity: 1; text-shadow: 0 0 14px rgba(255,190,70,.9), 0 0 34px rgba(255,150,30,.5); }
.pdg { position: relative; z-index: 2; width: 74px; height: 124px; flex: none; }
.pdg.sm { width: 44px; height: 70px; }
.pdg.pop { animation: thud .3s ease-out; }
@keyframes thud { 0% { transform: none; } 35% { transform: translateY(5px); } 70% { transform: translateY(-1px); } 100% { transform: none; } }
.pcents { display: flex; gap: 4px; margin-left: 4px; }
.pwin { position: absolute; inset: 0; z-index: 1; isolation: isolate; border-radius: 12px; overflow: hidden; background: #051712; box-shadow: inset 0 0 0 2px #2f7d60, 0 8px 18px rgba(0,0,0,.35);
  opacity: 0; transform: scale(.8); transition: opacity .3s, transform .45s cubic-bezier(.2,1.4,.4,1), background .35s, box-shadow .35s; }
.pdg.sm .pwin { border-radius: 9px; }
.pdg.open .pwin { opacity: 1; transform: none; }
.pdg.locked .pwin { background: transparent; box-shadow: none; }
.pdg.dead .pwin { background: #051712; box-shadow: inset 0 0 0 2px #123b2e; }
.pwin::before { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.6)); transition: opacity .3s; }
.pdg.locked .pwin::before { opacity: 0; }
.pwin .strip { position: absolute; left: 0; right: 0; top: 0; display: none; }
.pdg.creep .strip { display: block; }
.pan { height: 124px; display: grid; place-items: center; font: 104px/1 var(--show); padding-top: 12px; }
.pdg.sm .pan { height: 70px; font-size: 58px; padding-top: 8px; }
.pan.k0, .pan.k2, .pan.k6, .pan.k8 { background: #0d3226; color: #6fa58c; }
.pan.k1, .pan.k3, .pan.k5, .pan.k9 { background: #fff6e3; color: #0f3327; }
.pan.k4 { background: #c8202c; color: #ffffff; }
.pan.k7 { background: #1d7a4b; color: #ffffff; }
.pwin .blur { position: absolute; left: 0; right: 0; top: -440px; height: calc(100% + 440px); opacity: 0; filter: blur(3px); will-change: transform;
  background: repeating-linear-gradient(180deg, #0d3226 0 44px, #fff6e3 44px 88px, #0d3226 88px 132px, #fff6e3 132px 176px, #c8202c 176px 220px, #fff6e3 220px 264px, #0d3226 264px 308px, #1d7a4b 308px 352px, #0d3226 352px 396px, #fff6e3 396px 440px);
  background-size: 100% 440px; }
.pdg.spin .blur { opacity: 1; animation: drumSpin .2s linear infinite; }
@keyframes drumSpin { from { transform: translateY(0); } to { transform: translateY(440px); } }
.pwin .lit { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; padding-top: 12px; font: 112px/1 var(--show); color: var(--lit); opacity: 0;
  text-shadow: 0 0 14px rgba(255,190,70,.75), 0 0 34px rgba(255,150,30,.45); }
.pdg.sm .lit { font-size: 62px; padding-top: 8px; }
.pdg.locked .lit { opacity: 1; animation: lockHit .3s cubic-bezier(.2,1.7,.4,1); }
@keyframes lockHit { from { transform: translateY(-26px); } to { transform: none; } }
.pwin .flash { position: absolute; inset: 0; z-index: 4; background: #fff1c4; opacity: 0; pointer-events: none; }
.pdg.locked .flash { animation: lockFlash .32s ease-out; }
@keyframes lockFlash { from { opacity: .75; } to { opacity: 0; } }
.prow.flare .pdg.used .lit { animation: litFlare 1.3s ease-out; }
@keyframes litFlare { 0% { filter: brightness(1); } 22% { filter: brightness(1.9); scale: 1.1; } 100% { filter: brightness(1); scale: 1; } }
.pcomma { position: relative; z-index: 3; flex: none; width: 24px; text-align: center; font: 112px/1 var(--show); color: #2f5f4c; padding-top: 12px; transition: color .25s, text-shadow .25s; }
.pcomma.lit { color: var(--lit); text-shadow: 0 0 14px rgba(255,190,70,.8); }
.prow.flare .psign.lit, .prow.flare .pcomma.lit { animation: glyphFlare 1.3s ease-out; }
@keyframes glyphFlare { 22% { filter: brightness(1.8) drop-shadow(0 0 16px #ffd27a); scale: 1.12; } }
/* after the slam: the empty drums drop away and the row closes up around the price */
.prow > .pdg, .prow > .pcomma { transition: opacity .26s ease-in, transform .34s cubic-bezier(.5,0,.9,.5), margin-right .46s cubic-bezier(.55,0,.2,1) .06s, color .25s, text-shadow .25s; }
.prow > .pdg.gone { opacity: 0; transform: translateY(70px) scale(.9); margin-right: -78px; pointer-events: none; }
.prow > .pcomma.gone { opacity: 0; transform: translateY(40px); margin-right: -28px; }
.prow.instant, .prow.instant * { transition: none !important; }

/* Santa's mitten, the cursor that taps each digit */
.phand { position: absolute; left: 0; top: 0; width: 76px; height: 112px; z-index: 6; pointer-events: none; opacity: 0;
  transition: transform .22s cubic-bezier(.3,.7,.3,1), opacity .3s; filter: drop-shadow(0 8px 10px rgba(0,0,0,.55)); }
.phand.on { opacity: 1; }
.phand.sweep { transition: transform .32s cubic-bezier(.5,0,.6,1), opacity .35s; }
.phand .hov, .phand .tapper, .phand svg { width: 100%; height: 100%; display: block; }
.phand.hover .hov { animation: hoverBob .45s ease-in-out infinite alternate; }
@keyframes hoverBob { from { transform: translateY(8px); } to { transform: translateY(-2px); } }
.phand .tapper.tap { animation: poke .2s ease-out; }
@keyframes poke { 45% { transform: translateY(-14px); } }

/* flare effects */
.puff { position: absolute; z-index: 3; width: 190px; height: 130px; margin: -65px 0 0 -95px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255,255,255,.55), rgba(255,255,255,.24) 50%, rgba(255,255,255,0) 78%); }
.burst { position: absolute; z-index: 0; border-radius: 50%; pointer-events: none; background: radial-gradient(closest-side, rgba(255,190,70,.62), rgba(255,190,70,.26) 46%, rgba(255,150,30,0) 74%); }
/* passing effects made by PriceRow (puffs of snow, the flare's glow and the burst), cleared on stop */
.fx { position: absolute; pointer-events: none; }
/* the leading drum's hold: it hangs on the number just before the real one, straining to move */
.pdg.hold .pwin { box-shadow: inset 0 0 0 2px var(--lit), 0 0 22px rgba(255,190,70,.25), 0 8px 18px rgba(0,0,0,.35); }
/* ============================== MOVIE QUESTIONS (stage 1) ==============================
   The clue cards and the four answer tiles are final: their rules are lifted as written from the round 2 design
   (Design/src/bright-phone.css). They are drawn in the round 2 palette and faces, which stage 2 moves to :root for the
   whole game. Until then the new tokens that October's file has no name for sit at :root (nothing else reads them),
   and the ones that share a name with October's (--ink, --muted, --line-2, --show...) are set only on the final pieces. */
/* ============================== MOVIE QUESTIONS: the five clue cards ==============================
   Each card is drawn by the game from data. The bay behind it is the stall's display board. */
.clue-bay { background: radial-gradient(circle at 50% 40%, #7a1420, #4a0c14 85%) !important; display: grid; place-items: center; }
.clue { position: relative; color: var(--paper-ink); font-family: var(--ui); }
/* one set of cards, three sizes: the big screen draws them at 1.15, a phone at .78, a narrow phone at .62 */
.pdp-img.clue-bay .clue-fit { zoom: 1.15; }
.pi-photo.clue-bay { height: auto; min-height: 190px; padding: 34px 8px 18px; }
.pi-photo.clue-bay .clue-fit { zoom: .78; }
/* 1. receipt */
.clue.receipt { width: 330px; padding: 22px 24px 34px; background: #fffdf6; transform: rotate(-2deg); box-shadow: 0 16px 30px rgba(0, 0, 0, .45);
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 18px 100%; mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 18px 100%; }
.receipt .store { font: 400 26px/1.05 var(--show); text-align: center; letter-spacing: .04em; text-transform: uppercase; }
.receipt .meta { margin-top: 4px; text-align: center; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #4d6a5c; }
.receipt ul { list-style: none; margin: 14px 0 0; padding: 12px 0 0; border-top: 2px dashed #cfc6ad; display: grid; gap: 9px; }
.receipt li { display: flex; align-items: baseline; gap: 8px; font-size: 21px; font-weight: 600; line-height: 1.15; }
.receipt li i { flex: 1; min-width: 12px; border-bottom: 2px dotted #cfc6ad; transform: translateY(-4px); }
.receipt li b { font-weight: 700; font-variant-numeric: tabular-nums; color: #4d6a5c; }
.receipt .tot { margin-top: 12px; padding-top: 10px; border-top: 2px dashed #cfc6ad; display: flex; justify-content: space-between; font-size: 15px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.receipt .foot { margin-top: 10px; text-align: center; font-size: 15px; font-weight: 500; color: #4d6a5c; }
/* 2. gift tag */
.clue.tag { width: 400px; padding: 26px 30px 26px 78px; background: #fff6e3; border-radius: 16px; transform: rotate(2deg); box-shadow: inset 0 0 0 5px var(--trim), inset 0 0 0 8px #fff6e3, inset 0 0 0 10px #17683f;
  clip-path: polygon(46px 0, 100% 0, 100% 100%, 46px 100%, 0 calc(100% - 52px), 0 52px); }
.tag-outer { position: relative; filter: drop-shadow(0 16px 20px rgba(0, 0, 0, .45)); }
.tag-outer .twine { position: absolute; left: -58px; top: 50%; width: 110px; height: 70px; margin-top: -58px; z-index: 2; pointer-events: none; }
.clue.tag::before { content: ""; position: absolute; left: 26px; top: 50%; width: 22px; height: 22px; margin-top: -11px; border-radius: 50%; background: #4a0c14; box-shadow: 0 0 0 5px #ffc93c; }
.tag .trow { display: grid; grid-template-columns: 76px minmax(0, 1fr); align-items: baseline; padding: 7px 0 8px; border-bottom: 2px dashed #d9c9a3; }
.tag .trow:last-child { border-bottom: 0; }
.tag .trow span { font-size: 14px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #a8141f; }
.tag .trow b { font: 400 30px/1.1 var(--show); letter-spacing: .01em; overflow-wrap: anywhere; }
/* 3. one-star review */
.clue.review { width: 420px; padding: 20px 24px 20px; background: var(--paper); border-radius: 16px; box-shadow: 0 16px 30px rgba(0, 0, 0, .45); transform: rotate(-1deg); }
.review .rstars { display: flex; align-items: center; gap: 4px; color: var(--trim); }
.review .rstars svg { width: 28px; height: 28px; }
.review .rstars .off { color: #cfc6ad; }
.review .rstars span { margin-left: 8px; font-size: 14px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #4d6a5c; }
.review h5 { margin: 10px 0 6px; font: 700 24px/1.2 var(--ui); }
.review p { margin: 0; font-size: 22px; line-height: 1.34; font-weight: 500; }
.review .by { margin-top: 12px; padding-top: 10px; border-top: 1px solid #e6dcc6; font-size: 14px; font-weight: 600; color: #4d6a5c; }
/* 4. postcard */
.clue.postcard { width: 420px; padding: 12px 12px 10px; background: #fffdf6; border-radius: 6px; box-shadow: 0 16px 30px rgba(0, 0, 0, .45); transform: rotate(1.5deg); }
.postcard .pph { position: relative; aspect-ratio: 3 / 2; overflow: hidden; border-radius: 2px; background: #cfdccf; }
.postcard .pph > svg, .postcard .pph > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.postcard .cap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 4px 2px; }
.postcard .cap b { font: 400 26px/1.05 var(--show); letter-spacing: .02em; }
.postcard .cap small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #4d6a5c; margin-bottom: 2px; }
.postcard .pstamp { flex: none; width: 46px; height: 54px; display: grid; place-items: center; color: #fff; background: var(--trim); border-radius: 3px; outline: 3px dotted #fffdf6; outline-offset: -2px; box-shadow: 0 0 0 1px #cfc6ad; }
.postcard .pstamp svg { width: 26px; height: 26px; }
.clue-credit { margin-top: 10px; font-size: 12px; color: var(--muted); text-align: center; }
/* 5. pictogram window */
.clue.icons { padding: 14px 14px 22px; background: #17683f; border-radius: 14px 14px 6px 6px; box-shadow: 0 16px 30px rgba(0, 0, 0, .45), inset 0 0 0 3px #2fa866, 0 0 0 3px #062017; display: grid; grid-auto-flow: column; grid-auto-columns: 124px; gap: 10px; }
.icons .pane { position: relative; aspect-ratio: 1 / 1.12; display: grid; place-items: center; border-radius: 8px; overflow: hidden; --pane: #e1f0e8; background: var(--pane); color: var(--paper-ink); }
.icons .pane svg { width: 74%; height: auto; position: relative; z-index: 1; }
.icons .pane::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: radial-gradient(60% 50% at 0 0, rgba(255, 255, 255, .95), rgba(255, 255, 255, 0) 70%), radial-gradient(55% 45% at 100% 100%, rgba(255, 255, 255, .9), rgba(255, 255, 255, 0) 70%), radial-gradient(40% 30% at 100% 0, rgba(255, 255, 255, .6), rgba(255, 255, 255, 0) 70%); }
.clue.icons::after { content: ""; position: absolute; left: -10px; right: -10px; bottom: -8px; height: 22px; border-radius: 12px 12px 6px 6px; background: #ffffff; box-shadow: inset 0 -5px 0 #dcebe4; }

/* ---------- the four answers ----------
   Every state has a shape or a word as well as a color: a thicker outline and a "Your pick" chip, a lit fill with a
   tick and "Right answer", a dashed outline with a cross. On the reveal the right answer steps out and the wrong ones step in. */
.answers { display: grid; gap: 9px; }
.ans { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; column-gap: 12px; row-gap: 6px; width: 100%; min-height: 58px; padding: 9px 12px 9px 10px; text-align: left; appearance: none; cursor: pointer;
  font: 600 18px/1.2 var(--ui); color: var(--ink); background: var(--bg-3); border: 2px solid var(--edge); border-radius: 14px; }
.ans .k { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 400 19px/1 var(--show); color: var(--ink); box-shadow: inset 0 0 0 2px var(--edge); }
.ans .t { min-width: 0; overflow-wrap: anywhere; }
.ans .st { display: none; align-items: center; gap: 6px; font: 800 11px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
.ans .st svg { width: 18px; height: 18px; }
.ans .split { display: none; grid-column: 2 / -1; align-items: center; gap: 10px; font: 700 13px/1 var(--ui); font-variant-numeric: tabular-nums; }
.ans .split .bar { flex: 1; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.ans .split .bar i { display: block; height: 100%; border-radius: 4px; background: var(--muted); }
.ans .me { grid-column: 2 / -1; justify-self: start; display: inline-flex; align-items: center; gap: 5px; font: 800 11px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; padding: 4px 7px 3px; border-radius: 6px; color: var(--paper-ink); background: var(--you); }
.ans .me svg { width: 13px; height: 13px; }
/* picked: your pick while the clock runs */
.ans.picked { border: 3px solid var(--you); padding: 8px 11px 8px 9px; background: rgba(255, 255, 255, .16); }
.ans.picked .k { background: var(--you); color: var(--paper-ink); box-shadow: none; }
.ans.picked .st, .ans.mine .st { display: inline-flex; color: var(--you-soft); }
/* time's up: nothing more to tap */
.answers.locked .ans { cursor: default; }
.answers.locked .ans:not(.picked) { color: var(--muted); border-color: var(--line-2); }
.answers.locked .ans:not(.picked) .k { color: var(--muted); box-shadow: inset 0 0 0 2px var(--line-2); }
/* the reveal */
.answers.revealed .ans { cursor: default; }
.answers.revealed .ans .split { display: flex; }
.ans.right { margin: 0 -6px; width: calc(100% + 12px); color: var(--paper-ink); background: linear-gradient(180deg, #fff1c4, #ffc85a); border: 3px solid #fff6d6; padding: 8px 11px 8px 9px; box-shadow: 0 0 30px 2px rgba(255, 190, 70, .5), 0 6px 0 #8a5606; }
.ans.right .k { background: var(--paper-ink); color: var(--lit); box-shadow: none; }
.ans.right .st { display: inline-flex; color: var(--paper-ink); }
.ans.right .split .bar { background: rgba(15, 51, 39, .2); }
.ans.right .split .bar i { background: var(--paper-ink); }
.ans.wrong { margin: 0 10px; width: calc(100% - 20px); color: var(--muted); background: var(--bg-2); border: 2px dashed var(--line-2); }
.ans.wrong .k { color: var(--muted); box-shadow: inset 0 0 0 2px var(--line-2); }
.ans.wrong .st { display: inline-flex; color: var(--muted); }
.ans.wrong.mine { border: 2px dashed var(--you); }
.ans.wrong.mine .st { color: var(--you-soft); }
.ans.right .me { background: var(--paper-ink); color: var(--you-soft); }
.ans.right.mine { outline: 3px solid var(--you); outline-offset: 3px; }
.p-answer { position: relative; padding: 26px 12px 12px; border-color: var(--line-2); background: linear-gradient(135deg, #164a39, #0c2f24); }
.p-answer .hint { margin: 10px 2px 0; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.p-answer .hint svg { width: 15px; height: 15px; color: var(--lit); flex: none; }
/* the big screen shows the same four, two by two, for the room to read */
.answers.big { grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
.answers.big .ans { min-height: 112px; font-size: 31px; padding: 14px 20px 14px 16px; grid-template-columns: 58px minmax(0, 1fr) auto; column-gap: 18px; border-radius: 18px; cursor: default; }
.answers.big .ans .k { width: 58px; height: 58px; font-size: 32px; }
.answers.big .ans .st { font-size: 13px; }
.answers.big .ans .st svg { width: 24px; height: 24px; }
.answers.big .ans .split { font-size: 17px; }
.answers.big .ans .split .bar { height: 12px; border-radius: 6px; }
.answers.big .ans.right { margin: 0 -8px; width: calc(100% + 16px); padding: 13px 19px 13px 15px; }
.answers.big .ans.wrong { margin: 0 12px; width: calc(100% - 24px); }
/* ---------- stage 1: fitting the cards and tiles into October's pages ---------- */
/* the card's size is one number (--z), so a tall card can be stepped down to fit its bay (see fitClue) */
.clue-fit { zoom: var(--z, 1); }
.pdp-img.clue-bay .clue-fit { --z: 1.15; }
.pi-photo.clue-bay .clue-fit { --z: .78; }
.pdp-img.clue-bay .clue-fit, .pi-photo.clue-bay .clue-fit { zoom: var(--z); }
.pi-photo.clue-bay { animation: imgIn .6s cubic-bezier(.2,1,.3,1) both; box-shadow: 0 16px 36px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,246,227,.85); }
.pdp-img.clue-bay { box-shadow: 0 26px 60px rgba(0,0,0,.5), inset 0 0 0 4px rgba(255,246,227,.9); }
.clue-bay .sticker { z-index: 3; }
/* four or five pictograms: two rows (2 + 2, or 3 + 2), so the panes stay big enough to read */
.clue.icons.n4, .clue.icons.n5 { display: flex; flex-wrap: wrap; justify-content: center; }
.clue.icons.n4 { width: 286px; }
.clue.icons.n5 { width: 420px; }
.clue.icons.n4 .pane, .clue.icons.n5 .pane { width: 124px; }
.pdp-img.clue-bay .clue-fit.icons4 { --z: 1.5; }
/* a postcard photo that has not loaded shows the drawn stand-in; the credit prints after the reveal, once the real photo is in */
.clue-credit[hidden] { display: none; }
/* tiles: the states ease from one to the next (the reveal's own timing is in MOVIE_PLAN) */
.ans { transition: margin .4s cubic-bezier(.2,.9,.3,1), width .4s cubic-bezier(.2,.9,.3,1), background-color .35s, color .35s, border-color .35s, box-shadow .4s; font-family: var(--ui); }
.ans .split .bar i { width: 0; transition: width 1.1s cubic-bezier(.2,.9,.3,1); }
.answers.snap .ans, .answers.snap .ans .split .bar i { transition: none; }
button.ans:focus-visible { outline: 3px solid var(--lit); outline-offset: 2px; }
.ans[disabled] { opacity: 1; }
/* movie questions are diamonds in every row of progress dots */
.pdp-dots i.mv, .pi-dots i.mv, .d-steps i.mv, .st-dots i.mv { border-radius: 2px; transform: rotate(45deg) scale(.86); }
.s-scene .pdp-dots i.now.mv { width: 14px; height: 14px; transform: rotate(45deg); }
.pi-dots i.now.mv, .p-scene.many .pi-dots i.now.mv { width: 10px; height: 10px; transform: rotate(45deg); }
.d-steps i.now.mv { transform: rotate(45deg) scale(1.15); }
.st-dots i.now.mv { width: 12px; height: 12px; transform: rotate(45deg); }
/* a narrow phone: the progress dots move under the "Movie question" line */
@media (max-width: 360px) { .p-scene.mv .pi-top { flex-wrap: wrap; row-gap: 7px; } .p-scene.mv .pi-dots { margin-left: 0; } }

/* ---------- the big screen: the clue where the photo sits, the question and the four answers beside it ---------- */
.s-scene.mv .pdp-info { top: 100px; }
.mv-kick { display: flex; align-items: center; gap: 14px; font: 400 50px/1 var(--show); color: var(--ink); letter-spacing: .01em; text-shadow: 0 4px 0 rgba(0,0,0,.35); padding-top: 6px; }
.mv-kick .icon { width: 42px; height: 42px; color: var(--lit); margin-top: -8px; }
.mv-kick small { font: 700 17px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-shadow: none; }
.mv-kick .enc-tag { margin-top: -4px; }
.s-scene.mv .pdp-q { margin-top: 16px; font-size: 32px; }
.s-scene.mv .answers.big { margin-top: 16px; }
.s-scene.mv .pdp-low { height: auto; margin-top: 16px; }
.s-scene.mv .cta { margin-top: 12px; }
.s-scene.mv.revealing .cta { display: none; }
.s-scene.mv.revealing .deal { opacity: 1; transform: none; }
.s-scene.mv .deal .sc-got { display: none; }
.s-scene.mv.lit .deal .sc-count, .s-scene.mv.lit .deal .sc-clock { display: none; }
.s-scene.mv.lit .deal .sc-got { display: flex; margin: 0; padding: 0; border: 0; }
.s-scene.mv .deal .sc-got .ic { color: var(--encore); }
.s-scene.mv .deal .sc-got .who { color: var(--ink); font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.s-scene.mv .pnote { position: relative; margin-top: 12px; display: none; }
.s-scene.mv.lined .pnote { display: flex; animation: mvUp .55s cubic-bezier(.2,.9,.3,1) both; }
@keyframes mvUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
/* a step or two tighter when the column would run long (long answers, a long question): see fitMovieCol */
.s-scene.mv.snug .mv-kick { font-size: 42px; }
.s-scene.mv.snug .pdp-q { margin-top: 12px; padding: 9px 18px 11px 12px; font-size: 27px; }
.s-scene.mv.snug .answers.big { margin-top: 12px; gap: 12px; }
.s-scene.mv.snug .answers.big .ans { min-height: 96px; font-size: 27px; padding-top: 10px; padding-bottom: 10px; }
.s-scene.mv.snug .pdp-low { margin-top: 12px; }
.s-scene.mv.snug .pnote p { font-size: 21px; }
.s-scene.mv.snug2 .answers.big .ans { min-height: 84px; font-size: 24px; grid-template-columns: 48px minmax(0, 1fr) auto; column-gap: 14px; }
.s-scene.mv.snug2 .answers.big .ans .k { width: 48px; height: 48px; font-size: 26px; }
.s-scene.mv.snug2 .pnote { padding: 12px 20px 12px 16px; }
.s-scene.mv.snug2 .pnote p { font-size: 19px; }

/* ---------- phones: the clue, the question, then the four answers to tap ---------- */
.p-scene.mv .pi-top .kick { display: inline-flex; align-items: center; gap: 7px; }
.p-scene.mv .pi-top .kick .icon { width: 16px; height: 16px; }
.p-scene.mv .pi-buy { padding-top: 10px; }
.p-scene.mv .pi-deal { margin-top: 0; }
.p-scene.mv.revealing .pi-deal { display: none; }
.p-answer { margin-top: 10px; overflow: hidden; }
.p-answer .gtime { left: 0; right: 0; top: 0; }
.p-answer .hint b { color: var(--ink); }
.p-answer .mv-lock { margin-top: 12px; }
.p-scene.hurry .p-answer { animation: hurry .9s ease-in-out infinite alternate; }
.pi-res.mv .verd { display: flex; align-items: center; justify-content: center; gap: 10px; font: 400 28px/1.05 var(--show); color: var(--ink); padding-top: 4px; }
.pi-res.mv .verd .icon { width: 34px; height: 34px; padding: 6px; border-radius: 50%; flex: none; margin-top: -6px; }
.pi-res.mv.ok .verd .icon { background: var(--lit); color: var(--paper-ink); }
.pi-res.mv.no .verd .icon { background: var(--bg-4); color: var(--muted); box-shadow: inset 0 0 0 2px var(--line-2); }
.pi-res.mv .was { margin-top: 8px; font-size: 15px; color: var(--ink-2); text-align: center; }
.pi-res.mv .was b { color: var(--lit); }
.pi-res.mv .pi-crowd { text-align: center; }
@media (min-width: 760px) {
  .p-wrap.wide .pi-photo.clue-bay { aspect-ratio: auto; min-height: 380px; max-height: none; }
  .p-wrap.wide .pi-photo.clue-bay .clue-fit { --z: 1; }
  .p-wrap.wide .ans { font-size: 19px; }
}
@media (max-width: 350px) {
  .pi-photo.clue-bay .clue-fit { --z: .66; }
  .pi-photo.clue-bay .clue-fit:has(.receipt) { --z: .72; }
  .pi-photo.clue-bay { min-height: 160px; padding: 30px 6px 16px; }
  .ans { font-size: 17px; column-gap: 10px; }
}
/* ---------- the host console ---------- */
.h-item .art.mv-thumb { display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #7a1420, #4a0c14 85%); color: #fff6e3; }
.h-item .art.mv-thumb svg { position: static; width: 44px; height: 44px; }
.h-say .mv-ch { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.h-say .mv-ch li { display: flex; gap: 8px; align-items: baseline; }
.h-say .mv-ch li b { flex: none; width: 1.2em; }
.h-say .mv-ch li.ok { font-weight: 700; }
.h-say .mv-ch li.ok::after { content: "right answer"; margin-left: 6px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--encore); }
.rs-ans { flex: none; max-width: 46%; font-size: 14px; font-weight: 600; color: var(--ink-2); text-align: right; overflow-wrap: anywhere; }
.rs-ans b { color: var(--lit); }
@media (prefers-reduced-motion: reduce) { .ans, .ans .split .bar i { transition: none; } .s-scene.mv.lined .pnote { animation: none; } }



/* the finale's title card: "Final question · Double points" slams in for a couple of seconds */
.fin-banner { position: absolute; inset: -400px; z-index: 30; display: grid; place-items: center; pointer-events: none;
  background: radial-gradient(48% 46% at 50% 50%, rgba(6,32,26,.35), rgba(6,32,26,.9)); animation: fbBack 2.7s ease both; }
@keyframes fbBack { 0% { opacity: 0; } 8% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
.fin-banner .fb { display: flex; flex-direction: column; align-items: center; animation: fbIn 2.7s cubic-bezier(.2,1.2,.3,1) both; }
@keyframes fbIn { 0% { opacity: 0; transform: scale(2.3) rotate(-4deg); } 13% { opacity: 1; transform: scale(1) rotate(-4deg); } 20% { transform: scale(1.05) rotate(-3deg); }
  80% { opacity: 1; transform: scale(1) rotate(-3deg); } 100% { opacity: 0; transform: scale(.92) rotate(-3deg); } }
.fin-banner .t1 { font-family: var(--festive); font-size: 160px; line-height: .9; color: var(--encore); text-align: center; white-space: nowrap;
  text-shadow: 0 0 34px rgba(143,240,192,.65), 0 7px 0 var(--encore-deep), 0 14px 30px rgba(0,0,0,.6); }
.fin-banner .t2 { margin-top: 22px; font-family: var(--show); font-size: 56px; color: var(--paper-ink); white-space: nowrap; background: linear-gradient(180deg, #ffe9a6, var(--lit));
  border-radius: 18px; padding: 14px 30px 7px; box-shadow: 0 6px 0 #8a5606, 0 0 44px rgba(255,190,70,.5); animation: t2Pulse .9s .5s ease-in-out infinite alternate; }
@keyframes t2Pulse { from { transform: scale(1); } to { transform: scale(1.06); } }
.p-fbanner { position: fixed; inset: 0; z-index: 80; }
.p-fbanner .t1 { font-size: 66px; }
.p-fbanner .t2 { font-size: 22px; margin-top: 14px; padding: 9px 16px 4px; border-radius: 12px; }

/* ============================== THE FINALE: a bigger podium reveal ==============================
   Everyone's lights count down, third and second rise from behind the snowbank, the lights go down for
   "And the champion is…", the spotlights sweep, the garland lights up, and the champion's present opens. */
.s-final .fn-title h2 { animation: titleDrop .9s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes titleDrop { from { opacity: 0; transform: translateY(-40px) scale(1.25); } to { opacity: 1; transform: none; } }
.s-final .fn-title p { animation: resIn .7s .5s both; }
.s-final .hushlay { position: absolute; inset: -600px; z-index: 6; pointer-events: none; opacity: 0; transition: opacity 1s ease;
  background: radial-gradient(250px 330px at calc(600px + var(--hx, 575px)) calc(600px + var(--hy, 640px)), rgba(6,32,26,0) 0%, rgba(6,32,26,.35) 55%, rgba(6,32,26,.92) 100%); }
.s-final.hush .hushlay { opacity: 1; }
.s-final.crowned .hushlay { opacity: 0; transition: opacity 2.6s ease .8s; }
.s-final .spot { position: absolute; z-index: 7; top: -160px; width: 300px; height: 1150px; margin-left: -150px; pointer-events: none; opacity: 0; transform-origin: 50% 0;
  background: linear-gradient(180deg, rgba(255,246,227,.42), rgba(255,246,227,.1) 70%, rgba(255,246,227,0)); clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%);
  filter: blur(5px); mix-blend-mode: screen; transition: opacity .6s; transform: rotate(var(--a0, 30deg)); }
.s-final.hush .spot { opacity: 1; animation: spotSweep 2.6s ease-in-out both; }
.s-final.crowned .spot { opacity: .6; animation: none; transform: rotate(var(--a1, 0deg)); transition: opacity 2.6s ease 1.2s; }
@keyframes spotSweep { 0% { transform: rotate(var(--a0, 30deg)); } 45% { transform: rotate(var(--am, -20deg)); } 100% { transform: rotate(var(--a1, 0deg)); } }
.s-final .champ-q { position: absolute; z-index: 8; left: 0; right: 0; top: 232px; text-align: center; pointer-events: none; font-family: var(--festive); font-size: 76px; line-height: 1;
  color: var(--accent-hi); text-shadow: 0 0 30px rgba(255,190,70,.7), 0 4px 0 #5c3806; opacity: 0; transform: scale(.88); transition: opacity .6s, transform 2s cubic-bezier(.2,.8,.3,1); }
.s-final.hush .champ-q { opacity: 1; transform: none; }
.s-final.crowned .champ-q { opacity: 0; transition: opacity .25s; }
.s-final .podium { z-index: 5; }
.s-final .fn-rest { z-index: 5; }
.s-final .pd.p1 { z-index: 2; }
.s-final .pd.p1.on { animation: champRise 1.1s cubic-bezier(.2,1.4,.4,1); }
@keyframes champRise { 0% { transform: translateY(180px); opacity: 0; } 50% { transform: translateY(-30px); opacity: 1; } 70% { transform: translateY(8px) rotate(-1deg); } 85% { transform: translateY(-3px) rotate(.6deg); } 100% { transform: none; } }
.s-final.crowned .pd.p1 .who3 { animation: nameGlow 1.4s ease-in-out infinite alternate; }
@keyframes nameGlow { from { filter: drop-shadow(0 0 8px rgba(255,190,70,.45)); } to { filter: drop-shadow(0 0 18px rgba(255,190,70,.95)) drop-shadow(0 0 32px rgba(255,190,70,.5)); } }
.s-final .pd.shake .stone { animation: stoneShake .12s linear infinite; }
@keyframes stoneShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px) rotate(-.4deg); } 75% { transform: translateX(2px) rotate(.4deg); } }
.s-final .fpuff { position: absolute; z-index: 1; width: 340px; height: 160px; margin: -80px 0 0 -170px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255,255,255,.5), rgba(255,255,255,.2) 55%, rgba(255,255,255,0) 80%); }
canvas.fireworks { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none; }
.s-final .fn-rest .r { transition: opacity .4s, transform .55s cubic-bezier(.2,1.3,.4,1); }

/* ============================== PLAY-ANYTIME (async) ==============================
   The phone screens of a play-anytime game (the item page, the reveal and the podium are the live game's), the host's
   play-anytime console, and the big screen's invite and results pages. */
/* the phone: 20 progress dots fit beside "Item 7 of 20" */
.p-scene.many .pi-dots { gap: 3px; }

  font: 600 14px/1.5 var(--ui); white-space: pre-wrap; overflow-wrap: anywhere; text-align: left; letter-spacing: .01em; }

.hr-list { display: flex; flex-direction: column; gap: 4px; }
.hr-row { appearance: none; border: 1px solid var(--line); background: rgba(6,32,26,.35); color: var(--ink); border-radius: 12px; padding: 8px 12px; cursor: pointer; display: grid; grid-template-columns: 70px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; text-align: left; font: 500 14px var(--ui); }

@media (max-width: 560px) { .hr-row { grid-template-columns: 60px minmax(0, 1fr) auto; } .hr-row .when { display: none; } .h-setup .set-row { flex-direction: column; align-items: flex-start; } .hs-close { justify-content: flex-start; } }

/* the host: a play-anytime game's console */
.h-async .h-room .lab { color: var(--encore); }
.ha-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.ha-share { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 22px; padding: 22px; align-items: start; }
.ha-qr { width: 220px; height: 220px; background: #fff; border-radius: 18px; padding: 12px; box-shadow: 0 0 0 5px var(--accent), 0 12px 26px rgba(0,0,0,.45); }
.ha-qr svg { width: 100%; height: 100%; display: block; }
.ha-sh { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.ha-sh .lab { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ha-url { font-size: 20px; font-weight: 700; color: var(--ink); overflow-wrap: anywhere; line-height: 1.25; }
.ha-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.ha-prev { margin: 4px 0 0; padding: 10px 12px; border-radius: 12px; background: rgba(6,32,26,.45); border: 1px dashed var(--line-2); color: var(--ink-2); font: 500 13px/1.45 var(--ui); white-space: pre-wrap; overflow-wrap: anywhere; }
@media (max-width: 640px) { .ha-share { grid-template-columns: minmax(0, 1fr); justify-items: center; } .ha-sh { width: 100%; } }
.ha-when { margin: -6px 0 0; font-size: 15px; color: var(--ink-2); }
.ha-when b { color: var(--lit); }
.ha-top3 { margin-top: 0; }
.ha-close .ha-prev { margin-top: 14px; }
.ha-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.ha-chips .chip { font-size: 13px; padding: 4px 10px; }
.ha-tools { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.ha-q { flex: 1; min-width: 120px; font: 500 14px var(--ui); color: var(--ink); background: rgba(6,32,26,.6); border: 1px solid var(--line-2); border-radius: 10px; padding: 7px 10px; outline: none; }
.ha-q:focus { border-color: var(--accent); }
.ha-list { max-height: 560px; }
.ha-r { display: grid; grid-template-columns: minmax(0, 1fr) 84px 64px 26px; gap: 10px; align-items: center; padding: 6px 4px 6px 8px; border-radius: 10px; font-size: 14px; }
.ha-nm { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.ha-nm .ha-sub { display: flex; min-width: 0; margin-top: 1px; }
.ha-sub .ha-t { min-width: 0; }
.ha-pm { display: none; }
.ha-r:hover { background: rgba(255,255,255,.04); }
.ha-r .n3 { font-weight: 600; font-size: 15px; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
.ha-p { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ha-bar { flex: 1; height: 7px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
.ha-bar i { display: block; height: 100%; border-radius: 4px; background: var(--you); }
.ha-of { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ha-done { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--encore); }
.ha-r .s3 { font-family: var(--show); font-size: 16px; text-align: right; color: var(--lit); padding-top: 2px; white-space: nowrap; }
.ha-r .s3 em { font-style: normal; font-family: var(--ui); font-size: 12px; font-weight: 800; color: var(--ink-2); margin-right: 6px; vertical-align: 1px; }
.ha-t { font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ha-new { color: var(--muted); }
.ha-r .x { appearance: none; border: 0; background: none; color: var(--faint); cursor: pointer; font-size: 18px; line-height: 1; border-radius: 6px; padding: 4px; opacity: .25; transition: opacity .15s; }
.ha-r:hover .x, .ha-r .x:focus-visible { opacity: 1; }
.ha-r .x:hover { color: var(--alert); background: rgba(255,160,149,.1); }
.ha-r .x.arm { opacity: 1; color: #fff; background: var(--alert); font-size: 11px; font-weight: 700; white-space: nowrap; }
.ha-r:has(.x.arm) { grid-template-columns: minmax(0, 1fr) 84px 64px 64px; }
.ha-list.final .ha-r { grid-template-columns: minmax(0, 1fr) 62px 104px 26px; }
.ha-list.final .ha-r:has(.x.arm) { grid-template-columns: minmax(0, 1fr) 62px 104px 64px; }
@media (max-width: 560px) {   /* a phone: the progress moves under the name, so the name gets the room */
  .ha-r { grid-template-columns: minmax(0, 1fr) 64px 26px; }
  .ha-r:has(.x.arm) { grid-template-columns: minmax(0, 1fr) 64px 64px; }
  .ha-list.final .ha-r { grid-template-columns: minmax(0, 1fr) 104px 26px; }
  .ha-list.final .ha-r:has(.x.arm) { grid-template-columns: minmax(0, 1fr) 104px 64px; }
  .ha-r .ha-p { display: none; }
  .ha-pm { display: inline; font-size: 11.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ha-pm.done { color: var(--encore); font-weight: 700; }
  .ha-pm + .ha-t:not(:empty)::before { content: '·'; margin: 0 5px; color: var(--faint); }
}
.ha-r.joined .n3 { color: var(--ink-2); }
.ha-share.closed #hainv, .ha-share.closed #hainv2, .ha-share.closed #haprev { display: none; }
.ha-share.closed #halab { color: var(--encore); }

/* the big screen: a play-anytime game's invite */
.s-ainvite .ai-sub { margin-top: 12px; font-size: 30px; font-weight: 600; color: var(--ink-2); }
.s-ainvite .joincard .codelab { margin-top: 22px; font-size: 20px; }
.s-ainvite .pb.done { border-color: rgba(143,240,192,.45); background: rgba(143,240,192,.08); }
/* (QA pass) */
@media (max-width: 560px) { .h-hero .btns .btn { flex: 1 1 100%; } }
.a-board .hd { flex-wrap: wrap; row-gap: 4px; }
.a-shut { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0; padding: 10px 12px; border-radius: 12px; background: rgba(255,224,138,.1); border: 1px solid rgba(255,224,138,.45); color: var(--lit); font-size: 14px; font-weight: 600; line-height: 1.35; text-align: center; }
.a-shut svg { width: 16px; height: 16px; flex: none; color: var(--lit); }
/* (round 2) the phone's sound switch: play-anytime phones play the effects, on unless muted */
.p-snd { position: fixed; z-index: 57; left: calc(12px + env(safe-area-inset-left)); bottom: calc(12px + env(safe-area-inset-bottom)); width: 40px; height: 40px; padding: 0; border-radius: 50%;
  display: grid; place-items: center; border: 1px solid var(--line-2); background: rgba(6,32,26,.8); color: var(--ink-2); cursor: pointer; -webkit-tap-highlight-color: transparent;
  box-shadow: 0 6px 16px rgba(0,0,0,.45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: transform .1s, color .15s; }
.p-snd svg { width: 19px; height: 19px; display: block; }
.p-snd.off { color: var(--faint); }
.p-snd:active { transform: scale(.93); }
@media (hover: hover) { .p-snd:hover { color: var(--ink); border-color: var(--you); } }
body.has-snd .p-wrap { padding-bottom: calc(66px + env(safe-area-inset-bottom)); }
/* the results: the standings so far (no close time), and you vs. the crowd */
.a-live { text-align: center; }
.a-live .btn { margin-top: 12px; }
.a-live .p-small { margin: 8px 0 0; }
.a-crowd { text-align: center; }
.a-crowd .a-h3 { margin: 8px 0 12px; }
.cc-svg { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
.cc-bg { fill: rgba(6,32,26,.5); stroke: var(--line); stroke-width: 1; }
.cc-st { fill: rgba(255,255,255,.035); }
.cc-mid { stroke: var(--lit); stroke-width: 2; stroke-dasharray: 5 4; opacity: .9; }
.cc-ln { stroke: rgba(255,255,255,.22); stroke-width: 2; }
.cc-ln.win { stroke: rgba(143,240,192,.7); }
.cc-cr { fill: var(--accent-hi); stroke: #0e3528; stroke-width: 1.2; }
.cc-me { fill: var(--you-soft); stroke: #0e3528; stroke-width: 1.5; }
.cc-n { font: 700 9px var(--ui); fill: var(--faint); text-anchor: middle; }
.cc-n.dbl { fill: var(--lit); }
.cc-lab { font: 800 8.5px var(--ui); fill: var(--faint); letter-spacing: .1em; }
.cc-hit { fill: transparent; cursor: pointer; }
.cc-sel { fill: rgba(255,255,255,.1); pointer-events: none; }
.cc-key { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.cc-key span { display: inline-flex; align-items: center; gap: 7px; }
.cc-key i { display: inline-block; flex: none; }
.cc-key .k-me { width: 10px; height: 10px; border-radius: 50%; background: var(--you-soft); }
.cc-key .k-cr { width: 8px; height: 8px; background: var(--accent-hi); transform: rotate(45deg); }
.cc-key .k-pr { width: 16px; border-top: 2px dashed var(--lit); }
.cc-cap { margin: 10px 0 0; min-height: 2.8em; line-height: 1.45; }
/* a movie question in the chart: a star on the line, filled when you got it, an outline when you didn't */
.cc-mv { fill: #184f3d; stroke: #e2eee4; stroke-width: 1.3; stroke-linejoin: round; }
.cc-mv.ok { fill: var(--lit); stroke: #0e3528; }
.cc-key .k-mv { width: 12px; height: 12px; background: var(--lit); clip-path: polygon(50% 0, 62% 36%, 100% 38%, 70% 60%, 80% 100%, 50% 76%, 20% 100%, 30% 60%, 0 38%, 38% 36%); }
.a-crowd .cc-mvl { margin: -6px 0 10px; }
.a-crowd .cc-mvl b { color: var(--ink); }
.a-recap .ar.mv .g, .a-recap .ar.mv .pr { font-family: var(--ui); }
.cc-cap b { color: var(--ink); }
.cc-cap .c-me { color: var(--you-soft); } .cc-cap .c-cr { color: var(--accent-hi); } .cc-cap .c-pr { color: var(--lit); }
/* ============================== SHOW POLISH ============================== */
:root { --show-ease: cubic-bezier(.16,1,.3,1); }

/* The invitation: a warm carnival marquee, with a little cast of characters. */
.role-landing .p-wrap { max-width: 620px; overflow: visible; }
.p-land { padding-top: clamp(38px, 8vh, 88px); }
.land-hero { position: relative; isolation: isolate; padding: 28px 20px 34px; border: 1px solid rgba(255,190,70,.3);
  border-radius: 140px 140px 32px 32px; background: radial-gradient(ellipse at 50% 10%, #0e3528, #0a2a20 70%);
  box-shadow: 0 30px 80px #03120d99, inset 0 0 55px #ffc93c0b; }
.land-hero::before { content: ''; position: absolute; inset: 8px; border: 2px dotted #ffd27a; border-radius: inherit;
  opacity: .75; pointer-events: none; }
.land-edition { margin: 6px 0 30px; color: #fff1c4; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .24em; }
.land-hero .logo { position: relative; z-index: 1; }
.land-hero .logo .l-top { font-size: clamp(32px, 7vw, 49px); }
.land-hero .logo .l-avoya { font-size: clamp(17px, 4vw, 23px); }
@keyframes castFloat { from { transform: translateY(3px) rotate(-7deg); } to { transform: translateY(-10px) rotate(4deg); } }
.land-tagline { font-family: var(--show); font-size: clamp(19px, 4.6vw, 26px); color: var(--lit); margin: 10px 0 0; }
.p-land .lede { margin: 22px auto; font-size: 16px; line-height: 1.6; max-width: 340px; }
.land-doors { position: relative; border-color: #7d0f18; background: linear-gradient(160deg, #123b2e, #0a2a20); }
.land-doors #ljoin { position: relative; overflow: hidden; }
.land-doors #ljoin::after { content: ''; position: absolute; inset: -50%; pointer-events: none;
  background: linear-gradient(110deg, transparent 42%, #fff7d657 50%, transparent 58%);
  transform: translateX(-100%); animation: ticketShine 6s 1.3s ease-in-out infinite; }
@keyframes ticketShine { 0%,65% { transform: translateX(-100%); } 90%,100% { transform: translateX(100%); } }
.land-note { display: flex; justify-content: center; gap: 8px; align-items: center; margin: 18px 0 0; color: var(--muted); font-size: 12px; }
.land-note svg { width: 15px; height: 15px; color: var(--accent-hi); }
.land-warn { margin-top: 20px; }
.role-landing .land-warn + .land-note { display: none; }

/* Motion is staged by Effects.enter; one entrance per screen, never on timer ticks. */
.fx-entered.enter, .fx-entered .pi-photo, .fx-entered .pdp-img { animation: none; }
.btn { transition: transform .18s var(--show-ease), box-shadow .18s, filter .2s; }
@media (hover: hover) and (pointer: fine) {
  .btn:not(:disabled):hover { filter: brightness(1.09); }   /* no lift: a button that moves on hover flickers under a resting mouse */
  .btn:not(:disabled):active { transform: translateY(2px); }
  .opt:not(:disabled):hover { border-color: var(--accent-hi); background: #ffc93c12; }
}
.opt { transition: border-color .2s, background .2s, box-shadow .2s; }
.opt.on { box-shadow: inset 3px 0 0 var(--accent); }
.opt.on .tick svg { animation: checkDraw .35s var(--show-ease) both; }
@keyframes checkDraw { from { opacity: 0; transform: scale(.5) rotate(-15deg); } to { opacity: 1; transform: none; } }
.p-hello { background: radial-gradient(ellipse at 50% 0, #134434aa, transparent 65%), linear-gradient(180deg, #0e3528, #0a2a20); }
.p-hello::before { animation: marq 3s ease-in-out infinite; border-width: 2px; }
.p-head { border-bottom: 1px solid #ffffff21; padding-bottom: 14px; }
.pi-photo { border: 1px solid #fff1c466; }
.pi-top .kick { color: #ffd27a; }
.p-guess { border-color: #2f7d60; background: linear-gradient(135deg, #134434, #0e3528); }
.p-guess:focus-within { box-shadow: 0 0 0 1px #ffe08a70, 0 14px 35px #0005; }
.gtime { height: 6px; }
.gtime i { background: linear-gradient(90deg, var(--accent), var(--lit)); box-shadow: 0 0 10px #ffd27a88; }
.gtime.warn i { background: var(--lit); }
.gtime.hot i { background: var(--alert); }
.pi-deal .clk.hot, .sc-clock.hot { border-radius: 8px; background: #ffa09518; }
.pi-deal .clk.hot { padding: 3px 7px; color: #ffd3cf; }
.p-locked { position: relative; background: linear-gradient(120deg, #244329, #1e2c29); border-color: #8ff0c088;
  box-shadow: 0 8px 24px #0003, inset 0 1px 0 #d9ffb922; animation: lockedIn .5s var(--show-ease) both; }
@keyframes lockedIn { 0% { opacity: 0; transform: translateY(8px) scale(.96); } 65% { transform: translateY(-2px) scale(1.01); } 100% { opacity: 1; transform: none; } }
.p-locked .lk svg { animation: checkDraw .45s .12s var(--show-ease) both; }

  background: conic-gradient(from -26deg at 50% 130%, transparent, #ffe08a10 12deg, transparent 26deg, #ffe08a18 40deg, transparent 58deg); }

}


/* ============================== THE CHRISTMAS SKIN (stage 2) ==============================
   Lifted from the round 2 design (Design/src/bright.css and bright-phone.css) and fitted to the game's own classes and
   states. It comes last, so where it names a piece October's rules also style, these win. */

/* ---------- the sky: evergreen night, stars, and falling snow (always behind content) ---------- */
body { background: var(--bg); }
.sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background:
    radial-gradient(1100px 620px at 88% -16%, rgba(213, 35, 47, .22), transparent 62%),
    radial-gradient(1000px 520px at 18% 112%, rgba(255, 201, 60, .14), transparent 64%),
    linear-gradient(180deg, #0f3d2e 0%, #0a2a20 58%, #06201a 100%); }
.stars { position: absolute; inset: -20px; opacity: .5;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='340' height='340'><g fill='white'><circle cx='22' cy='30' r='1.1'/><circle cx='84' cy='96' r='.8'/><circle cx='140' cy='24' r='1'/><circle cx='206' cy='78' r='1.3'/><circle cx='270' cy='40' r='.8'/><circle cx='318' cy='120' r='1'/><circle cx='52' cy='180' r='.9'/><circle cx='168' cy='210' r='1.1'/><circle cx='246' cy='176' r='.7'/><circle cx='300' cy='252' r='1.2'/><circle cx='110' cy='290' r='.8'/><circle cx='26' cy='310' r='1'/></g></svg>");
  animation: twinkle 8s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .25; } to { opacity: .55; } }
.snow { position: absolute; left: 0; right: 0; top: -600px; bottom: 0; background-repeat: repeat; will-change: transform; }
.snow.s1 { background-image: var(--snow-1); background-size: 300px 600px; opacity: .9; animation: snowfall 19s linear infinite; }
.snow.s2 { background-image: var(--snow-2); background-size: 300px 600px; opacity: .65; animation: snowfall 31s linear infinite; }
.snow.s3 { background-image: var(--snow-3); background-size: 300px 600px; opacity: .5; animation: snowfall 47s linear infinite; }
body:not(.role-display) .snow.s3 { display: none; }   /* phones and the console run two layers */
.no-snow .snow { display: none; }
@keyframes snowfall { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-300px, 600px, 0); } }

/* ---------- the lockup: "The Price Is" / the candy-cane word / "Avoya Marketing" ---------- */
.logo .l-top { font-family: var(--festive); font-weight: 700; color: var(--ink); letter-spacing: .01em; padding-top: 0;
  text-shadow: 0 3px 0 #b3151f, 0 6px 0 #6d0c14, 0 10px 22px rgba(0, 0, 0, .55); }
.l-bright { display: block; line-height: 0; }
.bright-word { display: block; height: 1em; width: auto; overflow: visible; }
.l-avoya { font-family: var(--show); font-weight: 400; color: var(--accent); text-shadow: 0 2px 0 #5c3806, 0 0 16px rgba(255, 201, 60, .3); }
.logo .l-avoya { margin-top: .5em; }
.logo .l-avoya::before, .d-mini .l-avoya::before, .p-mini .l-avoya::before, .h-brand .l-avoya::before { background: linear-gradient(90deg, rgba(255, 201, 60, 0), currentColor); }
.logo .l-avoya::after, .d-mini .l-avoya::after, .p-mini .l-avoya::after, .h-brand .l-avoya::after { background: linear-gradient(270deg, rgba(255, 201, 60, 0), currentColor); }
/* the small lockups: big-screen bar, phone header, host console */
.d-mini { column-gap: 12px; row-gap: 3px; }
.d-mini .l-top { font-family: var(--festive); font-weight: 700; font-size: 31px; padding-top: 0; color: var(--ink); text-shadow: 0 2px 0 #b3151f, 0 6px 14px rgba(0, 0, 0, .5); }
.d-mini .l-bright { font-size: 46px; }
.d-mini .l-avoya, .p-mini .l-avoya, .h-brand .l-avoya { text-shadow: 0 1px 0 #5c3806; }
.p-mini { column-gap: 7px; row-gap: 2px; }
.p-mini .l-top { font-family: var(--festive); font-weight: 700; font-size: 19px; padding-top: 0; color: var(--ink); text-shadow: 0 2px 0 #b3151f; }
.p-mini .l-bright { font-size: 30px; }
.h-brand .l-top { font-family: var(--festive); font-weight: 700; font-size: 24px; padding-top: 0; color: var(--ink); text-shadow: 0 2px 0 #b3151f; }
.h-brand .l-bright { font-size: 40px; }
/* the other lockups (join, landing, waiting, host, end): October's sizes, the word at 1.25 times October's */
.s-lobby .logo .l-bright { font-size: 250px; margin-top: 8px; }
.s-end .logo .l-bright { font-size: 175px; }
.s-end .end-wrap.both .logo .l-bright { font-size: 150px; }
.p-join .logo .l-bright { font-size: 96px; margin-top: 4px; }
.p-end .logo .l-bright { font-size: 80px; }
.h-hero .logo .l-bright { font-size: 125px; margin-top: 6px; }
.land-hero .logo .l-bright { font-size: clamp(84px, 22vw, 136px); margin-top: 6px; }
.d-wait .logo .l-bright { font-size: 120px; margin: 6px 0 4px; }
@media (max-width: 350px) {
  .p-mini .l-top { font-size: 17px; } .p-mini .l-bright { font-size: 26px; } .p-mini .l-avoya { font-size: 9px; }
}
/* headline lettering that is "switched on" ("And the champion is…", the final item's title card) */
.lit-text { font-family: var(--festive); font-weight: 700; color: var(--lit); text-shadow: 0 0 22px rgba(255, 190, 70, .55), 0 3px 0 #8a5606; }

/* ---------- buttons, panels, inputs ---------- */
.btn { color: var(--paper-ink); background: linear-gradient(180deg, var(--accent-hi), var(--accent)); box-shadow: 0 4px 0 var(--accent-deep), 0 10px 24px rgba(255, 201, 60, .2); }
.btn:active { box-shadow: 0 1px 0 var(--accent-deep); }
.btn.soft { color: var(--ink); background: rgba(255, 255, 255, .06); box-shadow: inset 0 0 0 2px var(--edge); }
.btn.soft:active { box-shadow: inset 0 0 0 2px var(--you); }
.btn.soft.small { box-shadow: inset 0 0 0 2px var(--edge); }
.btn.small { box-shadow: 0 3px 0 var(--accent-deep); }
.btn.mint { color: #0a3524; background: linear-gradient(180deg, #c9fbe0, var(--encore)); box-shadow: 0 4px 0 var(--encore-deep), 0 10px 24px rgba(143, 240, 192, .18); }
.btn.mint:active { box-shadow: 0 1px 0 var(--encore-deep); }
.btn.danger { color: #fff; background: linear-gradient(180deg, #d42a35, var(--trim)); box-shadow: 0 4px 0 var(--trim-deep), inset 0 0 0 2px rgba(255, 250, 240, .7); }
.btn:disabled { filter: saturate(.35) brightness(.7); }
.panel { background: linear-gradient(180deg, rgba(24, 79, 61, .96), rgba(14, 53, 40, .97)); border: 1px solid var(--line-2); }
.input { background: rgba(6, 32, 26, .55); border-color: var(--edge); }
.input:focus { border-color: var(--lit); box-shadow: 0 0 0 4px rgba(255, 224, 138, .2); }
.opt { background: rgba(6, 32, 26, .45); border-color: var(--edge); }
.opt.on { border-color: var(--lit); background: rgba(255, 224, 138, .12); box-shadow: inset 3px 0 0 var(--lit); }
.opt.on .tick { border-color: var(--lit); background: var(--lit); color: var(--paper-ink); }
@media (hover: hover) and (pointer: fine) { .opt:not(:disabled):hover { border-color: var(--lit); background: rgba(255, 224, 138, .08); } }
.demo-ribbon { background: var(--lit); color: var(--paper-ink); }
.sys-banner, .offline-pill { background: #3b1512; border-color: var(--alert); color: #ffd3cf; }
.art { background: var(--paper); box-shadow: 0 0 0 4px var(--ink), 0 24px 50px rgba(0, 0, 0, .5); }
.art.sm { box-shadow: 0 0 0 3px var(--ink), 0 10px 24px rgba(0, 0, 0, .45); }
::selection { background: var(--lit); color: var(--paper-ink); }

/* ---------- a pine garland with colored bulbs and bows (decoration only) ---------- */
.garland { display: block; overflow: visible; }
.garland .sb-g { fill: var(--c); }
.garland .sb-h { fill: var(--c); opacity: .2; }
.garland.dim .sb-g { opacity: .7; }
.garland.dim .sb-h { opacity: .08; }
/* the wave of lights: each bulb switches on in turn, left to right, 28 ms apart (a ramp, not a flash) */
.garland.wave .sb-g { animation: waveOn 1.9s calc(var(--i) * 28ms) both; }
.garland.wave .sb-h { animation: waveHalo 1.9s calc(var(--i) * 28ms) both; }
@keyframes waveOn { 0% { opacity: .3; } 15% { opacity: 1; } 100% { opacity: 1; } }
@keyframes waveHalo { 0% { opacity: .03; } 15% { opacity: .5; } 45% { opacity: .3; } 100% { opacity: .3; } }
.glow-wash { position: fixed; inset: 0; z-index: 94; pointer-events: none; opacity: 0;
  background: radial-gradient(120% 90% at 50% -10%, rgba(255, 215, 130, .3), rgba(255, 190, 70, .12) 45%, rgba(255, 150, 30, 0) 80%); }

/* ---------- your string of lights ---------- */
.mystring { display: flex; align-items: flex-start; justify-content: space-between; position: relative; padding: 0 2px; }
.mystring::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--line-2); }
.mystring i { flex: 0 1 22px; min-width: 0; }
.mystring .mb { display: block; width: 100%; height: auto; overflow: visible; }
.mb-now { animation: nowPulse 1.3s ease-in-out infinite alternate; transform-origin: 50% 20%; }
@keyframes nowPulse { from { transform: scale(1); } to { transform: scale(1.14); } }
.mstr { display: block; width: 100%; height: auto; overflow: visible; }

/* ---------- the countdown bulbs ---------- */
.cdl { display: flex; align-items: center; justify-content: space-between; position: relative; height: 22px; }
.cdl::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; border-radius: 2px; background: #14603e; }
.cdl i { position: relative; width: 16px; height: 16px; border-radius: 50%; transition: background .25s, box-shadow .25s; }
.cdl i.on { background: radial-gradient(circle at 38% 32%, #fff 0, var(--c) 46%); box-shadow: 0 0 0 1px #03120d, 0 0 11px 3px color-mix(in srgb, var(--c) 60%, transparent); }
.cdl i.off { background: #06201a; box-shadow: inset 0 0 0 2px var(--line-2); }
.cdl.hot i.on { animation: cdlHot 1s ease-in-out infinite; }
@keyframes cdlHot { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.22); } }

/* ---------- the stall awning, the tag's holly, Santa looking in ---------- */
.awning { position: absolute; display: block; filter: drop-shadow(0 10px 12px rgba(0, 0, 0, .35)); pointer-events: none; }
.santa-pop { position: absolute; z-index: 5; pointer-events: none; overflow: visible; animation: santaPop .6s var(--show-ease) both; }
.santa-pop.still { animation: none; }
@keyframes santaPop { 0% { transform: translateY(30px) scale(.6); opacity: 0; } 70% { transform: translateY(-4px) scale(1.04); opacity: 1; } 100% { transform: none; } }

/* ============================== BIG SCREEN ============================== */
.d-steps i { border-color: var(--edge); }
.d-steps i.done { background: var(--edge); border-color: var(--edge); }
.d-steps i.now { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 5px rgba(255, 201, 60, .18), 0 0 18px rgba(255, 190, 70, .6); }
.d-steps i.dbl { border-color: var(--lit); }
.d-join .code { padding-top: 0; color: var(--lit); }
.d-top { background: #06201a; left: calc(0px - var(--px, 0px)); right: calc(0px - var(--px, 0px)); top: 0; height: 84px; padding: 0 calc(56px + var(--px, 0px)); border-bottom: 1px solid var(--line); }

/* ---------- the lobby: the tree in the square ---------- */
.s-lobby .lob-swag { position: absolute; left: 0; top: 0; z-index: 3; }
.s-lobby .lob-left { left: 40px; top: 86px; width: 900px; z-index: 4; }
.s-lobby .marquee { padding: 0; background: none; box-shadow: none; border-radius: 0; }
.s-lobby .logo .l-top { font-size: 92px; }
.s-lobby .logo .l-avoya { font-size: 38px; margin-top: .2em; }
.tagline { font-family: var(--festive); font-weight: 700; font-size: 42px; line-height: 1.1; color: var(--ink); margin-top: 16px; letter-spacing: 0; text-shadow: 0 3px 0 #6d0c14; }
.lob-count { font-family: var(--show); font-size: 28px; color: var(--ink); letter-spacing: .02em; margin-top: 8px; }
.lob-count span { color: var(--lit); }
.scrim { position: relative; z-index: 0; display: inline-block; }
.scrim::before { content: ""; position: absolute; inset: -8px -30px; z-index: -1; border-radius: 30px; background: var(--bg); box-shadow: 0 0 18px 10px var(--bg); }
.joincard { right: 40px; top: 84px; width: 440px; padding: 54px 26px 16px; border-radius: 6px 6px 20px 20px; z-index: 4; }
.joincard .awning { left: -16px; top: -26px; width: calc(100% + 32px); height: 76px; }
.joincard .qrbox, .joincard.live .qrbox { width: 204px; height: 204px; border-radius: 16px; padding: 12px; box-shadow: 0 0 0 5px var(--trim), 0 0 0 8px var(--ink), 0 14px 30px rgba(0, 0, 0, .45); }
.joincard .scan, .joincard.live .scan { margin-top: 16px; font-size: 19px; }
.joincard .scan.then, .joincard.live .scan.then { margin-top: 2px; }
.joincard .scan.then b { color: var(--accent-hi); }
.joincard .url { font-size: 22px; margin-top: 2px; }
.joincard .url.long { font-size: 19px; }
.joincard .codelab, .joincard.live .codelab { margin-top: 8px; font-size: 17px; }
.joincard .bigcode { font-size: 78px; line-height: 1; color: var(--lit); text-shadow: 0 4px 0 #8a5606, 0 0 30px rgba(255, 190, 70, .35); }
/* the square: city lights behind, the big tree, Santa, and one present per player on the snow */
.square { position: absolute; left: 0; bottom: 0; width: 1600px; height: 680px; z-index: 2; pointer-events: none; }
.square .skyline { position: absolute; left: 0; bottom: 150px; width: 1600px; height: 190px; display: block; }
.square .ground { position: absolute; left: 0; bottom: 0; width: 1600px; height: 230px; display: block; }
.square .bigtree { position: absolute; left: 776px; bottom: 20px; width: 470px; height: 640px; display: block; overflow: visible; }
.square .santa { position: absolute; left: 584px; bottom: 150px; width: 216px; height: 196px; display: block; overflow: visible; transition: bottom .7s var(--show-ease); }
.bigtree .tl-a { animation: bulbGlow 2.6s ease-in-out infinite alternate; }
.bigtree .tl-b { animation: bulbGlow 2.6s ease-in-out -1.3s infinite alternate; }
@keyframes bulbGlow { from { opacity: 1; } to { opacity: .74; } }
.presents { position: absolute; left: 0; bottom: 0; width: 1600px; height: 290px; z-index: 5; }
.present { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 3px 3px 7px 7px; background: var(--wrap);
  box-shadow: inset 0 0 0 2px rgba(3, 18, 13, .55), inset 0 -8px 0 rgba(0, 0, 0, .14), 0 8px 14px rgba(0, 0, 0, .3); }
.present::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 16%; max-width: 30px; transform: translateX(-50%); background: var(--rib); box-shadow: inset 3px 0 0 rgba(255, 255, 255, .25), inset -3px 0 0 rgba(0, 0, 0, .12); }
.present .lid { position: absolute; left: -5px; right: -5px; top: -4px; height: 22%; min-height: 10px; border-radius: 4px; background: var(--wrap-hi); box-shadow: inset 0 0 0 2px rgba(3, 18, 13, .55), 0 3px 4px rgba(0, 0, 0, .25); }
.present .lid::before { content: ""; position: absolute; left: 50%; top: 2px; bottom: 2px; width: 16%; max-width: 30px; transform: translateX(-50%); background: var(--rib); }
.present .bow { position: absolute; left: 50%; top: 0; width: 46%; max-width: 78px; transform: translate(-50%, -62%); z-index: 2; overflow: visible; }
.present .tag { position: relative; z-index: 3; display: flex; align-items: center; justify-content: center; gap: .3em; max-width: calc(100% - 12px); margin-top: 12%; padding: .16em .5em .2em; border-radius: 6px; line-height: 1.1;
  background: var(--paper); color: var(--paper-ink); font-weight: 700; box-shadow: 0 0 0 1.5px rgba(3, 18, 13, .6), 0 2px 0 rgba(0, 0, 0, .25); }
.present .tag span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.present .tag .icon { width: .95em; height: .95em; color: #a8141f; }
.present.fresh { animation: presentIn .7s var(--show-ease) both; }
@keyframes presentIn { 0% { transform: translateY(-46px) rotate(-5deg); opacity: 0; } 60% { transform: translateY(4px) rotate(1deg); opacity: 1; } 100% { transform: none; } }
.present.more .tag { background: var(--bg-4); color: var(--lit); box-shadow: 0 0 0 1.5px var(--edge); }
.wrap-0 { --wrap: #c8202c; --wrap-hi: #e5383b; --rib: #fffaf0; }
.wrap-1 { --wrap: repeating-linear-gradient(90deg, #17683f 0 10px, #1d7a4b 10px 20px); --wrap-hi: #2a9460; --rib: #e5383b; }
.wrap-2 { --wrap: #f2b632; --wrap-hi: #ffd166; --rib: #c8202c; }
